name: PrivateScan APK
on:
  push:
    branches: [family-scan-prototype-20261030]
    paths:
      - 'scanner-app/**'
      - '.github/workflows/private-scan-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline RU/EN OCR language data and Unicode font
        run: |
          set -euo pipefail
          mkdir -p scanner-app/app/src/main/assets/tessdata scanner-app/app/src/main/assets/fonts
          curl --fail --location --retry 4 --silent --show-error             https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata             -o scanner-app/app/src/main/assets/tessdata/rus.traineddata
          curl --fail --location --retry 4 --silent --show-error             https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata             -o scanner-app/app/src/main/assets/tessdata/eng.traineddata
          curl --fail --location --retry 4 --silent --show-error             https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf             -o scanner-app/app/src/main/assets/fonts/NotoSans-Regular.ttf
          test "$(wc -c < scanner-app/app/src/main/assets/tessdata/rus.traineddata)" -gt 500000
          test "$(wc -c < scanner-app/app/src/main/assets/tessdata/eng.traineddata)" -gt 500000
          test "$(wc -c < scanner-app/app/src/main/assets/fonts/NotoSans-Regular.ttf)" -gt 100000
      - name: Build signed debug APK
        run: gradle -p scanner-app :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateScan-debug-apk
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
