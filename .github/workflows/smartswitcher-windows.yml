name: SmartSwitcher Windows x64

on:
  push:
    branches:
      - smartswitcher-actions
    paths:
      - 'SmartSwitcher/**'
      - '.github/workflows/smartswitcher-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    name: Test and publish Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests and package portable EXE
        shell: pwsh
        working-directory: SmartSwitcher
        run: ./Build-Windows.ps1
      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSwitcher-win-x64-v0.1.0
          path: SmartSwitcher/out/SmartSwitcher-win-x64-v0.1.0.zip
          if-no-files-found: error
          retention-days: 30
