<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>CRM Адвоката</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px 16px;color:#172c48;background:#f4f6fa;line-height:1.5}a{color:#2f5bd3}</style>
</head>
<body>
<p>Новая версия программы теперь открывается по основному адресу. Данные, внесённые здесь, перенесутся при первом открытии на этом устройстве.</p>
<p><a href="/" id="go">Открыть CRM Адвоката</a></p>
<script>
// переход (п. 10): снять service worker папки /next/ и открыть основной адрес
(async () => {
  try { if (navigator.serviceWorker) { const r = await navigator.serviceWorker.getRegistration('/next/'); if (r && new URL(r.scope).pathname === '/next/') await r.unregister(); } }
  catch (e) { /* штатно: без service worker — просто переход */ }
  location.replace('/');
})();
</script>
</body>
</html>
