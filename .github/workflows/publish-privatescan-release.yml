name: Publish PrivateScan v0.3 APK
on:
  push:
    branches: [privatescan-v03-offline-20261030]
    paths:
      - '.github/workflows/publish-privatescan-release.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PrivateScan-debug-apk
          run-id: 41119330175
          github-token: ${{ github.token }}
          path: ./release
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          unzip -tq release/app-debug.apk
          mv release/app-debug.apk release/PrivateScan-v0.3-debug.apk
          sha256sum release/PrivateScan-v0.3-debug.apk > release/SHA256SUMS.txt
      - name: Create public GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "privatescan-v0.3" \
            release/PrivateScan-v0.3-debug.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrivateScan v0.3 (test APK)" \
            --notes "Тестовая Android-сборка PrivateScan 0.3. Локальное RU/EN OCR и поисковый PDF, импорт PDF, системная передача в приложения ИИ. Код ChatGPT OAuth присутствует, но авторизация не проверена на телефоне. Только для тестирования на документах без конфиденциальных сведений. APK подписан отладочным ключом; обновления поверх других сборок могут не установиться."
