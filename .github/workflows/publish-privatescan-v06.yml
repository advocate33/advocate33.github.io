name: Publish PrivateScan v0.6 APK
on:
  push:
    branches: [privatescan-v06-portrait-overlay-20261031]
    paths: ['.github/workflows/publish-privatescan-v06.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful PrivateScan v0.6 build
        uses: actions/download-artifact@v4
        with:
          name: PrivateScan-debug-apk
          run-id: 41174039720
          github-token: ${{ github.token }}
          path: ./release
      - name: Validate integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          unzip -tq release/app-debug.apk
          mv release/app-debug.apk release/PrivateScan-v0.6-portrait-contour.apk
          sha256sum release/PrivateScan-v0.6-portrait-contour.apk > release/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "privatescan-v0.6" \
            release/PrivateScan-v0.6-portrait-contour.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrivateScan v0.6 — рамка, подтверждение и книжный A4" \
            --prerelease \
            --notes "Тестовая версия. Каскадный автозахват CameraX/OpenCV: реальный контур листа поверх изображения, звуковое и визуальное подтверждение фотографии, счётчик листов и ожидание смены документа. Камера и PDF строго в портретной ориентации A4. Исправлено окно выбора браузера ChatGPT OAuth (setMessage скрывал setItems на Samsung): теперь можно выбрать Chrome. ВНИМАНИЕ: успешное OAuth-подключение ChatGPT и работа камеры на реальном Samsung ещё не проверены. Сканирование и локальное OCR тестируйте на документах без конфиденциальных данных. Устанавливается отдельно от 0.5, пока подпись из постоянного keystore не настроена."
