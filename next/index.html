<style>
/* ═══ tokens.css — оформление новой версии (этап 1б) ═══
   Источник — src/app.css «Практики» 1.1 (reference/CRM_Practice_v1_1). Поправки (DIZAJN_praktika.md):
   • вспомогательный текст светлой темы #5b6b80 → #56667b (контраст не ниже 5:1 на всех светлых поверхностях — раздел 7);
   • радиусы сведены к трём: 6 / 10 / 12 px;
   • имена переменных — наши: --accent, --on-accent, --accent-soft, --text, --text-muted;
   • на html и body нет overflow — иначе на телефоне пропадает прокрутка пальцем (урок 30);
   • внешних шрифтов и url() нет (правило 2). */
:root{color-scheme:light;
  --bg:#f3f5f9;--surface:#fff;--surface2:#f7f9fc;--text:#22324a;--text-muted:#56667b;--line:#dce3ed;
  --accent:#345dcb;--accent-soft:#eaf0ff;--on-accent:#fff;
  --nav:#172c48;--nav-ink:#e9f0fa;--nav-muted:#b3c2d6;
  --good:#206c55;--good-bg:#e8f5ee;--warn:#865116;--warn-bg:#fff3df;--bad:#b3343d;--bad-bg:#fff0f0;
  --shadow:0 8px 28px #12294a0b;--r-sm:6px;--r-md:10px;--radius:12px;
  --app-font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--font-scale:1;
  --touch:44px}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#111a28;--surface:#1a2739;--surface2:#213146;--text:#edf3ff;--text-muted:#b0bfd2;--line:#394b63;
  --accent:#99b6ff;--accent-soft:#283f66;--on-accent:#142648;
  --nav:#0d1623;--nav-ink:#e9f0fa;--nav-muted:#b3c2d6;
  --good:#93d6b7;--good-bg:#203e34;--warn:#f3ca89;--warn-bg:#403421;--bad:#ffadb2;--bad-bg:#492c36;--shadow:0 8px 28px #0002}
html{font:calc(16px * var(--font-scale))/1.5 var(--app-font);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:transparent}
button:disabled{cursor:default;opacity:.6}
a{color:var(--accent);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-size:1.8rem;line-height:1.2;letter-spacing:-.035em;font-weight:650}
h2{font-size:1.08rem;font-weight:650}
h3{font-size:1rem;font-weight:600}
.small{font-size:.8125rem}.muted{color:var(--text-muted)}.num{font-variant-numeric:tabular-nums}
.icon{width:20px;height:20px;stroke-width:1.75;flex:none;vertical-align:middle}
.icon-sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
[hidden]{display:none!important}
.grow{flex:1;min-width:0}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:grid;gap:18px;align-content:start}

/* ── каркас: боковая панель на всю высоту, верхняя панель, рабочая область ── */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--nav);color:var(--nav-ink);padding:22px 14px 14px}
.sidebar>nav{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:#ffffff30 transparent}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 14px;flex:none}
.brand-mark{height:38px;width:38px;display:grid;place-items:center;border:1px solid #ffffff60;border-radius:var(--r-md);font-size:25px;font-family:Georgia,'Times New Roman',serif;color:#fff;flex:none}
.brand strong{display:block;letter-spacing:.06em;font-size:.875rem;white-space:nowrap}
.brand small{color:var(--nav-muted);font-size:.75rem}
.nav-label{color:var(--nav-muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px 4px}
.nav-item{width:100%;min-height:38px;display:flex;align-items:center;gap:11px;text-align:left;padding:7px 13px;color:var(--nav-muted);border-radius:var(--r-md);font-size:.875rem;margin:1px 0}
.nav-item:hover{background:#ffffff0c;color:var(--nav-ink)}
.nav-item.active{color:#fff;background:#ffffff17;font-weight:600;box-shadow:inset 3px 0 #8baeff}
.nav-item .count{margin-left:auto;background:#ffffff14;font-size:.75rem;padding:0 6px;border-radius:var(--r-sm)}
.nav-bottom{flex:none;margin-top:10px;padding-top:10px;border-top:1px solid #ffffff20}
.workspace{min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 30px;min-height:76px;border-bottom:1px solid var(--line);background:var(--surface)}
.top-brand{display:none}
.search-wrap{position:relative;flex:1;max-width:430px;min-width:0;color:var(--text-muted)}
.search-wrap input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px 10px 37px;font-size:.875rem;height:42px}
.search-wrap>.icon{position:absolute;left:12px;top:12px;width:17px;height:17px;pointer-events:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync-status{font-size:.75rem;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:var(--touch);padding:0 6px;border-radius:var(--r-md)}
.sync-status:hover{background:var(--surface2)}
.sync-status .icon{width:16px;height:16px}
/* width:100% — элемент сетки с auto-полями иначе сжимается до ширины содержимого (замечание пользователя 30.09.2026) */
.main{padding:28px 30px 36px;max-width:1600px;margin:0 auto;width:100%}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.page-head .subtitle{font-size:.875rem;color:var(--text-muted);margin-top:7px}
.head-actions,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── кнопки, значки, панели ── */
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:.875rem;font-weight:600;text-decoration:none}
.button:hover{background:var(--surface2)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.button.primary:hover{filter:brightness(.96)}
.button.small-btn{min-height:36px;padding:7px 10px;font-size:.8125rem}
.button .icon{width:17px;height:17px}
.icon-button{display:inline-grid;place-items:center;min-width:42px;min-height:42px;border-radius:var(--r-md);color:var(--text-muted)}
.icon-button:hover{background:var(--surface2);color:var(--text)}
.text-button{min-height:38px;padding:5px 0;color:var(--accent);font-size:.875rem;text-align:left;display:inline-flex;align-items:center;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel.pad{padding:22px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title h2{display:flex;align-items:center;gap:8px}
.panel.collapsed .panel-title{border-bottom:0}
.panel-tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.panel-tools .text-button{min-height:36px;font-size:.8125rem;padding:5px 8px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-sm);padding:3px 7px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--text-muted);white-space:normal;max-width:100%}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.good{background:var(--good-bg);color:var(--good)}
.empty{padding:40px 22px;text-align:center;color:var(--text-muted)}
.empty>.icon{width:35px;height:35px;margin-bottom:14px;color:var(--accent);opacity:.65}
.empty h3{color:var(--text);margin-bottom:8px}
.empty p{max-width:460px;margin:0 auto 12px;font-size:.875rem}
.intro-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;margin-bottom:24px;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius)}
.intro-strip h2{color:var(--accent);margin-bottom:5px}
.intro-strip p{color:var(--text-muted);font-size:.875rem;max-width:720px}
.info-box{padding:14px 16px;background:var(--surface2);border-radius:var(--r-md);font-size:.8125rem;line-height:1.6;color:var(--text-muted);margin:14px 0}
.info-box.warning{background:var(--warn-bg);color:var(--warn)}

/* ── «Сегодня»: показатели, строки, расписание, ближайшее заседание ── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}
.stat{padding:17px 19px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);min-width:0}
.stat-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8125rem;color:var(--text-muted)}
.stat-label .icon{width:18px;height:18px}
.stat-value{font-size:1.9rem;line-height:1.2;letter-spacing:-.03em;margin-top:9px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-value.small-value{font-size:1.45rem}
.stat.alert .stat-value{color:var(--bad)}
.stat-meta{font-size:.75rem;color:var(--text-muted);margin-top:6px}
.day-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,1fr);gap:22px;align-items:start}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:0}
.task-check{display:grid;place-items:center;min-width:28px;min-height:28px;cursor:pointer;flex:none}
.task-check input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.task-title{display:block;font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.task-sub{font-size:.8125rem;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere}
.task-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.task-date{font-size:.8125rem;color:var(--text-muted);white-space:nowrap;padding-top:2px}
.task-date.overdue{color:var(--bad);font-weight:600}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"main done x";align-items:start;gap:4px 10px;padding:14px 10px 14px 20px;border-bottom:1px solid var(--line)}
.imp-row:last-of-type{border-bottom:0}
.imp-main{grid-area:main;min-width:0}.imp-done{grid-area:done}.imp-x{grid-area:x;margin-top:-4px}
.imp-done .button{min-height:36px}
.task-when{color:var(--text-muted);font-weight:600}.task-when.overdue{color:var(--bad)}
.panel-foot{font-size:.8125rem;color:var(--text-muted);padding:12px 20px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agenda-row{display:grid;grid-template-columns:55px minmax(0,1fr);gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.agenda-row:last-child{border-bottom:0}.agenda-row+.day-mark{border-top:0}
.agenda-time{font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.875rem;overflow-wrap:anywhere}
.agenda-title{font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.agenda-sub{font-size:.8125rem;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere}
.agenda-stripe{padding:0 0 0 13px;border-left:3px solid var(--accent);min-width:0}
.agenda-stripe.meeting{border-color:var(--good)}
.agenda-stripe.task{border-color:var(--warn)}
.agenda-stripe.deadline{border-color:var(--bad)}
.agenda-stripe.done{opacity:.7}
.agenda-row .badge{margin-top:8px}
.day-mark{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line)}
.upcoming-hero{background:var(--nav);color:#fff;padding:20px 22px 22px;border-radius:var(--radius)}
.upcoming-hero small{color:#bdcce0;font-size:.8125rem}
.upcoming-hero .hero-time{font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.04em;margin:10px 0}
.upcoming-hero h2{overflow-wrap:anywhere}
.upcoming-hero p{color:#d6e0ee;font-size:.875rem;margin-top:7px;overflow-wrap:anywhere}
.upcoming-hero .icon-button{color:#bdcce0;margin:-10px -12px 0 0}
.upcoming-hero .icon-button:hover{background:#ffffff17;color:#fff}
.collapsed-note{font-size:.8125rem;color:var(--text-muted);display:flex;justify-content:flex-end}

/* ── заглушки разделов, листы, сообщения ── */
.stub-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
dialog{position:fixed;padding:0;margin:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 22px 80px #0005;overflow:auto}
dialog::backdrop{background:#0c183a70}
.modal-head{padding:18px 16px 14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h2{font-size:1.2rem}
.modal-content{padding:20px 24px 24px}
.modal-content>p{font-size:.9375rem;margin:0 0 12px}
.list-rows>*{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.875rem}
.list-rows>*:last-child{border-bottom:0}
.list-rows .muted{text-align:right}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.choice .button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.section-label{color:var(--text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.section-label:first-child{margin-top:0}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-tile{padding:14px;text-align:left;display:flex;align-items:center;gap:10px;min-height:var(--touch);font-size:.875rem;font-weight:600;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.more-tile .icon{color:var(--accent)}
.search-result{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.search-result:last-child{border-bottom:0}
#toast{position:fixed;top:auto;left:auto;right:24px;bottom:25px;margin:0;border:0;width:auto;height:auto;overflow:visible;max-width:min(460px,calc(100vw - 32px));border-radius:var(--r-md);background:var(--nav);color:#fff;padding:13px 18px;font-size:.875rem;box-shadow:0 6px 22px #0003;z-index:1000;display:none}
#toast.visible{display:block}
/* popover: сброс отступов и рамки верхнего слоя, место — как у обычного сообщения */
#toast:popover-open{display:block}
#toast::backdrop{display:none}
.upd-bar{position:fixed;right:24px;bottom:84px;max-width:min(520px,calc(100vw - 32px));z-index:999;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 6px 22px #0003;font-size:.875rem}
.upd-bar .upd-actions{display:flex;gap:8px;flex-wrap:wrap}
#toast.error{background:#873a42}
.stop-screen{max-width:560px;margin:14vh auto;padding:28px}
.bottom-nav{display:none}

/* ── точки перелома «Практики»: 1180 / 900 / 640 ── */
@media(max-width:1180px){
  .layout{grid-template-columns:188px minmax(0,1fr)}.sidebar{padding:21px 10px}.brand{padding:0 8px 20px;gap:9px}.brand strong{font-size:.875rem}
  .main{padding:24px 20px}.topbar{padding:14px 20px}.day-grid{grid-template-columns:minmax(0,1.15fr) minmax(280px,1fr)}
  .stats{gap:10px}.stat{padding:15px}.stat-value{font-size:1.65rem}}
@media(max-width:900px){
  .layout{grid-template-columns:78px minmax(0,1fr)}.brand{justify-content:center;padding:0 0 20px}
  .brand>div:last-child,.nav-label,.nav-item span,.nav-item .count{display:none}
  .nav-item{justify-content:center;padding:12px}.nav-item .icon{width:22px;height:22px}.sidebar{padding:18px 10px}
  .day-grid{grid-template-columns:1fr}.sync-status span{display:none}.intro-strip{align-items:flex-start;flex-direction:column;gap:14px}}

  .topbar{padding:10px 12px;gap:8px;min-height:64px}.top-brand{display:grid}.top-brand .brand-mark{border-color:var(--line);color:var(--accent);width:34px;height:34px;font-size:21px}
  .search-wrap{max-width:none}.search-wrap input{font-size:1rem;height:var(--touch)}.search-wrap>.icon{top:13px}.top-actions{gap:2px}
  .main{padding:20px 14px 110px}.page-head{margin-bottom:18px;gap:12px}.page-head h1{font-size:1.65rem}.page-head .subtitle{font-size:.8125rem}
  button,.button,.button.small-btn,.text-button,.panel-tools .text-button,.row-actions .button{min-height:var(--touch)}
  .icon-button{min-width:var(--touch);min-height:var(--touch)}
  .page-head .head-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}.head-actions .button{padding:9px 6px;font-size:.8125rem;gap:6px}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;padding:6px 6px calc(7px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:30;box-shadow:0 -5px 20px #16274708}
  .bottom-nav button{min-height:52px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;border-radius:var(--r-md)}
  .bottom-nav button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .bottom-nav .icon{width:21px;height:21px}
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{padding:14px}.stat-value{font-size:1.65rem}.stat-value.small-value{font-size:1.3rem}.stat-label{font-size:.75rem}
  .day-grid{gap:16px}.day-grid>.stack{display:contents}
  .t-important{order:1}.t-hero{order:2}.t-schedule{order:3}.t-tomorrow{order:4}.t-mon{order:5}.t-review{order:6}.t-next{order:7}.t-work{order:8}
  .panel.pad{padding:18px}.panel-title{padding:10px 8px 10px 16px}
  .imp-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main x" "done done";padding:12px 4px 12px 16px;gap:8px}
  .imp-done .button{min-height:var(--touch)}
  .panel-foot{padding:10px 16px 12px}
  .agenda-row{padding:15px 16px;gap:10px;grid-template-columns:48px minmax(0,1fr)}
  .day-mark{padding:9px 16px}
  .intro-strip{padding:18px;margin-bottom:18px}
  dialog{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}.modal-head{padding:12px 8px 10px 18px}.modal-content{padding:16px 18px 20px}
  #toast{right:16px;bottom:150px}.upd-bar{right:16px;left:16px;bottom:212px}.more-grid{gap:8px}}

/* ── «Дела» (этап 1в): фильтры, список, таблица, доска, панель карточки справа ── */
.work-grid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.side{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}

      if (cs && !row.caseId) { row.caseId = cs.id; changed = true; }
      if (store === 'files' && row.caseId && !row.caseNum) {

// v230: занятость времени. Слот заседания и встречи — 30 минут (SLOT_MIN), у встречи может быть своя длительность.
// Заседание ↔ заседание: один суд — 30 мин, разные — сумма «времени в пути» до судов (реквизиты, по умолчанию 60);
// заседание ↔ встреча: 30 мин + время в пути до суда; встреча ↔ встреча: большая из длительностей. Возвращает текст или ''.
const SLOT_MIN = 30;
function busyClash(kind, item, hearings, meetings, found) {
  found = found || [];

  const t0 = toMin(item.time); if (t0 === null || !item.date) return '';

  (meetings || []).forEach(o => { if (o.id !== item.id && o.date === item.date) rows.push({ kind: 'meeting', o }); });

    else if (kind === 'meeting' && r.kind === 'meeting') { need = Math.max(dur(item), dur(r.o)); why = 'встречи занимают ' + need; }

}

// Секреты прежней версии из копии не принимаются (mergeIncoming(…, false)): адрес, код и пароль вводятся здесь.

const NEXT_SRV_HOST = 'https://functions.yandexcloud.net/';
const NEXT_SYNC = { busy: false };

// Адрес сервера: только функция Яндекс Облака — этот же адрес разрешён в CSP. Возвращает текст ошибки или ''.
function nextSrvUrlCheck(url) {
  const u = String(url || '').trim();
  if (!u) return 'Укажите адрес сервера';
  if (!u.startsWith(NEXT_SRV_HOST)) return 'Адрес сервера начинается с ' + NEXT_SRV_HOST;
  if (!/^[A-Za-z0-9_-]{8,}$/.test(u.slice(NEXT_SRV_HOST.length))) return 'После ' + NEXT_SRV_HOST + ' — идентификатор функции: латинские буквы и цифры, без пробелов';
  return '';
}
// Ответ сервера человеческими словами
// почему база не открылась: формат новее программы, браузер без распаковки сжатой базы или пароль
function nextDecryptWhy(e) { const w = String((e && e.message) || ''); return w === 'unsupported_version' ? 'база на сервере записана более новой версией программы — обновите страницу' : w === 'no_unzip' ? 'база сжата, а этот браузер не умеет её распаковывать — обновите браузер' : 'decrypt'; }

  if (j.blocked) return 'запись на сервер в новой версии отключена';
  if (e === 'auth') return 'неверный секретный код';
  if (e === 'network') return 'нет связи с сервером';
  if (e === 'timeout') return 'сервер не ответил за 20 секунд';
  if (e === 'invalid_url') return 'адрес сервера указан неверно';
  if (e === 'decrypt') return 'пароль шифрования не подошёл';
  if (e === 'format') return 'на сервере файл другого формата';
  if (/^http_/.test(e)) return 'сервер ответил ошибкой ' + e.slice(5);
  if (e) return e.slice(0, 80);
  // жалоба пользователя 02.10.2026: «сервер не ответил» при отправке базы. Ответ без поля error даёт не наш сервер, а само
  // облако, когда прерывает функцию (по времени, по памяти, из-за размера запроса) — показываем его текст и что проверить
  const pm = String(j.errorMessage || j.message || j.errorType || '').trim();
  // второй снимок пользователя 02.10.2026: «Request Entity Too Large» — к ответу облака была приписана догадка про таймаут.
  // Совет даётся только тогда, когда текст облака сам называет причину; иначе — текст как есть, без догадок.
  if (/too large|larger than limits|entity/i.test(pm)) return 'база больше, чем Яндекс Облако принимает за один запрос: «' + pm.slice(0, 100) + '». Посмотрите «Размер базы» в листе «Синхронизация» — там видно, что занимает место и какой предел';
  if (/time|timed|таймаут|deadline/i.test(pm)) return 'облако прервало работу сервера по времени («' + pm.slice(0, 100) + '»): Яндекс Облако → crm-bridge → «Редактор» → «Таймаут» — поставьте 60 секунд, «Сохранить изменения», затем повторите';
  if (/memory|памят/i.test(pm)) return 'облаку не хватило памяти функции («' + pm.slice(0, 100) + '»): Яндекс Облако → crm-bridge → «Редактор» → «Память» — поставьте 256 МБ';
  return pm ? 'облако прервало работу сервера: «' + pm.slice(0, 140) + '»' : 'сервер прервал запрос, не назвав причину — пришлите строки с ошибкой из журнала функции crm-bridge (Яндекс Облако → crm-bridge → «Логи»)';
}
const nextSrvConfigured = () => !!(SRV.url && SRV.secret && SRVDB.pass);

// Проверка связи: сервер отвечает и принимает секретный код. Ничего не меняет ни здесь, ни на сервере.
async function nextServerCheck() {
  const p = await srvCall('ping');
  if (!p || !p.ok) { const msg = nextSrvError(p); srvdbNote('err', msg); return { ok: false, error: msg }; }
  const v = await srvCall('dbver');
  if (!v || !v.ok) { const msg = nextSrvError(v); srvdbNote('err', msg); return { ok: false, error: msg }; }
  localStorage.setItem('crm_next_srv_checked', SRV.url); SRVDB.lastErr = null; syncStatusRender();
  if (typeof nextSnapSet === 'function') nextSnapSet(Number(p.ver || 0) >= 180); // v180: снимки по ссылке
  // v181: состояние правила CORS бакета — хранилище отвечает на предварительный запрос или нет (снимок пользователя 03.10.2026)
  let cors = null; if (Number(p.ver || 0) >= 181) { const c = await srvCall('corscheck'); if (c && c.ok) cors = { enabled: !!c.enabled, text: c.probe ? (c.probe.status + (c.probe.text ? ' «' + c.probe.text + '»' : '')) : '' }; }
  return { ok: true, srvVer: Number(p.ver || 0), dbVer: Number(v.ver || 0), cors };
}
const nextSrvChecked = () => !!SRV.url && localStorage.getItem('crm_next_srv_checked') === SRV.url;

// Расшифровать снимок с сервера и влить в базу новой версии
async function srvdbMergeSnapshot(snapshot, silent) {
  if (!snapshot || !snapshot.ok || !snapshot.exists || !snapshot.data) return { ok: true, empty: true, added: 0, updated: 0 };
  let dump;
  try { dump = await decryptDump(snapshot.data, SRVDB.pass); }
  catch (e) { return { ok: false, error: nextDecryptWhy(e) }; }
  if (!dump || dump._fmt !== SYNC_FMT || !dump.data) return { ok: false, error: 'format' };
  const merged = await mergeIncoming(dump, false);
  // аудит GPT 03.10.2026: при недосохранённых записях (failed) версия сервера не считается полученной — следующая проверка загрузит снова
  if (!merged.failed) SRVDB.ver = Number(snapshot.ver || 0);
  SRVDB.lastAt = Date.now();
  if (merged.added || merged.updated || merged.settingsChanged) {
    try { await loadRefs(); await refreshCasesCache(); } catch (e) { logErr('pull:refresh', e); }
    // открытый лист или форма в боковой панели не закрываются фоновым обновлением (nav закрывает панель); экран обновится при следующем переходе
    if (UI.ready && !(typeof sheetIsOpen === 'function' && sheetIsOpen())) nav(UI.screen);
  }
  if (!silent) toast('С сервера: новых записей — ' + merged.added + ', обновлено — ' + merged.updated);
  return { ok: true, ...merged };
}

// Загрузить базу с сервера (по кнопке). Возвращает { ok, added, updated, … } или { ok:false, error: 'текст' }.
async function nextServerPull() {
  if (NEXT_SYNC.busy) return { ok: false, error: 'загрузка уже идёт' };
  if (!SRV.url || !SRV.secret) return { ok: false, error: 'сначала укажите адрес сервера и секретный код' };
  if (!SRVDB.pass) return { ok: false, error: 'сначала укажите пароль шифрования' };
  NEXT_SYNC.busy = true; syncStatusRender();
  // аудит GPT 03.10.2026: неотправленные правки устройства не считаются отправленными после загрузки — отметку снимает только отправка
  const hadLocal = nextLocalChanges();
  try {
    const g = await nextDbGet();
    if (!g || !g.ok) { const msg = nextSrvError(g); srvdbNote('err', msg); return { ok: false, error: msg }; }
    const r = await srvdbMergeSnapshot(g, true);
    if (!r.ok) { const msg = nextSrvError(r); srvdbNote('err', msg); return { ok: false, error: msg }; }
    if (r.empty) { SRVDB.lastErr = null; return r; }
    if (r.failed) { const msg = 'не записано записей: ' + r.failed + ' — повторите загрузку'; srvdbNote('err', msg); return { ...r, ok: false, error: msg }; }
    if (!hadLocal) localStorage.setItem('crm_next_pull_rev', syncRevision());
    localStorage.setItem('crm_next_pull_res', JSON.stringify({ added: r.added, updated: r.updated, conflicts: r.conflicts || 0 }));
    srvdbNote('pull');
    return r;
  } catch (e) { logErr('pull', e); const msg = String((e && e.message) || e).slice(0, 80); srvdbNote('err', msg); return { ok: false, error: msg }; }
  finally { NEXT_SYNC.busy = false; syncStatusRender(); }
}
// ── Проверка слияния без записи (этап 4, часть 2б) ──
// Перед включением записи на сервер пользователь видит на своей базе: что пришло бы с сервера на устройство, что ушло бы с
// устройства на сервер, какие записи правились с обеих сторон и что программа выбрала бы. Ничего не записывается: с сервера
// только dbget, на устройстве — только чтение (mergeIncoming в режиме dryRun, v297).
const PREVIEW_TITLES = { cases: 'Дела', clients: 'Доверители', hearings: 'Заседания', tasks: 'Задачи', finance: 'Счета и платежи', documents: 'Документы', meetings: 'Встречи', mail: 'Переписка', leads: 'Обращения', expenses: 'Расходы', refs: 'Справочники', monitorEvents: 'События судов', caseEvents: 'Журнал изменений дел', time: 'Учёт времени', deposits: 'Депозиты', poa: 'Доверенности', templates: 'Шаблоны', orders: 'Ордера', files: 'Файлы', workflows: 'Процессы', workflowRuns: 'Запуски процессов', correspondence: 'Корреспонденция', docVersions: 'Версии документов', docBlobs: 'Файлы документов', aiSessions: 'Сеансы помощника' };
// Чистая модель: local и remote — { раздел: [записи] }, base — время прошлого слияния. По каждому разделу:
// dAdd / dUpd — новых и изменённых для устройства; sAdd / sUpd / sDel — новых, изменённых и удалённых для сервера;
// both — правились с обеих сторон после прошлого слияния.
function mergePreviewModel(local, remote, base) {
  const out = { stores: [], toDevice: { add: 0, upd: 0 }, toServer: { add: 0, upd: 0, del: 0 }, both: 0, same: 0 };
  const names = Object.keys(local || {}).concat(Object.keys(remote || {}).filter(k => !(k in (local || {}))));
  for (const s of names) {
    const L = ((local || {})[s] || []).filter(r => r && r.id != null), R = ((remote || {})[s] || []).filter(r => r && r.id != null);
    const lm = new Map(L.map(r => [r.id, r])), rm = new Map(R.map(r => [r.id, r]));
    const row = { store: s, title: PREVIEW_TITLES[s] || s, dAdd: 0, dUpd: 0, sAdd: 0, sUpd: 0, sDel: 0, both: 0, same: 0 };
    for (const r of R) {
      const c = lm.get(r.id);
      if (!c) { if (!r._deleted) row.dAdd++; continue; }
      const ct = c._upd || 0, rt = r._upd || 0;
      if (ct === rt) { row.same++; continue; }
      if (base && ct > base && rt > base) row.both++;
      if (rt > ct) row.dUpd++; else if (c._deleted && !r._deleted) row.sDel++; else row.sUpd++;
    }
    for (const c of L) if (!rm.has(c.id) && !c._deleted) row.sAdd++;
    out.toDevice.add += row.dAdd; out.toDevice.upd += row.dUpd; out.toServer.add += row.sAdd; out.toServer.upd += row.sUpd; out.toServer.del += row.sDel; out.both += row.both; out.same += row.same;
    if (row.dAdd || row.dUpd || row.sAdd || row.sUpd || row.sDel || row.both) out.stores.push(row);
  }
  return out;
}
// Вывод словами: что означает сверка для пользователя
function mergePreviewVerdict(m, conflicts) {
  const toS = m.toServer.add + m.toServer.upd + m.toServer.del, toD = m.toDevice.add + m.toDevice.upd;

  if (!toS && !toD) return { kind: 'ok', text: 'База на устройстве и база на сервере совпадают. Запись на сервер ничего бы не изменила.' };
  if (!toS) return { kind: 'ok', text: 'На сервере есть данные новее, чем на устройстве: «Загрузить базу с сервера» их добавит. С устройства на сервер отправлять нечего.' };
  return { kind: 'ok', text: 'На устройстве есть записи, которых нет на сервере или которые новее: ' + toS + '. При включённой записи они ушли бы на сервер. Спорных правок нет.' };
}
// Итог без имён и номеров дел — его можно переслать в чат
function mergePreviewText(res, now) {
  const m = res.model, d = new Date(now || Date.now()).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const lines = ['Проверка слияния ' + d + ' (сборка ' + (typeof BUILD_ID === 'string' ? BUILD_ID : '') + ')',
    'С сервера на устройство: новых ' + m.toDevice.add + ', изменённых ' + m.toDevice.upd,
    'С устройства на сервер: новых ' + m.toServer.add + ', изменённых ' + m.toServer.upd + ', удалённых ' + m.toServer.del,
    'Правились с обеих сторон: ' + (res.conflictsTotal || 0) + '; совпадают: ' + m.same];
  m.stores.forEach(r => lines.push(r.title + ': с сервера +' + r.dAdd + ' ~' + r.dUpd + '; на сервер +' + r.sAdd + ' ~' + r.sUpd + ' −' + r.sDel + (r.both ? '; с обеих сторон ' + r.both : '')));

let MERGE_PREVIEW_LAST = null;
async function nextMergePreview() {
  if (NEXT_SYNC.busy) return { ok: false, error: 'идёт загрузка — дождитесь её окончания' };
  if (!SRV.url || !SRV.secret) return { ok: false, error: 'сначала укажите адрес сервера и секретный код' };
  if (!SRVDB.pass) return { ok: false, error: 'сначала укажите пароль шифрования' };
  NEXT_SYNC.busy = true; syncStatusRender();
  try {
    const g = await nextDbGet();
    if (!g || !g.ok) return { ok: false, error: nextSrvError(g) };
    if (!g.exists || !g.data) return { ok: true, empty: true };
    let dump; try { dump = await decryptDump(g.data, SRVDB.pass); } catch (e) { return { ok: false, error: nextSrvError({ error: nextDecryptWhy(e) }) }; }
    if (!dump || dump._fmt !== SYNC_FMT || !dump.data) return { ok: false, error: nextSrvError({ error: 'format' }) };
    const local = {}; for (const s of STORES) local[s] = await getAllRaw(s);
    const model = mergePreviewModel(local, dump.data, Number(localStorage.getItem('crm_merge_base') || 0));
    const dry = await mergeIncoming(JSON.parse(JSON.stringify(dump)), false, { dryRun: true });
    // формат шифроконтейнера на сервере: 3 — сжатый (v314); нужен, чтобы предложить заменить несжатую базу сжатой
    let srvFmt = 0; try { srvFmt = Number(JSON.parse(g.data).v || 1); } catch (e) { srvFmt = 0; }
    return { ok: true, ver: Number(g.ver || 0), srvFmt, model, conflicts: (dry.conflictList || []).slice(0, 30), conflictsTotal: dry.conflicts || 0 };
  } catch (e) { logErr('preview', e); return { ok: false, error: String((e && e.message) || e).slice(0, 120) }; }
  finally { NEXT_SYNC.busy = false; syncStatusRender(); }
}
// Лист с итогом. res — готовый результат (для ui_check и повторного показа); без него — сверка с сервером.

  openSheet('Проверка слияния', `<div class="info-box">Ничего не записано — ни на устройство, ни на сервер. Это сверка базы на устройстве с базой на сервере${res.ver > 1e11 ? ' (на сервере — версия от ' + esc(new Date(res.ver).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })) + ')' : ''}.</div>
    <div class="info-box${v.kind === 'warn' ? ' warning' : ''}" id="mp-verdict">${esc(v.text)}</div>
    <div class="section-label">С сервера на это устройство</div>${dev || '<p class="small muted">Новых данных на сервере нет.</p>'}
    <div class="section-label">С этого устройства на сервер</div>${srv || '<p class="small muted">На сервере есть всё, что есть на устройстве.</p>'}
    <p class="small muted">Совпадающих записей: ${m.same}. На сервер изменения уходят только по кнопке «Отправить изменения на сервер».</p>
    ${res.conflictsTotal ? `<div class="section-label">Правились с обеих сторон · ${res.conflictsTotal}</div>${conf}${res.conflictsTotal > (res.conflicts || []).length ? `<p class="small muted">Показаны первые ${(res.conflicts || []).length}.</p>` : ''}` : ''}

// Как в прежней программе: после правки — отправка через несколько секунд (сначала вливается свежая база с сервера),
// с сервера — проверка номера версии каждые AUTO_PULL_MS и при возврате в программу или появлении сети.
// Включается переключателем в листе «Синхронизация» и только после хотя бы одной удачной отправки по кнопке; по умолчанию
// выключен. Сбой не повторяется бесконечно: пауза растёт до 10 минут, причина — в строке состояния. Отправка идёт тем же
// nextServerPush (получить → влить → отправить с версией), запись на сервер открыта только на время отправки.
const AUTO_KEY = 'crm_next_auto', AUTO_PUSH_DELAY = 4000, AUTO_PULL_MS = 5 * 60000, AUTO_RETRY_MIN = 60000, AUTO_RETRY_MAX = 10 * 60000;
const NEXT_AUTO = { dirty: false, timer: null, loop: null, fails: 0, lastPullCheck: 0 };

function nextAutoRetryMs(fails) { return Math.min(AUTO_RETRY_MAX, AUTO_RETRY_MIN * Math.pow(2, Math.max(0, fails - 1))); }

function srvdbTouch() {
  if (!nextAutoOn()) return;
  NEXT_AUTO.dirty = true;
  clearTimeout(NEXT_AUTO.timer); NEXT_AUTO.timer = setTimeout(() => { nextAutoPush('правка').catch(e => logErr('auto:push', e)); }, AUTO_PUSH_DELAY);
}
async function nextAutoPush(reason) {
  if (!nextAutoOn()) return null;
  if (NEXT_SYNC.busy) { clearTimeout(NEXT_AUTO.timer); NEXT_AUTO.timer = setTimeout(() => nextAutoPush(reason).catch(e => logErr('auto:push', e)), AUTO_PUSH_DELAY); return null; }
  // защита прежней программы — та же, что у кнопки: нужная версия должна быть подтверждена
  let size = null; try { size = await dbSizeNow(); } catch (e) { logErr('auto:size', e); }
  if (size && size.needOld > oldVerOk()) { NEXT_AUTO.dirty = true; srvdbNote('err', 'автообмен остановлен: прежняя программа на других устройствах должна быть не ниже ' + size.needOld + ' — подтвердите это в «Отправить изменения на сервер»'); return { ok: false, error: 'oldver' }; }
  NEXT_AUTO.dirty = false;
  // вливание с сервера тоже пишет в базу и зовёт srvdbTouch — без этой проверки два устройства гоняли бы базу по кругу
  if (!nextLocalChanges()) return { ok: true, skipped: true };
  const r = await nextServerPush();
  if (r && r.ok) { NEXT_AUTO.fails = 0; if (nextLocalChanges()) srvdbTouch(); if (UI.ready && !sheetIsOpen()) nav(UI.screen); return r; }
  NEXT_AUTO.dirty = true; NEXT_AUTO.fails++;
  clearTimeout(NEXT_AUTO.timer); NEXT_AUTO.timer = setTimeout(() => nextAutoPush('повтор').catch(e => logErr('auto:push', e)), nextAutoRetryMs(NEXT_AUTO.fails));
  return r;
}
// проверка сервера: другая версия — получить и влить; затем отправить своё, если есть
async function nextAutoPull(force) {
  if (!nextAutoOn() || NEXT_SYNC.busy) return null;
  const v = await srvCall('dbver');
  if (!v || !v.ok) { srvdbNote('err', nextSrvError(v)); return v; }
  if (v.ver && (force || Number(v.ver) !== SRVDB.ver)) {
    NEXT_SYNC.busy = true; syncStatusRender();
    // аудит GPT 03.10.2026: неотправленные правки не считаются отправленными после загрузки; недосохранённые записи — ошибка и повтор
    const hadLocal = nextLocalChanges();
    try {
      const g = await nextDbGet();
      if (!g || !g.ok) { srvdbNote('err', nextSrvError(g)); return g; }
      const r = await srvdbMergeSnapshot(g, true);
      if (!r.ok) { srvdbNote('err', nextSrvError(r)); return r; }
      if (r.failed) { srvdbNote('err', 'не записано записей с сервера: ' + r.failed + ' — повторю при следующей проверке'); return { ...r, ok: false }; }
      if (!hadLocal) localStorage.setItem('crm_next_pull_rev', syncRevision()); srvdbNote('pull');
      if (UI.ready && !sheetIsOpen() && (r.added || r.updated)) nav(UI.screen);
    } finally { NEXT_SYNC.busy = false; syncStatusRender(); }
  }
  if (NEXT_AUTO.dirty || nextLocalChanges()) srvdbTouch();
  return v;
}
function nextAutoStart() {
  clearInterval(NEXT_AUTO.loop); NEXT_AUTO.loop = null;
  if (!nextAutoOn()) return false;
  NEXT_AUTO.loop = setInterval(() => { if (document.visibilityState === 'visible') nextAutoPull(false).catch(e => logErr('auto:pull', e)); }, AUTO_PULL_MS);
  nextAutoPull(false).catch(e => logErr('auto:pull', e));
  return true;
}
function nextAutoSet(on) {
  if (on) {
    if (!localStorage.getItem('crm_next_push_at')) { toast('Сначала отправьте изменения на сервер по кнопке — автообмен включается после первой удачной отправки', true); return false; }
    localStorage.setItem(AUTO_KEY, '1'); nextAutoStart(); toast('Автоматический обмен включён');
  } else { localStorage.removeItem(AUTO_KEY); clearInterval(NEXT_AUTO.loop); NEXT_AUTO.loop = null; clearTimeout(NEXT_AUTO.timer); toast('Автоматический обмен выключен — обмен только по кнопкам'); }
  syncStatusRender(); return true;
}
if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') nextAutoPull(false).catch(e => logErr('auto:pull', e)); });
  window.addEventListener('online', () => nextAutoPull(true).catch(e => logErr('auto:pull', e)));
}

// («Восстановить из файла»). Пароль копии задаёт пользователь и вводит его в листе — системных окон нет.
// Загрузка из файла — всегда объединение с предпросмотром: записи добавляются и обновляются, ничего не стирается.

  if (p2 !== undefined && p1 !== p2) return 'Пароли не совпадают';

    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();

// Иконка строкой SVG. cls — дополнительные классы (icon-sm). Цвет — currentColor, толщина линии — из CSS (.icon).
function icon(name, cls) {
  const p = ICONS[name]; if (!p) { logErr('icon', new Error('нет иконки ' + name)); return ''; }
  return '<svg class="icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + p + '</svg>';
}

        <button type="button" class="button primary top-create" id="top-create" onclick="openCreateSheet()">${icon('plus')}<span>Создать</span></button>
        <button type="button" class="sync-status" id="sync-status" onclick="openSyncSheet()" title="Синхронизация">${icon('hard-drive')}<span>На устройстве</span></button>

      </div>
    </header>
    <div class="work-grid" id="work-grid"><main class="main" id="main" tabindex="-1"></main><aside class="side" id="side" aria-label="Карточка" hidden></aside></div>
  </div>
</div>
<nav class="bottom-nav" aria-label="Основные разделы">${NAV_PHONE.map(id => { const i = NAV_ITEMS.find(x => x.id === id); return `<button type="button" data-nav="${id}" onclick="nav('${id}')">${icon(i.icon)}<span>${esc(i.title)}</span></button>`; }).join('')}<button type="button" data-more onclick="openMoreSheet()">${icon('ellipsis')}<span>Ещё</span></button></nav>
<button type="button" class="fab" id="fab-create" aria-label="Создать запись" title="Создать" onclick="openCreateSheet()">${icon('plus')}</button>
<dialog id="sheet" aria-labelledby="sheetTitle"><div id="sheetContent"></div></dialog>
<div id="toast" role="status" aria-live="polite" popover="manual"></div>`;
  const d = document.getElementById('sheet');
  // событие close у <dialog> приходит с задержкой, поэтому «перенос в панель» распознаётся по месту контейнера, а не по флагу
  // этап 2б: событие close и history.back() отрабатывают с задержкой. Если за это время открыт следующий лист (карточка
  // после сохранения или удаления), запоздавшее событие стирало его состояние, а запоздавший popstate закрывал его.
  // Поэтому: событие от уже снова открытого листа пропускается; запись истории снимается в момент закрытия (sheetHistDrop);
  // свой возврат по истории помечается и в popstate пропускается.
  // Esc: закрытие — через closeSheet, чтобы сработала защита формы (п. 1.1)
  d.addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetIsOpen() && !e.defaultPrevented) { e.preventDefault(); closeSheet(); } });

}
// «Назад» телефона и браузера закрывает открытый лист, а не уходит со страницы
window.addEventListener('popstate', () => { if (UI.skipPop) { UI.skipPop--; return; } if (UI.hist) { UI.hist = false; const d = document.getElementById('sheet');
  // п. 1.1: «Назад» при незавершённой форме — лист остаётся, запись истории возвращается, показан выбор
  if (d && d.open && typeof guardDirty === 'function' && guardDirty()) { try { history.pushState({ nextSheet: 1 }, ''); UI.hist = true; } catch (e) { logErr('sheet:history', e); } guardPrompt('close'); return; }
  if (d && d.open) d.close(); } });

// ── экраны ──
const SCREENS = {};
async function nav(id) {
  if (!NAV_ITEMS.some(i => i.id === id)) id = 'today';
  UI.screen = id;
  document.querySelectorAll('[data-nav]').forEach(b => { const on = b.dataset.nav === id; b.classList.toggle('active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const more = document.querySelector('[data-more]'); if (more) more.classList.toggle('active', !NAV_PHONE.includes(id));
  const main = document.getElementById('main'); if (!main) return;
  const side = document.getElementById('side'); if (side && !side.hidden && !closeSheet()) return; // карточка относится к прежнему экрану; незавершённая форма — остаёмся
  let html;
  try { html = UI.ready ? await (SCREENS[id] || screenStub)(NAV_ITEMS.find(i => i.id === id)) : '<p class="muted">Загрузка…</p>'; }
  catch (e) { logErr('nav:' + id, e); html = `<div class="panel">${emptyState('circle-alert', 'Экран не открылся', 'Сбой записан в журнал ошибок. Попробуйте открыть раздел ещё раз.')}</div>`; }
  if (UI.screen !== id) return; // пока читали базу, пользователь уже открыл другой раздел
  main.innerHTML = `<section class="screen active" id="scr-${id}">${html}</section>`;
  const it = NAV_ITEMS.find(i => i.id === id); document.title = (it ? it.title + ' — ' : '') + 'CRM Адвоката (новая версия)';
}
function renderDashboard() { if (UI.ready && UI.screen === 'today') nav('today'); } // вызывают модули данных после слияния

// ── мелкие компоненты ──
function pageHead(title, sub, buttons) { return `<header class="page-head"><div><h1>${esc(title)}</h1>${sub ? `<p class="subtitle">${esc(sub)}</p>` : ''}</div><div class="head-actions">${buttons || ''}</div></header>`; }
function btn(text, fn, cls, ico) { return `<button type="button" class="button ${cls || ''}" onclick="${fn}">${ico ? icon(ico) : ''}${esc(text)}</button>`; }
function iconBtn(label, fn, ico) { return `<button type="button" class="icon-button" aria-label="${esc(label)}" title="${esc(label)}" onclick="${fn}">${icon(ico)}</button>`; }
function badge(text, cls) { return `<span class="badge ${cls || ''}">${esc(text)}</span>`; }
function emptyState(ico, title, text, buttons) { return `<div class="empty">${icon(ico)}<h3>${esc(title)}</h3><p>${esc(text)}</p>${buttons ? `<div class="actions" style="justify-content:center">${buttons}</div>` : ''}</div>`; } // buttons — уже готовая разметка

// Экран раздела, который ещё не перенесён: что будет и когда, сколько записей уже лежит в базе новой версии.
async function screenStub(it) {
  let n = null; if (it.store) { try { n = (await getAll(it.store)).length; } catch (e) { logErr('stub:' + it.id, e); } }
  if (it.experimental) return pageHead(it.title, 'Экспериментальная функция') + `<section class="panel">${emptyState('sparkles', 'Пока не переносится', 'В прежней программе раздел есть (' + it.what + '), но почти не используется. В новую версию он войдёт, если появится желание им пользоваться — тогда его доработаем и проверим в деле. Данные не пропадают.')}<div class="stub-meta">${badge('Экспериментально', 'warn')}${n !== null ? badge('В базе новой версии: ' + n, '') : ''}</div><div style="height:28px"></div></section>`;
  const meta = `<div class="stub-meta">${badge('В разработке', 'accent')}${n !== null ? badge('В базе новой версии: ' + n, '') : ''}</div>`;
  return pageHead(it.title, 'Раздел переносится в новый интерфейс') + `<section class="panel">${emptyState('hammer', 'Раздел ещё переносится',
    'Будет: ' + it.what + '. До этого раздел работает в прежней программе — данные у вас не пропадают.')}${meta}<div style="height:28px"></div></section>`;
}

// ── листы: стек («←» возвращает к предыдущему листу) ──
// mode: true — лист поверх текущего (появляется «←»); 'replace' — перерисовать текущий; 'panel' — на широком экране
// (от 1200 px) показать панелью справа от содержимого, на узком — обычным листом; иначе — новый лист.
// Один контейнер #sheetContent переносится между <dialog> и панелью #side, поэтому проверки и стили общие.
// Каждый лист помнит свой режим: форма поверх карточки-панели открывается листом, а «←» возвращает карточку в панель.
function sheetHost(mode) { return mode === 'panel' && window.innerWidth >= 1200 ? document.getElementById('side') : document.getElementById('sheet'); }
function sheetIsOpen() { const d = document.getElementById('sheet'), side = document.getElementById('side'); return !!((d && d.open) || (side && !side.hidden)); }
function openSheet(title, body, mode) {
  if (!document.getElementById('sheet')) return;
  const open = sheetIsOpen();
  if (mode === 'replace' && open) { /* стек не меняется */ } else if (mode === true && open && UI.cur) UI.stack.push(UI.cur); else UI.stack = [];
  UI.cur = { title, body, mode: mode === 'panel' ? 'panel' : 'sheet' }; sheetPlace(UI.cur);
}
// Показать запись в нужном месте (панель или лист), перенеся контейнер, если он в другом месте
function sheetPlace(entry) {
  const host = sheetHost(entry.mode), d = document.getElementById('sheet'), side = document.getElementById('side'), box = document.getElementById('sheetContent'), grid = document.getElementById('work-grid');
  if (!host || !box) return;
  UI.moving = true; // закрытие <dialog> при переносе — не закрытие листа: стек не сбрасывать
  try {
    if (box.parentNode !== host) { if (d.open) d.close(); host.appendChild(box); }
    if (host === side) { side.hidden = false; if (grid) grid.classList.add('has-side'); }
    else { side.hidden = true; if (grid) grid.classList.remove('has-side'); }
  } finally { UI.moving = false; }
  sheetShow();
  if (host === side) { side.scrollTop = 0; return; }
  if (!d.open) { d.showModal(); try { history.pushState({ nextSheet: 1 }, ''); UI.hist = true; } catch (e) { logErr('sheet:history', e); } }
}
function sheetShow() {
  const box = document.getElementById('sheetContent'); if (!box || !UI.cur) return;
  const back = UI.stack.length ? `<button type="button" class="icon-button" aria-label="Назад" onclick="sheetBack()">${icon('arrow-left')}</button>` : '';
  box.innerHTML = `<div class="modal-head"><div class="split" style="justify-content:flex-start;gap:4px">${back}<h2 id="sheetTitle">${esc(UI.cur.title)}</h2></div>${iconBtn('Закрыть', 'closeSheet()', 'x')}</div><div class="modal-content">${UI.cur.body}</div>`;
  const d = document.getElementById('sheet'); if (d) d.scrollTop = 0;
  if (typeof guardArm === 'function') guardArm(); // п. 1.1: защита незавершённой формы
}
// Запомнить введённое в текущем листе перед переходом на следующий: «←» вернёт форму с теми же значениями
function sheetFreeze() {
  const box = document.querySelector('#sheetContent .modal-content'); if (!box || !UI.cur) return;
  box.querySelectorAll('input').forEach(el => { if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked) el.setAttribute('checked', ''); else el.removeAttribute('checked'); } else el.setAttribute('value', el.value); });
  box.querySelectorAll('textarea').forEach(el => { el.textContent = el.value; });
  box.querySelectorAll('select').forEach(el => Array.from(el.options).forEach(o => { if (o.selected) o.setAttribute('selected', ''); else o.removeAttribute('selected'); }));

}
function sheetBack(force) { if (!force && typeof guardBeforeClose === 'function' && !guardBeforeClose('back')) return false; UI.cur = UI.stack.pop() || null; if (!UI.cur) closeSheet(true); else sheetPlace(UI.cur); return true; }

function closeSheet(force) { if (!force && typeof guardBeforeClose === 'function' && !guardBeforeClose('close')) return false; const d = document.getElementById('sheet'), side = document.getElementById('side'); UI.stack = []; UI.cur = null; if (d && d.open) { sheetHistDrop(); d.close(); } if (side && !side.hidden) { side.hidden = true; document.getElementById('work-grid').classList.remove('has-side'); } return true; }

// ── сообщение внизу экрана ──
let _toastTimer = 0;
function toast(msg, warn) {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = String(msg || ''); t.className = 'visible' + (warn ? ' error' : ''); t.setAttribute('role', warn ? 'alert' : 'status');
  // сообщение — в верхнем слое браузера (popover), иначе открытый лист <dialog> его закрывает (снимок пользователя 03.10.2026);
  // где popover не поддерживается — как раньше, снизу страницы
  try { if (t.showPopover && !t.matches(':popover-open')) t.showPopover(); } catch (e) { logErr('toast', e); }
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => { t.className = ''; try { if (t.hidePopover && t.matches(':popover-open')) t.hidePopover(); } catch (e) { logErr('toast', e); } }, warn ? 8000 : 3500);
}

// ── тема и шрифт (ключи настроек — те же, что у прежней программы: crm_theme, crm_fontsize, crm_fontfam) ──
function effectiveTheme(mode) {

  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(mode) {

  if (mode) localStorage.setItem('crm_theme', mode);

}
function themeToggle() { applyTheme(effectiveTheme(localStorage.getItem('crm_theme') || 'auto') === 'dark' ? 'light' : 'dark'); bumpSettings(); }
function themeToggleRender() {
  const b = document.getElementById('theme-toggle'); if (!b) return;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  b.innerHTML = icon(dark ? 'sun' : 'moon'); b.setAttribute('aria-label', dark ? 'Светлая тема' : 'Тёмная тема'); b.title = b.getAttribute('aria-label');
}
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if ((localStorage.getItem('crm_theme') || 'auto') === 'auto') applyTheme(); });
const UI_FONT_SIZES = [['s', 0.9, 'Мелкий'], ['m', 1, 'Обычный'], ['l', 1.12, 'Крупный'], ['xl', 1.25, 'Очень крупный']];
const UI_FONT_FAMILIES = [['golos', "'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif", 'Системный'], ['system', 'system-ui, sans-serif', 'Как в телефоне'], ['serif', "'Times New Roman', 'PT Serif', Georgia, serif", 'С засечками']];

function applyFontSettings() {
  const s = (UI_FONT_SIZES.find(f => f[0] === localStorage.getItem('crm_fontsize')) || UI_FONT_SIZES[1])[1];
  const f = (UI_FONT_FAMILIES.find(x => x[0] === localStorage.getItem('crm_fontfam')) || UI_FONT_FAMILIES[0])[1];
  document.documentElement.style.setProperty('--font-scale', String(s));
  document.documentElement.style.setProperty('--app-font', f);
}
applyTheme(); applyFontSettings(); // до первой отрисовки — без вспышки чужой темы

// ▼▼▼ ui/guard.js
// ═══ ui/guard.js — защита незавершённой формы и черновик (план основных функций, п. 1.1, 03.10.2026) ═══
// Форма — лист, собранный через fSaveBar (есть .form-actions). При открытии снимаются значения полей; закрытие любым путём —
// «×» (closeSheet), «←» (sheetBack), Esc (cancel у <dialog>), «Назад» телефона (popstate) — при изменённых полях не закрывает,
// а показывает выбор: «Сохранить» (жмёт кнопку сохранения формы), «Продолжить», «Закрыть без сохранения». Нажатие любой кнопки
// в .form-actions (сохранить, удалить) снимает защиту — после них форма закрывается как раньше.
// Черновик: пока форма изменена, её разметка со значениями (как sheetFreeze) и заголовок хранятся в localStorage (один черновик,
// сутки); после сохранения, удаления или «Закрыть без сохранения» черновик стирается. При запуске с черновиком на экране —
// полоска «Незавершённая форма «…» — Открыть / Удалить».
const GUARD_DRAFT_KEY = 'crm_next_draft', GUARD_DRAFT_TTL = 24 * 3600000;
const SHEET_GUARD = { snap: '', armed: false, timer: null, prompt: false };
function guardIsForm() { return !!document.querySelector('#sheetContent .form-actions'); }
// значения всех полей формы одной строкой — для сравнения
function guardFormState() {
  const box = document.querySelector('#sheetContent .modal-content'); if (!box) return '';
  const out = [];
  box.querySelectorAll('input, textarea, select').forEach(el => { if (el.type === 'button' || el.type === 'submit' || el.type === 'hidden' && !el.id) return; out.push((el.id || el.name || '') + '=' + (el.type === 'checkbox' || el.type === 'radio' ? (el.checked ? '1' : '0') : String(el.value || ''))); });
  return out.join('\n');
}
// вызывается после каждого показа листа (sheetShow): форма — взводится сторож и снимок
function guardArm() {
  clearTimeout(SHEET_GUARD.timer); SHEET_GUARD.prompt = false;
  if (!guardIsForm()) { SHEET_GUARD.armed = false; SHEET_GUARD.snap = ''; return; }
  SHEET_GUARD.armed = true;
  if (UI.cur && UI.cur.guardSnap === undefined) UI.cur.guardSnap = guardFormState();
  SHEET_GUARD.snap = UI.cur ? UI.cur.guardSnap : guardFormState();
  const box = document.getElementById('sheetContent');
  if (box && !box.__guardBound) { box.__guardBound = true;
    box.addEventListener('input', guardOnInput, true); box.addEventListener('change', guardOnInput, true);
    // сохранить/удалить — намеренный выход: защита снимается до того, как обработчик закроет лист
    // «Отмена» (sheetBack) защиту не снимает — только сохранить и удалить
    box.addEventListener('click', e => { const b = e.target && e.target.closest && e.target.closest('.form-actions .button'); if (b && !b.closest('.guard-box') && (b.classList.contains('primary') || b.classList.contains('danger'))) guardDisarm(true); }, true);
  }
}

function guardDisarm(dropDraft) { SHEET_GUARD.armed = false; clearTimeout(SHEET_GUARD.timer); if (dropDraft) guardDraftDrop(); }
function guardOnInput() { if (!SHEET_GUARD.armed) return; clearTimeout(SHEET_GUARD.timer); SHEET_GUARD.timer = setTimeout(guardDraftSave, 600); }
// черновик — замороженная разметка формы (значения в атрибутах), как для «←»
function guardDraftSave() {
  if (!guardDirty() || !UI.cur) return;
  try { sheetFreeze(); localStorage.setItem(GUARD_DRAFT_KEY, JSON.stringify({ title: UI.cur.title, body: UI.cur.body, at: Date.now(), screen: UI.screen })); } catch (e) { logErr('guard:draft', e); }
}
function guardDraftDrop() { try { localStorage.removeItem(GUARD_DRAFT_KEY); } catch (e) { logErr('guard:draft', e); } }
function guardDraftGet() { try { const d = JSON.parse(localStorage.getItem(GUARD_DRAFT_KEY) || 'null'); return d && d.body && Date.now() - (d.at || 0) < GUARD_DRAFT_TTL ? d : null; } catch (e) { return null; } }
// попытка закрыть: true — можно закрывать; false — показан выбор, лист остаётся
function guardBeforeClose(how) {
  if (!guardDirty()) return true;
  guardPrompt(how); return false;
}
function guardPrompt(how) {
  const box = document.querySelector('#sheetContent .modal-content'); if (!box) return;
  let g = box.querySelector('.guard-box');
  if (!g) { g = document.createElement('div'); g.className = 'info-box warning guard-box'; g.id = 'guard-box'; g.setAttribute('role', 'alert'); box.prepend(g); }
  g.innerHTML = `<div><strong>В форме есть несохранённые изменения.</strong></div><div class="form-actions" style="margin-top:8px">${btn('Сохранить', 'guardChoose(\'save\')', 'primary', 'check')}${btn('Продолжить', 'guardChoose(\'stay\')', '', 'pencil')}${btn('Закрыть без сохранения', 'guardChoose(\'drop\')', 'danger', 'x')}</div>`;
  g.dataset.how = how || ''; SHEET_GUARD.prompt = true;
  // лист прокручивается к началу (scrollIntoView прятал выбор под шапку листа на телефоне)
  const d = document.getElementById('sheet'), side = document.getElementById('side'); if (d) d.scrollTop = 0; if (side) side.scrollTop = 0;
}
function guardChoose(what) {
  const g = document.getElementById('guard-box'), how = g ? g.dataset.how : '';
  if (what === 'stay') { if (g) g.remove(); SHEET_GUARD.prompt = false; return; }
  if (what === 'save') { if (g) g.remove(); SHEET_GUARD.prompt = false; const b = document.querySelector('#sheetContent .form-actions .button.primary'); if (b) b.click(); return; }

// полоска о черновике на экране (после запуска): открыть или удалить
function guardDraftBar() {
  const d = guardDraftGet(); if (!d) return '';
  return `<div class="draft-bar" id="draft-bar">${icon('pencil', 'icon-sm')}<span>Незавершённая форма «${esc(d.title)}» от ${esc(new Date(d.at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))}</span><div class="actions">${btn('Открыть', 'guardDraftOpen()', 'small-btn primary', 'pencil')}${btn('Удалить', 'guardDraftDiscard()', 'small-btn', 'trash-2')}</div></div>`;
}
function guardDraftOpen() { const d = guardDraftGet(); if (!d) { toast('Черновика уже нет'); return; } openSheet(d.title, d.body); if (UI.cur) { UI.cur.guardSnap = ''; SHEET_GUARD.snap = ''; SHEET_GUARD.armed = true; } /* снимок пустой — форма считается изменённой, пока не сохранена */ }
function guardDraftDiscard() { guardDraftDrop(); const b = document.getElementById('draft-bar'); if (b) b.remove(); toast('Черновик удалён'); }

// ▼▼▼ ui/sheets.js

// «Ещё» на телефоне, результаты поиска, заглушки кнопок «Задача / Событие / Записать».
// Всё, что относится к следующим этапам, прямо так и названо — без кнопок, которые ничего не делают.

function openMoreSheet() {
  const tile = (fn, ico, title) => `<button type="button" class="more-tile" onclick="${fn}">${icon(ico)}<span>${esc(title)}</span></button>`;
  const body = NAV_GROUPS.map(g => {
    const items = g.items.filter(i => !NAV_PHONE.includes(i.id));
    return items.length ? `<div class="section-label">${esc(g.label)}</div><div class="more-grid">${items.map(i => tile(`closeSheet();nav('${i.id}')`, i.icon, i.title)).join('')}</div>` : '';
  }).join('') + `<div class="section-label">Служебное</div><div class="more-grid">${NAV_SERVICE.map(s => tile(s.fn.replace('()', '(true)'), s.icon, s.title)).join('')}</div>`;
  openSheet('Ещё', body);
}

    <div class="section-label">Оформление</div>
    <p class="small muted">Тема</p>${choice([['light', 'Светлая'], ['dark', 'Тёмная'], ['auto', 'Как в системе']], theme, 'setThemeMode')}

    <div class="section-label">О программе</div>
    <div class="list-rows">
      <div><span>Версия</span><span class="muted">${esc(APP_VER)} · база ${esc(db ? db.name : '—')}, версия ${esc(db ? db.version : '—')}</span></div>

// журнал ошибок: что сломалось, где и когда — чтобы прислать разработчику; «Скопировать» собирает текст для чата
function errlogText() { return errLogGet().slice().reverse().map(r => `${new Date(r.t).toLocaleString('ru-RU')} · ${r.ver || ''} · ${r.where || ''}: ${r.msg || ''}${r.extra ? ' · ' + r.extra : ''}${r.stack ? '\n    ' + r.stack : ''}`).join('\n'); }
function openErrlogSheet(mode) {
  const log = errLogGet().slice().reverse();
  const rows = log.slice(0, 40).map(r => `<div><span class="muted">${esc(new Date(r.t).toLocaleString('ru-RU'))}</span><span><b>${esc(r.where || '')}</b> ${esc(r.msg || '')}${r.extra ? `<br><span class="muted small">${esc(r.extra)}</span>` : ''}</span></div>`).join('');
  openSheet('Журнал ошибок', `<p class="small muted">Программа записывает сюда сбои: что не удалось, где и когда. Если что-то не сработало — нажмите «Скопировать» и пришлите текст разработчику. Данных дел здесь нет, только названия действий и тексты ошибок.</p>
    <div class="form-actions" style="margin:0 0 12px">${btn('Скопировать', 'errlogCopy()', 'primary', 'check')}${log.length ? `<button type="button" class="button danger push-right" onclick="errlogClear()">${icon('trash-2')}Очистить</button>` : ''}</div>
    ${log.length ? `<div class="list-rows">${rows}</div>` : emptyState('shield-check', 'Ошибок не записано', 'Здесь появятся сбои, если что-то не удастся сохранить или загрузить.')}`, mode || true);
}
async function errlogCopy() { const t = errlogText() || 'Журнал ошибок пуст'; try { await navigator.clipboard.writeText(t); toast('Журнал скопирован — вставьте его в сообщение'); } catch (e) { logErr('errlog:copy', e); toast('Не удалось скопировать: выделите текст вручную', true); } }
function errlogClear() { localStorage.removeItem('crm_errlog'); toast('Журнал очищен'); openErrlogSheet('replace'); }
function setThemeMode(k) { applyTheme(k); bumpSettings(); openSettingsSheet('replace'); }
function setFontSize(k) { localStorage.setItem('crm_fontsize', k); bumpSettings(); applyFontSettings(); openSettingsSheet('replace'); }
function setFontFam(k) { localStorage.setItem('crm_fontfam', k); bumpSettings(); applyFontSettings(); openSettingsSheet('replace'); }

// Синхронизация (этап 1г) — мастер из двух шагов: «Подключить сервер» → «Загрузить базу». Строка состояния вверху;
// второй шаг неактивен, пока связь не проверена (правило о страницах-инструментах, урок 41). Логика — sync/pull.js.
// msg — итог последнего действия: { text, bad }.
async function openSyncSheet(sub, msg) {
  let rows = '';
  try { for (const st of ['cases', 'clients', 'hearings', 'tasks', 'finance', 'documents']) rows += `<div><span>${esc(STORE_TITLES[st] || st)}</span><span class="muted num">${(await getAll(st)).length}</span></div>`; }
  catch (e) { logErr('sync:counts', e); }
  const m = syncStatusModel(), checked = nextSrvConfigured() && nextSrvChecked(), saved = v => v ? 'placeholder="сохранён"' : '';
  if (msg && msg.bad && m.cls === 'bad') msg = null; // ошибку сервера уже показывает строка состояния — второй раз то же не пишем
  const res = lsJSON('crm_next_pull_res', null), nConf = syncConflicts().length;
  const step = (n, title, done) => `<div class="section-label step-label">${done ? icon('check', 'icon-sm') : ''}Шаг ${n}. ${esc(title)}</div>`;
  openSheet('Синхронизация', `
    <div class="status-line ${m.cls}" id="sync-state" role="status">${icon(m.icon)}<span>${esc(m.title)}</span></div>
    ${msg ? `<div class="info-box ${msg.bad ? 'warning' : ''}" id="sync-msg" role="${msg.bad ? 'alert' : 'status'}">${esc(msg.text)}</div>` : ''}
    <p class="small muted">Новая версия читает базу с вашего личного сервера, а отправляет изменения только по кнопке (шаг 4) — сама ничего не отправляет. Прежняя программа работает как раньше.</p>
    ${step(1, 'Подключить сервер', checked)}
    <p class="small muted">Адрес и секретный код — те же, что в прежней программе: «Синхронизация» → «Личный сервер». Пароль шифрования — тот, которым прежняя программа шифрует базу при синхронизации. Сервер пароля не знает: без него базу не прочитать.</p>
    <div class="form-grid">
      ${wide(fInput('sy-url', 'Адрес сервера', SRV.url, 'type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="' + NEXT_SRV_HOST + '…"'))}
      ${fInput('sy-secret', 'Секретный код', '', 'type="password" autocomplete="off" ' + saved(SRV.secret))}
      ${fInput('sy-pass', 'Пароль шифрования', '', 'type="password" autocomplete="off" ' + saved(SRVDB.pass))}
    </div>
    ${SRV.secret || SRVDB.pass ? `<p class="small muted">Сохранённые код и пароль не показываются. Чтобы оставить прежние, не заполняйте эти поля.</p>` : ''}
    <div class="form-actions">${btn('Сохранить и проверить связь', 'syncSaveAndCheck()', checked ? '' : 'primary', 'shield-check')}</div>
    ${step(2, 'Загрузить базу', !!SRVDB.lastPull)}
    <p class="small muted">${checked ? 'Записи с сервера добавятся к тем, что уже есть здесь. Повторная загрузка дублей не создаёт.' : 'Станет доступно после шага 1.'}</p>
    <div class="form-actions"><button type="button" class="button ${checked ? 'primary' : ''}" id="sy-pull" onclick="syncPullNow()"${checked && !NEXT_SYNC.busy ? '' : ' disabled'}>${icon('cloud-download')}Загрузить базу с сервера</button></div>
    ${SRVDB.lastPull && res ? `<div class="list-rows"><div><span>Последняя загрузка</span><span class="muted">${esc(new Date(SRVDB.lastPull).toLocaleString('ru-RU'))}</span></div>
      <div><span>Новых записей / обновлено</span><span class="muted num">${Number(res.added) || 0} / ${Number(res.updated) || 0}</span></div></div>` : ''}
    ${step(3, 'Проверить слияние — без записи', !!localStorage.getItem('crm_next_preview_at'))}
    <p class="small muted">${checked ? 'Программа сверит базу на устройстве с базой на сервере и покажет, что пришло бы с сервера и что ушло бы на сервер. Ничего не записывается. Этот шаг нужен перед включением записи на сервер.' : 'Станет доступно после шага 1.'}</p>
    <div class="form-actions"><button type="button" class="button" id="sy-preview" onclick="openMergePreviewSheet()"${checked && !NEXT_SYNC.busy ? '' : ' disabled'}>${icon('shield-check')}Проверить слияние</button></div>
    ${step(4, 'Отправить изменения на сервер', !!localStorage.getItem('crm_next_push_at') && !nextLocalChanges())}
    <p class="small muted">${checked ? 'Только по этой кнопке: сама программа на сервер ничего не отправляет. Перед отправкой она берёт с сервера свежую базу и объединяет с базой устройства, затем показывает числа и ждёт подтверждения.' : 'Станет доступно после шага 1.'}</p>
    <div class="form-actions"><button type="button" class="button${nextLocalChanges() ? ' primary' : ''}" id="sy-push" onclick="openPushConfirm()"${checked && !NEXT_SYNC.busy ? '' : ' disabled'}>${icon('send')}Отправить изменения на сервер</button><button type="button" class="button" id="sy-hist" onclick="openSrvHistorySheet()"${checked ? '' : ' disabled'}>${icon('hard-drive')}Снимки на сервере</button><button type="button" class="button" id="sy-size" onclick="openDbSizeSheet()">${icon('chart-column')}Размер базы</button><button type="button" class="button" id="sy-backup" onclick="openBackupSheet()">${icon('files')}Копии в файл</button></div>
    ${step(5, 'Автоматический обмен', typeof nextAutoOn === 'function' && nextAutoOn())}
    <label class="check"><input type="checkbox" id="sy-auto"${typeof nextAutoOn === 'function' && nextAutoOn() ? ' checked' : ''}${checked && localStorage.getItem('crm_next_push_at') ? '' : ' disabled'} onchange="if (!nextAutoSet(this.checked)) this.checked = false"><span>Обмениваться с сервером самому: после правки — отправка через несколько секунд; с сервера — проверка каждые 5 минут и при возврате в программу</span></label>
    <p class="small muted">${localStorage.getItem('crm_next_push_at') ? 'Как в прежней программе. Перед каждой отправкой свежая база с сервера вливается в базу устройства, спорные записи объединяются по полям. При сбое причина появится в строке состояния, повтор — через минуту и реже.' : 'Станет доступно после первой удачной отправки по кнопке на шаге 4.'}</p>
    ${localStorage.getItem('crm_next_push_at') ? `<div class="list-rows"><div><span>Последняя отправка</span><span class="muted">${esc(new Date(Number(localStorage.getItem('crm_next_push_at'))).toLocaleString('ru-RU'))}</span></div></div>` : ''}
    ${nextLocalChanges() ? `<div class="info-box">На этом устройстве есть правки, которых нет на сервере. Они уйдут на сервер по кнопке «Отправить изменения на сервер».</div>` : ''}
    ${nConf ? `<div class="form-actions">${btn('Журнал коллизий · ' + nConf, 'showConflictsSheet()', '', 'info')}</div>` : ''}
    <div class="section-label">Записей в базе новой версии</div><div class="list-rows">${rows}</div>
    ${SRV.url || SRV.secret || SRVDB.pass ? `<div class="form-actions">${btn('Отключить сервер', 'syncForget()', '', 'x')}</div><p class="small muted">Адрес, код и пароль удаляются из новой версии. Загруженные записи остаются на устройстве.</p>` : ''}`, sub);
}
async function syncSaveAndCheck() {
  const url = fv('sy-url'), secret = fv('sy-secret') || SRV.secret, pass = fv('sy-pass') || SRVDB.pass;
  const bad = nextSrvUrlCheck(url) || (!secret ? 'Укажите секретный код' : '') || (!pass ? 'Укажите пароль шифрования' : '');
  if (bad) { openSyncSheet('replace', { text: bad, bad: true }); return; }
  if (url !== SRV.url) localStorage.removeItem('crm_next_srv_checked');
  SRV.url = url; if (secret !== SRV.secret) SRV.secret = secret; if (pass !== SRVDB.pass) CLOUD.pass = pass;
  const r = await nextServerCheck();
  openSyncSheet('replace', r.ok ? { text: 'Связь есть: сервер версии ' + r.srvVer + (r.cors ? (r.cors.enabled ? ', хранилище принимает снимки напрямую (правило CORS действует)' : ', хранилище НЕ принимает снимки напрямую: ответ ' + r.cors.text + ' — сервер поставит правило при первой отправке; если не поможет, пришлите этот текст') : '') + (r.dbVer ? ', база на сервере есть. Теперь шаг 2.' : ', базы на сервере пока нет.') }
    : { text: 'Связь не установлена: ' + r.error + '.', bad: true });
}
async function syncPullNow() {
  const b = document.getElementById('sy-pull'); if (b) b.disabled = true;
  const r = await nextServerPull();
  openSyncSheet('replace', !r.ok ? { text: 'База не загружена: ' + r.error + '.', bad: true }
    : r.empty ? { text: 'На сервере базы пока нет — загружать нечего.' }
    : { text: 'База загружена: новых записей — ' + r.added + ', обновлено — ' + r.updated + (r.conflicts ? ', коллизий — ' + r.conflicts : '') + '.' });
}
function syncForget() {
  if (!confirm('Отключить сервер в новой версии? Адрес, код и пароль будут удалены отсюда. Записи на устройстве и база на сервере останутся.')) return;
  nextServerForget(); openSyncSheet('replace', { text: 'Сервер отключён.' });
}
const STORE_TITLES = { cases: 'Дела', clients: 'Доверители', hearings: 'Заседания', tasks: 'Задачи', finance: 'Финансовые записи', documents: 'Документы' };

      <div><span>В разработке</span><span class="muted">запись на сервер и копии, отчёты, быстрые записи, процессы, калькуляторы, редактор справочников, встроенная инструкция</span></div>

// Кнопки «Задача / Событие / Записать» на экране «Сегодня»: формы — на этапе 2, здесь говорим это прямо.

function createPick(i) { const it = CREATE_ITEMS[i]; if (!it || typeof window[it[1]] !== 'function') return; closeSheet(); window[it[1]](); }

// Поиск по делам и доверителям (только показ; переход в карточку — с этапа 1в)
async function openSearchSheet(q) {
  q = String(q || '').trim(); if (!q) { toast('Введите, что искать'); return; }
  const n = s => String(s || '').toLowerCase().replace(/ё/g, 'е'), qq = n(q);
  let cases = [], clients = [];
  try { cases = (await getAll('cases')).filter(c => [c.number, c.client, c.courtNo, c.court, c.subject, c.opponent].some(v => n(v).includes(qq))); clients = (await getAll('clients')).filter(c => [c.name, c.phone, c.inn].some(v => n(v).includes(qq))); }
  catch (e) { logErr('search', e); }
  // строки — кнопки: дело и доверитель открываются (замечание пользователя 30.09.2026)
  const row = (a, b, fn) => `<button type="button" class="search-result list-btn" onclick="${fn}"><span class="task-title">${esc(a)}</span><span class="task-sub">${esc(b)}</span></button>`;

  const oppIdx = obj.participants.findIndex(p => p && !String(p.role || '').startsWith('Доверитель') && (p.role === 'Ответчик' || p.role === 'Истец' || p.role === 'Противная сторона'));

// Замечание: категории дел по умолчанию в v310 повторяли стадии; при наполненных справочниках в выпадающем списке
// тяжело найти суд, судью, орган, роль. Решение: поле — обычная строка; при вводе показываются подходящие значения
// справочника (сначала начинающиеся с введённого, затем содержащие); если такого значения нет — строка «Добавить … в
// справочник»; при сохранении формы новое значение запоминается в справочнике (saveRef v310). Список категорий дел
// в новой версии пустой — пользователь наполняет его сам (nextRefsClean).
// Чистые функции для тестов: comboFilter, comboHasExact, refRememberModel, nextRefsCleanModel.
const COMBO_EXTRA = {};
const COMBO_LIMIT = 30;
const refName = x => (x && typeof x === 'object') ? String(x.name || '') : String(x == null ? '' : x);
function comboNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim(); }
// подсказки: сначала начинающиеся с введённого, затем содержащие; без повторов (регистр и «ё» не различаются)
function comboFilter(list, q, limit) {
  const n = comboNorm(q), seen = new Set(), out = [];
  const add = v => { const k = comboNorm(v); if (!k || seen.has(k)) return; seen.add(k); out.push(v); };
  if (!n) list.forEach(add); else { list.filter(v => comboNorm(v).startsWith(n)).forEach(add); list.filter(v => comboNorm(v).includes(n)).forEach(add); }
  return out.slice(0, limit || COMBO_LIMIT);
}

function refRememberModel(list, v) { const s = String(v || '').replace(/\s+/g, ' ').trim(); if (!s || comboHasExact(list || [], s)) return null; return [...(list || []), s]; }

const LEGACY_CATEGORIES = ['Досудебное урегулирование', 'Первая инстанция', 'Апелляция', 'Кассация', 'Надзор', 'Исполнительное производство', 'Консультация'];

if (typeof DEFAULT_REF === 'object' && DEFAULT_REF) DEFAULT_REF.caseCategory = [];
if (typeof REF === 'object' && REF) nextRefsClean();

// поле формы: id, подпись, значение, ключ справочника (REF), дополнительные подсказки (например, роли по кодексу)
function fCombo(id, label, val, refKey, extra) {

}
function comboAll(input) { return [...new Set([...(COMBO_EXTRA[input.id] || []), ...refList(input.dataset.ref)])]; }
function comboMenu(input) { return document.getElementById(input.id + '-menu'); }
function comboRender(input) {
  const menu = comboMenu(input); if (!menu) return;
  const all = comboAll(input), q = String(input.value || '').replace(/\s+/g, ' ').trim(), items = comboFilter(all, q);
  const addRow = q && !comboHasExact(all, q) ? `<button type="button" class="combo-item combo-add" data-v="${esc(q)}">${icon('plus', 'icon-sm')}<span>Добавить «${esc(q)}» в справочник</span></button>` : '';
  const empty = !addRow && !items.length ? `<div class="combo-empty">Справочник пуст — введите значение, при сохранении оно запомнится</div>` : '';

  menu.innerHTML = items.map(v => `<button type="button" class="combo-item" data-v="${esc(v)}"><span>${esc(v)}</span></button>`).join('') + addRow + empty;
  menu.hidden = false;
}
function comboClose(input) { const menu = comboMenu(input); if (menu) { menu.hidden = true; menu.innerHTML = ''; } }
function comboCloseAll(except) { document.querySelectorAll('.combo-list:not([hidden])').forEach(m => { const inp = document.getElementById(m.id.replace(/-menu$/, '')); if (inp !== except) { m.hidden = true; m.innerHTML = ''; } }); }

  });
}

// ═══ screens/today.js — экран «Сегодня» (этап 1б) ═══
// Образец — «Практика» 1.1: четыре показателя, «Сначала важное», ближайшее заседание тёмной карточкой, расписание дня,
// «Далее по плану». Данные и правила — наши (v310): статусы «Назначено»/«Проведено», сроки дела (deadlines) с признаком

// todayModel — чистая функция: данные и «сейчас» приходят параметрами, поэтому её проверяют тесты (урок 8).
// Всё, что экран показывает сам, пользователь может убрать (раздел 7): строку — «×» (на 7 дней), блок — «Свернуть» (до завтра),
// «Сначала важное» — «Скрыть все»; просроченное — действие «Выполнено».

const TODAY_HIDE_KEY = 'crm_today_hide';   // скрытые строки: ключ → дата скрытия; через 7 дней строка возвращается
const TODAY_FOLD_KEY = 'crm_today_fold';   // свёрнутые блоки: имя → дата; на следующий день блок снова развёрнут

function todayDayDiff(iso, todayIso) { // разница календарных дней, без часовых поясов

}

  const d = parseLocalDate(iso); return d && !isNaN(d) ? d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }) : '—';
}
// Судья для строки заседания: сначала судья самого заседания, затем судья дела той же инстанции (заседание апелляции —
// judgeApp, кассации и надзора — judgeCass, иначе judge). Инстанция — как в decisionField: из заседания, иначе стадия дела с
// поправкой на даты подачи жалоб. Судью первой инстанции в апелляцию не подставляем (замечание GPT 03.10.2026, проверено по коду).

  let s = h.stage || c.stage || '';

}

function todayHiddenLoad(todayIso) {

  return out;

// d = { cases, hearings, tasks, meetings, finance }; now — Date; hidden — { ключ: дата } скрытых строк.
function todayModel(d, now, hidden) {
  hidden = hidden || {};
  const today = localISO(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const cases = d.cases || [], hearings = d.hearings || [], tasks = d.tasks || [], meetings = d.meetings || [], finance = d.finance || [];
  const activeCase = c => c && !c.archived && c.status !== 'Завершено';
  // v312: «Дата прошла» — дата заседания прошла, результат не записан; такое заседание не запланировано и ждёт результата
  const planned = h => h && h.status !== 'Проведено' && h.status !== 'Отменено' && h.status !== 'Дата прошла';
  const noResult = h => h && (h.status === 'Дата прошла' || (planned(h) && h.date && todayDayDiff(h.date, today) < 0));
  const byNum = {}, byId = {}; cases.forEach(c => { if (c.number) byNum[c.number] = c; byId[c.id] = c; });
  const caseOf = x => (x.caseId && byId[x.caseId]) || (x.caseNum && byNum[x.caseNum]) || null;

    const key = 'd:' + c.id + ':' + (dl.id || dl.title), base = { key, kind: 'deadline', date: dl.date, title: dl.title || 'Срок', sub: caseTitle(c), caseId: c.id, dlId: dl.id || '', dlTitle: dl.title || '' };
    const unconfirmed = !dl.confirmedAt && !!dl.autoKey;

    else if (k <= 1) imp.push({ ...base, pr: 2, when: todayDayLabel(dl.date, today), badges: [['Процессуальный срок', 'accent']] });

      sub: fmtDate(h.date) + (h.time ? ' ' + h.time : '') + ' · ' + (caseTitle(c, h.caseNum) || 'дело не указано') + (h.participation ? ' · ' + h.participation.toLowerCase() : ''), when: todayDayLabel(h.date, today), done: !!h.prep, badges: [[k === 0 ? 'Заседание сегодня' : 'Заседание через ' + k + ' ' + plural(k, 'день', 'дня', 'дней'), k <= 1 ? 'bad' : 'warn']] });
  });
