// ▼▼▼ ui/trash.js
// ═══ ui/trash.js — удаление записей и корзина (этап 2б) ═══
// Правила — как в v310: удаление = «надгробие» (_deleted, _deletedAt), данные сохраняются и возвращаются из корзины
// (del / undelete, data/db.js); окончательное удаление запоминается в реестре crm_purged (purge) — старая копия
// с другого устройства или с сервера запись не вернёт. Подтверждение — лист внутри программы, а не окно браузера.
// Новое по сравнению с v310: вместе с делом можно убрать в корзину его заседания и задачи (отметка _deletedWith —
// id дела); восстановление дела возвращает и их. Прежняя программа лишнее поле не трогает.
// trashItems, deletePlan, deleteMark, restoreSet — чистые функции, их проверяет next_2b.js.

// Состав корзины — как в v310 (TRASH_STORES): в неё попадают и записи, удалённые в прежней программе
const TRASH_STORES = [
  { store: 'cases', label: 'Дело', name: r => [r.number, r.client].filter(Boolean).join(' · ') || 'без номера' },
  { store: 'hearings', label: 'Заседание', name: r => [r.caseNum, r.date ? fmtDate(r.date) : '', r.time].filter(Boolean).join(' · ') || 'без даты' },
  { store: 'clients', label: 'Участник', name: r => r.name || 'без имени' },
  { store: 'finance', label: 'Платёж', name: r => [r.service, r.amount ? fmtMoney(r.amount) : ''].filter(Boolean).join(' · ') || 'без суммы' },
  { store: 'tasks', label: 'Задача', name: r => r.title || 'без названия' },
  { store: 'expenses', label: 'Расход', name: r => [r.category, r.amount ? fmtMoney(r.amount) : ''].filter(Boolean).join(' · ') || 'без суммы' },
  { store: 'deposits', label: 'Депозит', name: r => (r.amount ? fmtMoney(r.amount) : 'без суммы') },
  { store: 'orders', label: 'Ордер', name: r => r.num || 'без номера' },
  { store: 'leads', label: 'Обращение', name: r => r.name || 'без имени' },
  { store: 'mail', label: 'Письмо', name: r => r.barcode || r.caseNum || 'без номера' },
  { store: 'files', label: 'Файл', name: r => r.name || 'без названия' },
  { store: 'time', label: 'Время', name: r => [r.caseNum, (r.minutes || 0) + ' мин'].filter(Boolean).join(' · ') },
  { store: 'poa', label: 'Доверенность', name: r => r.clientName || 'без доверителя' },
  { store: 'meetings', label: 'Встреча', name: r => [r.caseNum, r.date ? fmtDate(r.date) : '', r.with].filter(Boolean).join(' · ') || 'без даты' },
  { store: 'templates', label: 'Шаблон', name: r => r.name || r.title || 'без названия' },
];
const trashMeta = store => TRASH_STORES.find(t => t.store === store) || { store, label: 'Запись', name: r => String(r.id) };
const DELETE_LINKED = ['hearings', 'tasks', 'meetings']; // что уходит в корзину вместе с делом
const DELETE_LINKED_WORDS = { hearings: ['заседание', 'заседания', 'заседаний'], tasks: ['задачу', 'задачи', 'задач'], meetings: ['встречу', 'встречи', 'встреч'] };

// raw — { хранилище: все записи, включая надгробия }. Свежие — первыми; ушедшие вместе с делом — сразу под ним.
function trashItems(raw) {
  const items = [];
  for (const t of TRASH_STORES) for (const r of (raw[t.store] || [])) if (r && r._deleted && r._deletedAt) items.push({ store: t.store, label: t.label, id: r.id, name: t.name(r), at: r._deletedAt, withId: r._deletedWith || '' });
  const live = new Set(items.filter(i => i.store === 'cases').map(i => i.id));
  const own = items.filter(i => !(i.withId && live.has(i.withId))).sort((a, b) => (b.at || 0) - (a.at || 0));
  const out = []; for (const i of own) { out.push(i); if (i.store === 'cases') items.filter(x => x.withId === i.id).forEach(x => out.push({ ...x, child: true })); }
  return out;
}
// Что будет удалено: сама запись и (для дела) связанные с ним заседания и задачи. d — { hearings, tasks } без надгробий.
function deletePlan(store, rec, d) {
  const meta = trashMeta(store), plan = { store, id: rec.id, label: meta.label, name: meta.name(rec), linked: {}, linkedCount: 0 };
  if (store !== 'cases') return plan;
  const mine = x => x && !x._deleted && (x.caseId ? x.caseId === rec.id : (!!rec.number && x.caseNum === rec.number));
  for (const st of DELETE_LINKED) { plan.linked[st] = ((d && d[st]) || []).filter(mine); plan.linkedCount += plan.linked[st].length; }
  return plan;
}
// Надгробие записи, ушедшей в корзину вместе с делом
function deleteMark(rec, at, withId) { const o = { ...rec, _deleted: true, _deletedAt: at }; if (withId) o._deletedWith = withId; return o; }
// Что восстановить: сама запись и то, что ушло в корзину вместе с ней. Возвращает [[хранилище, запись без отметок удаления], …]
function restoreSet(store, id, raw) {
  const clean = r => { const o = { ...r }; delete o._deleted; delete o._deletedAt; delete o._deletedWith; return o; };
  const rec = (raw[store] || []).find(r => r && r.id === id && r._deleted); if (!rec) return [];
  const out = [[store, clean(rec)]];
  if (store === 'cases') for (const st of DELETE_LINKED) for (const r of (raw[st] || [])) if (r && r._deleted && r._deletedWith === id) out.push([st, clean(r)]);
  return out;
}

// ── удаление ──
async function openDeleteSheet(store, id) {
  const rec = await getOne(store, id); if (!rec) { toast('Запись не найдена', true); return; }
  const d = {}; if (store === 'cases') for (const st of DELETE_LINKED) d[st] = await getAll(st);
  const p = deletePlan(store, rec, d);
  const parts = DELETE_LINKED.map(st => { const n = (p.linked[st] || []).length, w = DELETE_LINKED_WORDS[st]; return n ? n + ' ' + plural(n, w[0], w[1], w[2]) : ''; }).filter(Boolean);
  const linked = p.linkedCount ? `<label class="check"><input type="checkbox" id="del-linked" checked><span>Вместе с делом убрать в корзину: ${parts.length > 1 ? parts.slice(0, -1).join(', ') + ' и ' + parts[parts.length - 1] : parts[0]}</span></label>
    <p class="small muted">Если снять отметку, эти записи останутся в календаре и на экране «Сегодня» без дела.</p>` : '';
  openSheet('Удалить: ' + p.label.toLowerCase(), `<p><b>${esc(p.name)}</b></p>${linked}
    <div class="info-box">Запись попадёт в корзину: «Настройки» → «Корзина». Оттуда её можно вернуть.</div>
    <div class="form-actions"><button type="button" class="button danger" id="del-go" onclick="deleteConfirmed('${jsq(store)}', '${jsq(id)}')">${icon('trash-2')}Удалить в корзину</button><button type="button" class="button" onclick="sheetBack()">Отмена</button></div>`, UI.cur ? true : undefined);
}
async function deleteConfirmed(store, id) {
  const rec = await getOne(store, id); if (!rec) { toast('Запись не найдена', true); closeSheet(); return; }
  const box = document.getElementById('del-linked'), withLinked = !!(box && box.checked), at = Date.now();
  // карточка дела, из которой пришли (лист «дело → форма → удаление»): к ней вернёмся, если удаляли не само дело
  const owner = store !== 'cases' && rec.caseNum ? CASES_BY_NUM[rec.caseNum] : null;
  const backToCard = !!owner && UI.stack.some(e => String(e.title).startsWith(String(owner.number)));
  try {
    if (store === 'cases' && withLinked) { const d = {}; for (const st of DELETE_LINKED) d[st] = await getAll(st); const p = deletePlan(store, rec, d); for (const st of DELETE_LINKED) for (const r of p.linked[st]) await put(st, deleteMark(r, at, id)); }
    await del(store, id);
    // журнал дела — для заседания и задачи, как при их сохранении; встречи v310 в журнал дела не пишет
    if (owner && store === 'hearings') addCaseHistoryEvent(owner, 'hearing_upd', '', 'Заседание ' + fmtDate(rec.date) + (rec.time ? ' ' + rec.time : '') + ' удалено', 'auto');
    if (owner && store === 'tasks') addCaseHistoryEvent(owner, 'task', '', 'Задача удалена: ' + (rec.title || ''), 'auto');
  } catch (e) { logErr('delete:' + store, e); toast('Не удалось удалить: ' + ((e && e.message) || 'сбой записи'), true); return; }
  await refreshCasesCache(); toast(trashMeta(store).label + ' в корзине — вернуть можно в «Настройках»');
  closeSheet(); await nav(UI.screen); if (backToCard) openCaseSheet(owner.id);
}

// ── корзина ──
async function trashRaw() { const raw = {}; for (const t of TRASH_STORES) { try { raw[t.store] = await getAllRaw(t.store); } catch (e) { logErr('trash:' + t.store, e); raw[t.store] = []; } } return raw; }
async function trashCount() { return trashItems(await trashRaw()).length; }
async function openTrashSheet(sub) {
  const items = trashItems(await trashRaw());
  const when = ts => new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const row = it => `<div class="trash-row${it.child ? ' child' : ''}"><div class="grow"><div class="task-title">${esc(it.name)}</div><div class="task-sub">${esc(it.label)} · удалено ${esc(when(it.at))}${it.child ? ' вместе с делом' : ''}</div></div>
    ${it.child ? '' : `<div class="row-actions">${btn('Вернуть', `trashRestore('${jsq(it.store)}', '${jsq(it.id)}')`, 'small-btn', 'rotate-ccw')}${iconBtn('Удалить окончательно: ' + it.name, `openPurgeSheet('${jsq(it.store)}', '${jsq(it.id)}')`, 'trash-2')}</div>`}</div>`;
  openSheet('Корзина', items.length ? `<p class="small muted">Удалённые записи хранятся здесь, пока вы их не вернёте или не удалите окончательно. В корзине: ${items.length}.</p>
    ${items.map(row).join('')}<div class="form-actions">${btn('Очистить корзину', "openPurgeSheet('', '')", '', 'trash-2')}</div>`
    : emptyState('trash-2', 'Корзина пуста', 'Сюда попадают удалённые дела, заседания, задачи и другие записи.'), sub);
}
async function trashRestore(store, id) {
  const raw = await trashRaw(), set = restoreSet(store, id, raw); if (!set.length) { toast('Запись не найдена', true); return; }
  try { for (const [st, rec] of set) await put(st, rec); } catch (e) { logErr('trash:restore', e); toast('Не удалось вернуть: ' + ((e && e.message) || 'сбой записи'), true); return; }
  await refreshCasesCache();
  const rec = set[0][1], twin = store === 'cases' && rec.number ? (await getAll('cases')).find(c => c.id !== rec.id && c.number === rec.number) : null;
  toast(twin ? 'Возвращено. Номер ' + rec.number + ' есть ещё у одного дела — проверьте' : 'Возвращено' + (set.length > 1 ? ': запись и связанных с ней — ' + (set.length - 1) : ''), !!twin);
  await nav(UI.screen); openTrashSheet('replace');
}
// Окончательное удаление: одной записи (вместе с тем, что ушло в корзину с ней) или всей корзины (store пуст)
async function openPurgeSheet(store, id) {
  const items = trashItems(await trashRaw()), it = store ? items.find(i => i.store === store && i.id === id) : null;
  if (store && !it) { toast('Запись не найдена', true); return; }
  const kids = it ? items.filter(i => i.withId === it.id).length : 0;
  openSheet(it ? 'Удалить окончательно' : 'Очистить корзину', `<p>${it ? `<b>${esc(it.name)}</b>${kids ? ' и связанных записей: ' + kids : ''}` : 'Все записи из корзины: ' + items.length}</p>
    <div class="info-box warning">Это действие необратимо: ${it ? 'запись будет стёрта' : 'записи будут стёрты'} с этого устройства и не ${it ? 'вернётся' : 'вернутся'} при загрузке базы с сервера.</div>
    <div class="form-actions"><button type="button" class="button danger" id="purge-go" onclick="purgeConfirmed('${jsq(store)}', '${jsq(id)}')">${icon('trash-2')}Удалить окончательно</button><button type="button" class="button" onclick="sheetBack()">Отмена</button></div>`, true);
}
async function purgeConfirmed(store, id) {
  const items = trashItems(await trashRaw()), list = store ? items.filter(i => (i.store === store && i.id === id) || i.withId === id) : items;
  let n = 0; for (const i of list) { try { if (await purge(i.store, i.id)) n++; } catch (e) { logErr('trash:purge', e); } }
  toast(n === list.length ? 'Удалено окончательно: ' + n : 'Удалено ' + n + ' из ' + list.length + ' — повторите', n !== list.length);
  openTrashSheet();
}

// ▼▼▼ screens/today.js
// ═══ screens/today.js — экран «Сегодня» (этап 1б) ═══
// Образец — «Практика» 1.1: четыре показателя, «Сначала важное», ближайшее заседание тёмной карточкой, расписание дня,
// «Далее по плану». Данные и правила — наши (v310): статусы «Назначено»/«Проведено», сроки дела (deadlines) с признаком
// автоматического расчёта (autoKey) и подтверждения (confirmedAt), задачи (due), встречи, финансы.
// todayModel — чистая функция: данные и «сейчас» приходят параметрами, поэтому её проверяют тесты (урок 8).
// Всё, что экран показывает сам, пользователь может убрать (раздел 7): строку — «×» (на 7 дней), блок — «Свернуть» (до завтра),
// «Сначала важное» — «Скрыть все»; просроченное — действие «Выполнено».

const TODAY_HIDE_KEY = 'crm_today_hide';   // скрытые строки: ключ → дата скрытия; через 7 дней строка возвращается
const TODAY_FOLD_KEY = 'crm_today_fold';   // свёрнутые блоки: имя → дата; на следующий день блок снова развёрнут
const TODAY_IMPORTANT_MAX = 8, TODAY_NEXT_DAYS = 14, TODAY_NEXT_MAX = 6;

function todayDayDiff(iso, todayIso) { // разница календарных дней, без часовых поясов
  const p = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
  const a = p(iso), b = p(todayIso); return a === null || b === null ? null : Math.round((a - b) / 864e5);
}
function todayDayLabel(iso, todayIso) {
  const k = todayDayDiff(iso, todayIso);
  if (k === 0) return 'Сегодня'; if (k === 1) return 'Завтра'; if (k === -1) return 'Вчера';
  const d = parseLocalDate(iso); return d && !isNaN(d) ? d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }) : '—';
}
function todayMinutes(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function todayHiddenLoad(todayIso) {
  const h = lsJSON(TODAY_HIDE_KEY, {}); const out = {};
  if (h && typeof h === 'object') for (const k of Object.keys(h)) { const age = todayDayDiff(todayIso, h[k]); if (age !== null && age >= 0 && age < 7) out[k] = h[k]; }
  return out;
}

// d = { cases, hearings, tasks, meetings, finance }; now — Date; hidden — { ключ: дата } скрытых строк.
function todayModel(d, now, hidden) {
  hidden = hidden || {};
  const today = localISO(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const cases = d.cases || [], hearings = d.hearings || [], tasks = d.tasks || [], meetings = d.meetings || [], finance = d.finance || [];
  const activeCase = c => c && !c.archived && c.status !== 'Завершено';
  // v312: «Дата прошла» — дата заседания прошла, результат не записан; такое заседание не запланировано и ждёт результата
  const planned = h => h && h.status !== 'Проведено' && h.status !== 'Отменено' && h.status !== 'Дата прошла';
  const noResult = h => h && (h.status === 'Дата прошла' || (planned(h) && h.date && todayDayDiff(h.date, today) < 0));
  const byNum = {}, byId = {}; cases.forEach(c => { if (c.number) byNum[c.number] = c; byId[c.id] = c; });
  const caseOf = x => (x.caseId && byId[x.caseId]) || (x.caseNum && byNum[x.caseNum]) || null;
  const caseTitle = (c, num) => [c ? c.number : num, c ? c.client : ''].filter(Boolean).join(' · ');
  const ago = k => (-k) + ' ' + plural(-k, 'день', 'дня', 'дней');

  // «Сначала важное»: pr 0 — просрочено (с действием «Выполнено»), 1 — требует проверки, 2 — сегодня/завтра
  const imp = [];
  cases.filter(activeCase).forEach(c => (c.deadlines || []).forEach(dl => {
    if (!dl || dl.done || !dl.date) return; const k = todayDayDiff(dl.date, today); if (k === null) return;
    const key = 'd:' + c.id + ':' + (dl.id || dl.title), base = { key, kind: 'deadline', date: dl.date, title: dl.title || 'Срок', sub: caseTitle(c), caseId: c.id, dlId: dl.id || '', dlTitle: dl.title || '' };
    const unconfirmed = !dl.confirmedAt && !!dl.autoKey;
    if (k < 0) imp.push({ ...base, pr: 0, when: 'Просрочен ' + ago(k), overdue: true, done: true, badges: unconfirmed ? [['Срок не подтверждён', 'warn']] : [] });
    else if (k <= 2 && unconfirmed) imp.push({ ...base, pr: 1, when: todayDayLabel(dl.date, today), badges: [['Срок требует проверки', 'warn']] });
    else if (k <= 1) imp.push({ ...base, pr: 2, when: todayDayLabel(dl.date, today), badges: [['Процессуальный срок', 'accent']] });
  }));
  tasks.forEach(t => {
    if (!t || t.done || !t.due) return; const k = todayDayDiff(t.due, today); if (k === null || k > 0) return;
    const c = caseOf(t);
    imp.push({ key: 't:' + t.id, kind: 'task', pr: k < 0 ? 0 : 2, date: t.due, title: t.title || 'Задача', sub: caseTitle(c, t.caseNum) || 'Без дела',
      when: k < 0 ? 'Просрочена ' + ago(k) : 'Сегодня', overdue: k < 0, done: true, taskId: t.id, badges: [] });
  });
  const pastOpen = hearings.filter(h => noResult(h) && h.date).sort((a, b) => b.date.localeCompare(a.date));
  if (pastOpen.length) { const h = pastOpen[0], c = caseOf(h);
    imp.push({ key: 'h:' + h.id, kind: 'hearing', pr: 1, date: h.date, title: 'Результат заседания не указан' + (pastOpen.length > 1 ? ' (ещё ' + (pastOpen.length - 1) + ')' : ''),
      sub: fmtDate(h.date) + (h.time ? ' ' + h.time : '') + ' · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), when: todayDayLabel(h.date, today), badges: [[h.status === 'Дата прошла' ? 'Дата прошла — результат не указан' : 'Статус «Назначено», дата прошла', 'warn']] }); }
  imp.sort((a, b) => a.pr - b.pr || String(a.date).localeCompare(String(b.date)) || String(a.title).localeCompare(String(b.title), 'ru'));
  const important = imp.filter(x => !hidden[x.key]);

  // Ближайшее заседание: идущее не прячем 30 минут после начала
  const upcoming = hearings.filter(h => planned(h) && h.date && todayDayDiff(h.date, today) >= 0)
    .sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  const nh = upcoming.find(h => h.date > today || todayMinutes(h.time) === null || todayMinutes(h.time) + 30 >= nowMin) || null;
  let hero = null;
  if (nh && !hidden['hero:' + nh.id]) { const c = caseOf(nh);
    hero = { key: 'hero:' + nh.id, id: nh.id, when: todayDayLabel(nh.date, today), date: nh.date, time: nh.time || '', title: caseTitle(c, nh.caseNum) || 'Дело не указано',
      place: [nh.court || (c && c.court), nh.room ? 'зал ' + nh.room : '', nh.judge ? 'судья ' + nh.judge : ''].filter(Boolean).join(' · '), subject: (c && (c.subject || c.category)) || '' }; }

  // Расписание дня: заседания (кроме отменённых) и встречи сегодня — по времени
  const schedule = [
    ...hearings.filter(h => h && h.date && todayDayDiff(h.date, today) === 0 && h.status !== 'Отменено').map(h => { const c = caseOf(h);
      return { key: 'sh:' + h.id, id: h.id, type: 'hearing', time: h.time || '', title: 'Заседание · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), sub: [h.court || (c && c.court), h.room ? 'зал ' + h.room : ''].filter(Boolean).join(' · '), status: h.status || 'Назначено' }; }),
    ...meetings.filter(m => m && m.date && todayDayDiff(m.date, today) === 0).map(m => ({ key: 'sm:' + m.id, id: m.id, type: 'meeting', time: m.time || '', title: 'Встреча · ' + (m.with || 'без участника'), sub: [m.place, m.caseNum].filter(Boolean).join(' · '), status: '' })),
  ].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

  // Далее по плану: следующие 14 дней
  const later = [];
  const inWin = iso => { const k = todayDayDiff(iso, today); return k !== null && k >= 1 && k <= TODAY_NEXT_DAYS; };
  hearings.forEach(h => { if (planned(h) && inWin(h.date)) { const c = caseOf(h); later.push({ id: h.id, type: 'hearing', date: h.date, time: h.time || '', title: 'Заседание · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), sub: h.court || (c && c.court) || '' }); } });
  meetings.forEach(m => { if (m && inWin(m.date)) later.push({ id: m.id, type: 'meeting', date: m.date, time: m.time || '', title: 'Встреча · ' + (m.with || 'без участника'), sub: m.place || '' }); });
  tasks.forEach(t => { if (t && !t.done && inWin(t.due)) later.push({ id: t.id, type: 'task', date: t.due, time: '', title: t.title || 'Задача', sub: caseTitle(caseOf(t), t.caseNum) }); });
  cases.filter(activeCase).forEach(c => (c.deadlines || []).forEach(dl => { if (dl && !dl.done && inWin(dl.date)) later.push({ id: c.id, type: 'deadline', date: dl.date, time: '', title: 'Срок · ' + (dl.title || 'срок'), sub: caseTitle(c) }); }));
  later.sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  const nextItems = later.slice(0, TODAY_NEXT_MAX).map(x => ({ ...x, when: todayDayLabel(x.date, today) }));

  // Показатели
  const paidOf = f => Array.isArray(f.payments) && f.payments.length ? f.payments.reduce((a, p) => a + Number(p.sum || 0), 0) : Number(f.paid || 0);
  const debt = Math.round(finance.reduce((a, f) => a + (!f || f.pending ? 0 : Math.max(0, Number(f.amount || 0) - paidOf(f))), 0) * 100) / 100;
  const stats = {
    casesActive: cases.filter(activeCase).length,
    todayEvents: schedule.length,
    attention: important.length,
    overdue: important.filter(x => x.overdue).length,
    debt,
  };
  return { today, stats, important, hiddenCount: imp.length - important.length, hero, schedule, next: nextItems, nextTotal: later.length, empty: !cases.length && !hearings.length && !tasks.length };
}

// ── отрисовка ──
let TODAY_LAST = null; // последняя модель: действия строк берут данные отсюда, а не из текста разметки
SCREENS.today = async function () {
  const now = new Date(), today = localISO(now);
  const d = {}; for (const st of ['cases', 'hearings', 'tasks', 'meetings', 'finance']) d[st] = await getAll(st);
  const m = todayModel(d, now, todayHiddenLoad(today)); TODAY_LAST = m;
  const fold = lsJSON(TODAY_FOLD_KEY, {}) || {}, folded = b => fold[b] === today;
  const dateLine = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  let out = pageHead('Сегодня', dateLine.charAt(0).toUpperCase() + dateLine.slice(1),
    btn('Задача', 'openTaskForm()', 'primary', 'plus') + btn('Заседание', 'openHearingForm()', '', 'calendar-plus') + btn('Встреча', 'openMeetingForm()', '', 'handshake') + btn('Записать', "openPlannedSheet('note')", '', 'mic'));
  if (m.empty) out += `<div class="intro-strip"><div><h2>Здесь появятся ваши дела</h2><p>База новой версии пока пустая и отделена от прежней программы. Ваши данные придут с личного сервера на этапе 1г. Пока можно завести дело здесь — оно останется на этом устройстве.</p></div><div class="actions">${btn('Новое дело', 'openCaseForm()', 'primary', 'plus')}${btn('Синхронизация', 'openSyncSheet()', '', 'refresh-cw')}</div></div>`;
  const stat = (label, value, meta, ico, cls, small) => `<div class="stat ${cls || ''}"><div class="stat-label"><span>${esc(label)}</span>${icon(ico)}</div><div class="stat-value${small ? ' small-value' : ''}">${esc(value)}</div><div class="stat-meta">${esc(meta)}</div></div>`;
  out += `<div class="stats">${stat('Дела в работе', m.stats.casesActive, 'Без завершённых и архивных', 'briefcase-business')}${stat('На сегодня', m.stats.todayEvents, 'Заседания и встречи', 'calendar-days')}${stat('Требуют внимания', m.stats.attention, m.stats.overdue ? 'Из них просрочено: ' + m.stats.overdue : 'Сроки, задачи, заседания', 'circle-alert', m.stats.overdue ? 'alert' : '')}${stat('К оплате', fmtMoney(m.stats.debt), 'Остаток по счетам', 'wallet', '', true)}</div>`;

  const tools = (block, extra) => `<div class="panel-tools">${extra || ''}${folded(block) ? `<button type="button" class="text-button" onclick="todayFold('${block}',false)">${icon('chevron-down', 'icon-sm')}Развернуть</button>` : `<button type="button" class="text-button" aria-label="Свернуть блок до завтра" onclick="todayFold('${block}',true)">${icon('chevron-up', 'icon-sm')}Свернуть</button>`}</div>`;
  const panel = (cls, block, title, count, extra, body) => `<section class="panel ${cls}${folded(block) ? ' collapsed' : ''}"><div class="panel-title"><h2>${esc(title)}${count !== null ? ' ' + badge(String(count), count ? 'accent' : '') : ''}</h2>${tools(block, extra)}</div>${folded(block) ? '' : body}</section>`;

  // строка: текст (срок/дело/значки) · «Выполнено» · «×»; на телефоне «Выполнено» уходит под текст (tokens.css, .imp-row)
  const impRows = m.important.slice(0, TODAY_IMPORTANT_MAX).map(x => `<div class="imp-row">
      <div class="imp-main"><div class="task-title">${esc(x.title)}</div><div class="task-sub"><span class="task-when${x.overdue ? ' overdue' : ''}">${esc(x.when)}</span> · ${esc(x.sub)}</div>${x.badges.length ? `<div class="task-badges">${x.badges.map(b => badge(b[0], b[1])).join('')}</div>` : ''}</div>
      ${x.done ? `<div class="imp-done"><button type="button" class="button small-btn" aria-label="Выполнено: ${esc(x.title)}" onclick="todayDone('${jsq(x.key)}')">${icon('check', 'icon-sm')}Выполнено</button></div>` : ''}
      <div class="imp-x">${iconBtn('Скрыть на 7 дней', `todayHide('${jsq(x.key)}')`, 'x')}</div></div>`).join('');
  const more = m.important.length > TODAY_IMPORTANT_MAX ? `<p class="panel-foot">Ещё ${m.important.length - TODAY_IMPORTANT_MAX} — в разделе «Задачи и сроки» (этап 2)</p>` : '';
  const hiddenNote = m.hiddenCount ? `<p class="panel-foot">Скрыто: ${m.hiddenCount}. <button type="button" class="text-button" onclick="todayUnhideAll()">Показать снова</button></p>` : '';
  const impBody = (m.important.length ? impRows + more : emptyState('check-check', 'Срочного нет', 'Просроченных сроков и задач нет, заседания с неуказанным результатом разобраны.')) + hiddenNote;
  const important = panel('t-important', 'important', 'Сначала важное', m.important.length, m.important.length ? `<button type="button" class="text-button" onclick="todayHideAll()">Скрыть все</button>` : '', impBody);

  // без времени — короткая пометка вида записи вместо «весь день» (не переносится в узкой колонке)
  // этап 2б: строка открывает свою запись — заседание, встречу, задачу; срок — карточку дела
  const agenda = rows => rows.map(x => `<button type="button" class="agenda-row" onclick="todayOpen('${x.type}', '${jsq(x.id || '')}')"><span class="agenda-time">${esc(x.time || ({ task: 'задача', deadline: 'срок' }[x.type] || '—'))}</span>
      <span class="agenda-stripe ${x.type}${x.status === 'Проведено' ? ' done' : ''}"><span class="agenda-title">${esc(x.title)}</span>${x.sub ? `<span class="agenda-sub">${esc(x.sub)}</span>` : ''}${x.status ? badge(x.status, x.status === 'Проведено' ? 'good' : x.status === 'Дата прошла' ? 'warn' : 'accent') : ''}</span></button>`).join('');
  const byDay = rows => { let out = '', cur = ''; for (const x of rows) { if (x.date !== cur) { cur = x.date; out += `<div class="day-mark">${esc(x.when)}${x.when === 'Завтра' ? ' · ' + esc(parseLocalDate(x.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })) : ''}</div>`; } out += agenda([x]); } return out; };
  const schedule = panel('t-schedule', 'schedule', 'Расписание на сегодня', m.schedule.length, '', m.schedule.length ? agenda(m.schedule) : emptyState('calendar-check', 'Заседаний и встреч сегодня нет', 'Ближайшие события — в блоке «Далее по плану».'));
  const next = panel('t-next', 'next', 'Далее по плану', m.nextTotal, '', m.next.length ? byDay(m.next) + (m.nextTotal > m.next.length ? `<p class="panel-foot">Ещё ${m.nextTotal - m.next.length} за ${TODAY_NEXT_DAYS} дней — в календаре (этап 2)</p>` : '') : emptyState('calendar-days', 'На две недели вперёд пусто', 'Заседаний, встреч, задач и сроков в ближайшие 14 дней нет.'));

  const hero = m.hero ? `<section class="upcoming-hero t-hero" aria-label="Ближайшее заседание"><div class="split"><small>${esc(m.hero.when)} · ближайшее заседание</small>${iconBtn('Скрыть карточку заседания на 7 дней', `todayHide('${jsq(m.hero.key)}')`, 'x')}</div>
      <div class="hero-time">${esc(m.hero.time || 'Время не указано')}</div><h2>${esc(m.hero.title)}</h2>${m.hero.subject ? `<p>${esc(m.hero.subject)}</p>` : ''}${m.hero.place ? `<p>${esc(m.hero.place)}</p>` : ''}${m.hero.when !== 'Сегодня' && m.hero.when !== 'Завтра' ? `<p>${esc(fmtDate(m.hero.date))}</p>` : ''}</section>` : '';
  out += `<div class="day-grid"><div class="stack">${important}${next}</div><div class="stack">${hero}${schedule}</div></div>`;
  return out;
};

// ── действия ──
function todayOpen(type, id) {
  if (!id) return;
  if (type === 'hearing') openHearingForm(id); else if (type === 'meeting') openMeetingForm(id); else if (type === 'task') openTaskForm(id); else if (type === 'deadline') openCaseSheet(id);
}
async function todayDone(key) {
  const x = TODAY_LAST && TODAY_LAST.important.find(i => i.key === key); if (!x || !x.done) return;
  try {
    if (x.kind === 'deadline') { // как «Выполнено» на обзоре v307: отметка в самом сроке дела
      const c = await getOne('cases', x.caseId); if (!c) { toast('Дело не найдено', true); return; }
      const dl = (c.deadlines || []).find(v => (x.dlId && v.id === x.dlId) || (!x.dlId && v.title === x.dlTitle)); if (!dl) { toast('Срок не найден', true); return; }
      dl.done = true; dl.doneAt = todayISO(); await put('cases', c); toast('Срок отмечен выполненным');
    } else if (x.kind === 'task') {
      const t = await getOne('tasks', x.taskId); if (!t) { toast('Задача не найдена', true); return; }
      t.done = true; t.doneAt = todayISO(); await put('tasks', t); toast('Задача выполнена');
    }
  } catch (e) { logErr('today:done', e); toast('Не удалось сохранить отметку — подробности в журнале ошибок', true); return; }
  nav('today');
}
function todayHide(key) { const h = todayHiddenLoad(todayISO()); h[key] = todayISO(); localStorage.setItem(TODAY_HIDE_KEY, JSON.stringify(h)); toast('Скрыто на 7 дней'); nav('today'); }
function todayHideAll() { if (!TODAY_LAST) return; const h = todayHiddenLoad(todayISO()); TODAY_LAST.important.forEach(x => { h[x.key] = todayISO(); }); localStorage.setItem(TODAY_HIDE_KEY, JSON.stringify(h)); toast('Отмечено разобранным на 7 дней'); nav('today'); }
function todayUnhideAll() { localStorage.removeItem(TODAY_HIDE_KEY); nav('today'); }
function todayFold(block, on) { const f = lsJSON(TODAY_FOLD_KEY, {}) || {}; if (on) f[block] = todayISO(); else delete f[block]; localStorage.setItem(TODAY_FOLD_KEY, JSON.stringify(f)); nav('today'); }

// ▼▼▼ screens/cases.js
// ═══ screens/cases.js — раздел «Дела» (этап 1в, только чтение) ═══
// Список (все экраны), таблица и доска по стадиям (от 1024 px), карточка дела для чтения — лист на телефоне,
// панель справа от 1200 px. Данные и стадии — наши (v310: CASE_STAGES, статусы «Новое / В работе / Ожидание / Завершено»).
// Правка, перевод стадии, новое дело — этап 2; здесь об этом сказано прямо, кнопок «в никуда» нет.
// casesModel и caseCardModel — чистые функции: данные и «сейчас» приходят параметрами, их проверяет next_1v.js.

const CASES_VIEW_KEY = 'crm_cases_view';   // { view: list|table|board, status: all|active|waiting|new|done|archive }
const CASE_STAGES_NEXT = ['Досудебная', 'Первая инстанция', 'Апелляция', 'Кассация', 'Надзор', 'Исполнение', 'Завершено']; // = CASE_STAGES v310
const CASE_FILTERS = [['active', 'В работе'], ['new', 'Новые'], ['waiting', 'Ожидание'], ['done', 'Завершённые'], ['all', 'Все'], ['archive', 'Архив']];

function casesNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').trim(); }
// Фильтр, поиск и порядок. Порядок: сначала просроченное действие, потом по дате действия, потом без даты — по номеру.
function casesModel(cases, opts, now) {
  const today = localISO(now), q = casesNorm(opts.q), f = opts.status || 'active';
  const pass = c => {
    if (!c || c._deleted) return false;
    if (f === 'archive') return !!c.archived;
    if (c.archived) return false;
    if (f === 'all') return true;
    if (f === 'done') return c.status === 'Завершено';
    if (f === 'new') return c.status === 'Новое';
    if (f === 'waiting') return c.status === 'Ожидание';
    return c.status !== 'Завершено'; // active: всё, что не завершено (включая новые и ожидание)
  };
  const hit = c => !q || [c.number, c.client, c.subject, c.court, c.courtNo, c.opponent, c.judge, c.category].some(v => casesNorm(v).includes(q));
  const due = c => c.nextActionDue || '';
  const rows = cases.filter(c => pass(c) && hit(c)).map(c => {
    const k = due(c) ? todayDayDiff(due(c), today) : null;
    const dl = (c.deadlines || []).filter(d => d && !d.done && d.date).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
    return { c, overdue: k !== null && k < 0 && c.status !== 'Завершено', dueLabel: k === null ? '' : (k < 0 ? 'Просрочено ' + (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') : todayDayLabel(due(c), today)),
      nextDeadline: dl ? { title: dl.title || 'Срок', date: dl.date, overdue: todayDayDiff(dl.date, today) < 0, unconfirmed: !!dl.autoKey && !dl.confirmedAt } : null };
  });
  rows.sort((a, b) => (b.overdue - a.overdue) || ((due(a.c) || '9999') .localeCompare(due(b.c) || '9999')) || String(a.c.number || '').localeCompare(String(b.c.number || ''), 'ru', { numeric: true }));
  const colOf = c => c.status === 'Завершено' ? 'Завершено' : (CASE_STAGES_NEXT.includes(c.stage) ? c.stage : '__none');
  const board = [['__none', 'Без стадии'], ...CASE_STAGES_NEXT.map(s => [s, s])].map(([key, title]) => ({ key, title, rows: rows.filter(r => colOf(r.c) === key) })).filter(col => col.rows.length || (col.key !== '__none' && col.key !== 'Завершено')); // пустые «Без стадии» и «Завершено» не занимают место
  const counts = {}; CASE_FILTERS.forEach(([k]) => { counts[k] = cases.filter(c => c && !c._deleted && (k === 'archive' ? c.archived : !c.archived) && (k === 'archive' || k === 'all' || k === 'done' && c.status === 'Завершено' || k === 'new' && c.status === 'Новое' || k === 'waiting' && c.status === 'Ожидание' || k === 'active' && c.status !== 'Завершено')).length; });
  return { rows, board, counts, total: cases.filter(c => c && !c._deleted).length };
}

// Карточка: дело + связанные записи (заседания, задачи, финансы, документы) по номеру или id дела.
function caseCardModel(c, d, now) {
  const today = localISO(now);
  const mine = x => x && (x.caseId ? x.caseId === c.id : x.caseNum === c.number);
  const hearings = (d.hearings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || ''));
  const tasks = (d.tasks || []).filter(mine).sort((a, b) => (!!a.done - !!b.done) || (a.due || '9999').localeCompare(b.due || '9999'));
  const meetings = (d.meetings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || '')); // этап 2б
  const finance = (d.finance || []).filter(mine);
  const paidOf = f => Array.isArray(f.payments) && f.payments.length ? f.payments.reduce((a, p) => a + Number(p.sum || 0), 0) : Number(f.paid || 0);
  const fin = finance.reduce((a, f) => { if (f.pending) a.pending += Number(f.amount || 0); else { a.amount += Number(f.amount || 0); a.paid += paidOf(f); } return a; }, { amount: 0, paid: 0, pending: 0 });
  fin.debt = Math.max(0, Math.round((fin.amount - fin.paid) * 100) / 100);
  const deadlines = (c.deadlines || []).filter(x => x && x.date).map(x => { const k = todayDayDiff(x.date, today); return { ...x, state: x.done ? 'done' : (k < 0 ? 'overdue' : 'open'), unconfirmed: !x.done && !!x.autoKey && !x.confirmedAt, when: k === null ? '' : (k < 0 ? (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') + ' назад' : todayDayLabel(x.date, today)) }; })
    .sort((a, b) => (a.state === 'done') - (b.state === 'done') || a.date.localeCompare(b.date));
  const docs = (d.documents || []).filter(mine).length;
  const nextK = c.nextActionDue ? todayDayDiff(c.nextActionDue, today) : null;
  return { c, hearings, tasks, meetings, fin, deadlines, docs, participants: Array.isArray(c.participants) ? c.participants : [],
    nextOverdue: nextK !== null && nextK < 0 && c.status !== 'Завершено', nextWhen: nextK === null ? '' : todayDayLabel(c.nextActionDue, today),
    stageIdx: CASE_STAGES_NEXT.indexOf(c.status === 'Завершено' ? 'Завершено' : c.stage) };
}

// ── экран ──
function casesPrefs() { const p = lsJSON(CASES_VIEW_KEY, {}) || {}; return { view: ['list', 'table', 'board'].includes(p.view) ? p.view : 'list', status: CASE_FILTERS.some(f => f[0] === p.status) ? p.status : 'active', q: '' }; }
function casesSet(k, v) { const p = casesPrefs(); p[k] = v; localStorage.setItem(CASES_VIEW_KEY, JSON.stringify({ view: p.view, status: p.status })); if (k === 'q') UI.casesQ = v; nav('cases'); }
SCREENS.cases = async function () {
  const p = casesPrefs(); p.q = UI.casesQ || '';
  if (window.innerWidth < 1024) p.view = 'list'; // таблица и доска — только на широком экране (раздел 7)
  const cases = await getAll('cases');
  const m = casesModel(cases, p, new Date());
  const statusCls = s => s === 'Завершено' ? 'good' : s === 'Ожидание' ? 'warn' : s === 'Новое' ? 'accent' : '';
  const chips = CASE_FILTERS.map(([k, t]) => `<button type="button" class="chip" aria-pressed="${p.status === k}" onclick="casesSet('status','${k}')">${esc(t)} <span class="chip-n">${m.counts[k] || 0}</span></button>`).join('');
  const views = [['list', 'Список', 'list-checks'], ['table', 'Таблица', 'table-2'], ['board', 'Доска', 'columns-3']].map(([k, t, i]) => `<button type="button" class="button small-btn" aria-pressed="${p.view === k}" onclick="casesSet('view','${k}')">${icon(i, 'icon-sm')}${esc(t)}</button>`).join('');
  const meta = r => [r.c.kind, r.c.stage, r.c.court].filter(Boolean).join(' · ');
  const nextLine = r => r.c.nextAction ? `<div class="task-sub"><span class="task-when${r.overdue ? ' overdue' : ''}">${esc(r.dueLabel || 'без даты')}</span> · ${esc(r.c.nextAction)}</div>` : '';
  const dlBadge = r => r.nextDeadline ? badge((r.nextDeadline.overdue ? 'Срок просрочен: ' : 'Срок: ') + r.nextDeadline.title + ' · ' + fmtDate(r.nextDeadline.date), r.nextDeadline.overdue ? 'bad' : (r.nextDeadline.unconfirmed ? 'warn' : 'accent')) : '';
  const listRow = r => `<button type="button" class="case-row" onclick="openCaseSheet('${jsq(r.c.id)}')"><div class="grow"><div class="task-title">${esc([r.c.number, r.c.client].filter(Boolean).join(' · ') || 'Без номера')}</div>${r.c.subject ? `<div class="task-sub">${esc(r.c.subject)}</div>` : ''}<div class="task-sub">${esc(meta(r))}</div>${nextLine(r)}<div class="task-badges">${badge(r.c.status || 'Без статуса', statusCls(r.c.status))}${dlBadge(r)}</div></div>${icon('chevron-right')}</button>`;
  const empty = emptyState('briefcase-business', m.total ? 'По этому фильтру дел нет' : 'Дел пока нет', m.total ? 'Измените фильтр или запрос.' : 'Данные придут с личного сервера на этапе 1г. Первое дело можно завести прямо сейчас.', m.total ? '' : btn('Новое дело', 'openCaseForm()', 'primary', 'plus'));
  let body;
  if (!m.rows.length) body = `<section class="panel">${empty}</section>`;
  else if (p.view === 'table') body = `<section class="panel table-wrap"><table class="grid"><thead><tr><th>№</th><th>Доверитель</th><th>Предмет</th><th>Вид · стадия</th><th>Суд · № в суде</th><th>Следующее действие</th><th>Статус</th></tr></thead><tbody>${m.rows.map(r => `<tr onclick="openCaseSheet('${jsq(r.c.id)}')" tabindex="0" onkeydown="if(event.key==='Enter')openCaseSheet('${jsq(r.c.id)}')"><td class="num">${esc(r.c.number || '')}</td><td>${esc(r.c.client || '')}</td><td>${esc(r.c.subject || '')}</td><td>${esc([r.c.kind, r.c.stage].filter(Boolean).join(' · '))}</td><td>${esc([r.c.court, r.c.courtNo].filter(Boolean).join(' · '))}</td><td>${r.c.nextAction ? `<span class="task-when${r.overdue ? ' overdue' : ''}">${esc(r.dueLabel || '')}</span> ${esc(r.c.nextAction)}` : ''}</td><td>${badge(r.c.status || '', statusCls(r.c.status))}</td></tr>`).join('')}</tbody></table></section>`;
  else if (p.view === 'board') body = `<div class="board">${m.board.map(col => `<section class="panel board-col"><div class="panel-title"><h2>${esc(col.title)} ${badge(String(col.rows.length), col.rows.length ? 'accent' : '')}</h2></div><div class="board-cards">${col.rows.map(r => `<button type="button" class="board-card" onclick="openCaseSheet('${jsq(r.c.id)}')"><div class="task-title">${esc(r.c.number || 'Без номера')}</div><div class="task-sub">${esc(r.c.client || '')}</div>${r.c.nextAction ? `<div class="task-sub"><span class="task-when${r.overdue ? ' overdue' : ''}">${esc(r.dueLabel || 'без даты')}</span> · ${esc(r.c.nextAction)}</div>` : ''}</button>`).join('') || '<div class="empty" style="padding:18px">—</div>'}</div></section>`).join('')}</div>`;
  else body = `<section class="panel">${m.rows.map(listRow).join('')}</section>`;
  return pageHead('Дела', `${m.rows.length} из ${m.total}`, btn('Новое дело', 'openCaseForm()', 'primary', 'plus')) +
    `<div class="toolbar"><div class="chips">${chips}</div><div class="toolbar-right"><label class="search-wrap"><span class="sr">Поиск по делам</span>${icon('search')}<input type="search" value="${esc(p.q)}" placeholder="Номер, доверитель, суд" onkeydown="if(event.key==='Enter'){event.preventDefault();casesSet('q',this.value)}" onsearch="casesSet('q',this.value)"></label><div class="view-switch">${views}</div></div></div>${body}`;
};

// ── карточка дела (только чтение): лист на телефоне, панель справа от 1200 px ──
async function openCaseSheet(id) {
  const c = await getOne('cases', id); if (!c) { toast('Дело не найдено', true); return; }
  const d = {}; for (const st of ['hearings', 'tasks', 'meetings', 'finance', 'documents']) d[st] = await getAll(st);
  const m = caseCardModel(c, d, new Date());
  const row = (k, v) => v ? `<div><span class="muted">${esc(k)}</span><span>${esc(v)}</span></div>` : '';
  const sec = (title, html, count) => html ? `<div class="section-label">${esc(title)}${count !== undefined ? ' · ' + count : ''}</div>${html}` : '';
  const steps = `<ol class="stage-track" aria-label="Стадия">${CASE_STAGES_NEXT.map((s, i) => `<li class="${i < m.stageIdx ? 'past' : i === m.stageIdx ? 'cur' : ''}"><span>${esc(s)}</span></li>`).join('')}</ol>`;
  const body = `
    <div class="actions" style="margin-bottom:12px">${btn('Изменить', `openCaseForm('${jsq(c.id)}')`, 'small-btn', 'pencil')}${btn('Заседание', `openHearingForm('', '${jsq(c.number || '')}')`, 'small-btn', 'calendar-plus')}${btn('Задача', `openTaskForm('', '${jsq(c.number || '')}')`, 'small-btn', 'plus')}${btn('Встреча', `openMeetingForm('', '${jsq(c.number || '')}')`, 'small-btn', 'handshake')}</div>
    <div class="task-badges">${badge(c.status || 'Без статуса', c.status === 'Завершено' ? 'good' : c.status === 'Ожидание' ? 'warn' : 'accent')}${c.kind ? badge(c.kind) : ''}${c.category ? badge(c.category) : ''}${c.archived ? badge('Архив') : ''}</div>
    ${c.subject ? `<p style="margin-top:12px">${esc(c.subject)}</p>` : ''}
    ${steps}
    ${c.nextAction ? `<div class="info-box${m.nextOverdue ? ' warning' : ''}"><b>Следующее действие:</b> ${esc(c.nextAction)}${c.nextActionDue ? ' — ' + esc(m.nextWhen) + ', ' + esc(fmtDate(c.nextActionDue)) : ''}</div>` : ''}
    ${sec('Суд и стороны', `<div class="list-rows">${row('Суд', c.court)}${row('№ в суде', c.courtNo)}${row('Судья', c.judge)}${row('Противная сторона', c.opponent)}${row('Роль доверителя', c.role)}${row('Апелляция', [c.courtApp, c.courtNoApp].filter(Boolean).join(' · '))}${row('Кассация', [c.courtCass, c.courtNoCass].filter(Boolean).join(' · '))}${row('Соглашение', [c.agreementNo, c.agreementDate ? fmtDate(c.agreementDate) : ''].filter(Boolean).join(' от '))}</div>`)}
    ${m.participants.length ? sec('Участники', `<div class="list-rows">${m.participants.map(p => `<div><span>${esc(p.name || '')}</span><span class="muted">${esc([p.role, p.phone].filter(Boolean).join(' · '))}</span></div>`).join('')}</div>`, m.participants.length) : ''}
    ${sec('Сроки', m.deadlines.length ? `<div class="list-rows">${m.deadlines.map(x => `<div><span>${esc(x.title || 'Срок')}${x.unconfirmed ? ' ' + badge('требует проверки', 'warn') : ''}</span><span class="${x.state === 'overdue' ? 'task-when overdue' : 'muted'}">${esc(fmtDate(x.date))}${x.state === 'done' ? ' · выполнен' : x.when ? ' · ' + esc(x.when) : ''}</span></div>`).join('')}</div>` : '<p class="small muted">Сроков нет.</p>', m.deadlines.length)}
    ${sec('Заседания', m.hearings.length ? `<div class="list-rows">${m.hearings.slice(0, 12).map(h => `<button type="button" class="list-btn" onclick="openHearingForm('${jsq(h.id)}')"><span>${esc(fmtDate(h.date))}${h.time ? ' ' + esc(h.time) : ''}${h.room ? ' · зал ' + esc(h.room) : ''}</span><span>${badge(h.status || 'Назначено', h.status === 'Проведено' ? 'good' : h.status === 'Отменено' ? '' : h.status === 'Дата прошла' ? 'warn' : 'accent')}</span></button>`).join('')}</div>` : '<p class="small muted">Заседаний нет.</p>', m.hearings.length)}
    ${sec('Задачи', m.tasks.length ? `<div class="list-rows">${m.tasks.slice(0, 12).map(t => `<button type="button" class="list-btn" onclick="openTaskForm('${jsq(t.id)}')"><span class="${t.done ? 'muted' : ''}">${esc(t.title || 'Задача')}</span><span class="muted">${t.done ? 'выполнена' : (t.due ? esc(fmtDate(t.due)) : '')}</span></button>`).join('')}</div>` : '<p class="small muted">Задач нет.</p>', m.tasks.length)}
    ${sec('Встречи', m.meetings.length ? `<div class="list-rows">${m.meetings.slice(0, 12).map(x => `<button type="button" class="list-btn" onclick="openMeetingForm('${jsq(x.id)}')"><span>${esc(fmtDate(x.date))}${x.time ? ' ' + esc(x.time) : ''} · ${esc(x.with || 'без участника')}</span><span class="muted">${esc(x.place || '')}</span></button>`).join('')}</div>` : '<p class="small muted">Встреч нет.</p>', m.meetings.length)}
    ${sec('Финансы', `<div class="list-rows">${row('Начислено', m.fin.amount ? fmtMoney(m.fin.amount) : '')}${row('Оплачено', m.fin.paid ? fmtMoney(m.fin.paid) : '')}${row('Остаток', m.fin.debt ? fmtMoney(m.fin.debt) : (m.fin.amount ? '0 ₽' : ''))}${row('Ожидается', m.fin.pending ? fmtMoney(m.fin.pending) : '')}${row('Документов', m.docs ? String(m.docs) : '')}</div>`)}
    ${c.comment ? sec('Примечание', `<p class="small">${esc(c.comment)}</p>`) : ''}
    <div class="info-box">Записи хранятся на этом устройстве; на сервер новая версия пока не пишет (этап 2). Сроки, документы, финансы — следующие шаги.</div>`;
  openSheet([c.number, c.client].filter(Boolean).join(' · ') || 'Дело', body, 'panel');
}

// ▼▼▼ next/boot.js
// ═══ next/boot.js — запуск новой версии ═══
// 1) изоляция от прежней версии проверена — иначе останавливаемся, ничего не трогая;
// 2) каркас рисуется сразу (тема применена ещё при загрузке ui/shell.js); 3) слой данных на СВОЕЙ базе; 4) экран «Сегодня».
// window.NEXT_READY — отчёт для живой проверки (next_check.py): база, число записей, версия правил сроков.
const NEXT_BOOT = {
  say(msg, warn) { // остановка до запуска интерфейса — отдельный экран с причиной; обычные сообщения — через toast
    if (!warn) { toast(msg); return; }
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="stop-screen panel pad"><h2>Новая версия остановлена</h2><p class="muted" style="margin-top:10px">${esc(msg)}</p></div>`;
  },
  async report() {
    const counts = {}; for (const st of STORES) counts[st] = (await getAllRaw(st)).length;
    return { версия: APP_VER, изоляция: NEXT_NS.ok, база: db && db.name, версияБазы: db && db.version, правилаСроков: RULES_VER, секреты: _sec.ok, записей: counts };
  },
  async start() {
    if (!NEXT_NS.ok) { this.say('Изоляция от прежней версии не сработала (' + NEXT_NS.why + ') — программа остановлена, данные не тронуты.', true); return; }
    shellRender(); nav('today');
    try { await dataInit(); } catch (e) { logErr('next:init', e); this.say('Сбой запуска слоя данных: ' + ((e && e.message) || e), true); return; }
    try { await refreshCasesCache(); } catch (e) { logErr('next:cases-cache', e); }
    syncStatusRender(); // этап 1г: состояние синхронизации в шапке — после запуска слоя данных (секреты уже прочитаны)
    UI.ready = true; await nav('today');
    window.NEXT_READY = await this.report();
  },
};
document.addEventListener('DOMContentLoaded', () => { NEXT_BOOT.start(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) { // https или локальная проверка
  // своя область /next/ (sw.js лежит рядом с index.html в папке next) — прежний sw.js в корне сюда не относится
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => logErr('next:sw', e)); });
}
