name: PrivateScan APK
on:
  push:
    branches: [family-scan-prototype-20261030]
    paths:
      - 'scanner-app/**'
      - '.github/workflows/private-scan-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        run: gradle -p scanner-app :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateScan-debug-apk
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
