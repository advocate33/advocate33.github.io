<style>
/* ═══ tokens.css — оформление новой версии (этап 1б) ═══
   Источник — src/app.css «Практики» 1.1 (reference/CRM_Practice_v1_1). Поправки (DIZAJN_praktika.md):
   • вспомогательный текст светлой темы #5b6b80 → #56667b (контраст не ниже 5:1 на всех светлых поверхностях — раздел 7);
   • радиусы сведены к трём: 6 / 10 / 12 px;
   • имена переменных — наши: --accent, --on-accent, --accent-soft, --text, --text-muted;
   • на html и body нет overflow — иначе на телефоне пропадает прокрутка пальцем (урок 30);
   • внешних шрифтов и url() нет (правило 2). */
:root{color-scheme:light;
  --bg:#f3f5f9;--surface:#fff;--surface2:#f7f9fc;--text:#22324a;--text-muted:#56667b;--line:#dce3ed;
  --accent:#345dcb;--accent-soft:#eaf0ff;--on-accent:#fff;
  --nav:#172c48;--nav-ink:#e9f0fa;--nav-muted:#b3c2d6;
  --good:#206c55;--good-bg:#e8f5ee;--warn:#865116;--warn-bg:#fff3df;--bad:#b3343d;--bad-bg:#fff0f0;
  --shadow:0 8px 28px #12294a0b;--r-sm:6px;--r-md:10px;--radius:12px;
  --app-font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--font-scale:1;
  --touch:44px}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#111a28;--surface:#1a2739;--surface2:#213146;--text:#edf3ff;--text-muted:#b0bfd2;--line:#394b63;
  --accent:#99b6ff;--accent-soft:#283f66;--on-accent:#142648;
  --nav:#0d1623;--nav-ink:#e9f0fa;--nav-muted:#b3c2d6;
  --good:#93d6b7;--good-bg:#203e34;--warn:#f3ca89;--warn-bg:#403421;--bad:#ffadb2;--bad-bg:#492c36;--shadow:0 8px 28px #0002}
html{font:calc(16px * var(--font-scale))/1.5 var(--app-font);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:transparent}
button:disabled{cursor:default;opacity:.6}
a{color:var(--accent);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1{font-size:1.8rem;line-height:1.2;letter-spacing:-.035em;font-weight:650}
h2{font-size:1.08rem;font-weight:650}
h3{font-size:1rem;font-weight:600}
.small{font-size:.8125rem}.muted{color:var(--text-muted)}.num{font-variant-numeric:tabular-nums}
.icon{width:20px;height:20px;stroke-width:1.75;flex:none;vertical-align:middle}
.icon-sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
[hidden]{display:none!important}
.grow{flex:1;min-width:0}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:grid;gap:18px;align-content:start}

/* ── каркас: боковая панель на всю высоту, верхняя панель, рабочая область ── */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--nav);color:var(--nav-ink);padding:22px 14px 14px}
.sidebar>nav{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:#ffffff30 transparent}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 14px;flex:none}
.brand-mark{height:38px;width:38px;display:grid;place-items:center;border:1px solid #ffffff60;border-radius:var(--r-md);font-size:25px;font-family:Georgia,'Times New Roman',serif;color:#fff;flex:none}
.brand strong{display:block;letter-spacing:.06em;font-size:.875rem;white-space:nowrap}
.brand small{color:var(--nav-muted);font-size:.75rem}
.nav-label{color:var(--nav-muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px 4px}
.nav-item{width:100%;min-height:38px;display:flex;align-items:center;gap:11px;text-align:left;padding:7px 13px;color:var(--nav-muted);border-radius:var(--r-md);font-size:.875rem;margin:1px 0}
.nav-item:hover{background:#ffffff0c;color:var(--nav-ink)}
.nav-item.active{color:#fff;background:#ffffff17;font-weight:600;box-shadow:inset 3px 0 #8baeff}
.nav-item .count{margin-left:auto;background:#ffffff14;font-size:.75rem;padding:0 6px;border-radius:var(--r-sm)}
.nav-bottom{flex:none;margin-top:10px;padding-top:10px;border-top:1px solid #ffffff20}
.workspace{min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 30px;min-height:76px;border-bottom:1px solid var(--line);background:var(--surface)}
.top-brand{display:none}
.search-wrap{position:relative;flex:1;max-width:430px;min-width:0;color:var(--text-muted)}
.search-wrap input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px 10px 37px;font-size:.875rem;height:42px}
.search-wrap>.icon{position:absolute;left:12px;top:12px;width:17px;height:17px;pointer-events:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync-status{font-size:.75rem;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:var(--touch);padding:0 6px;border-radius:var(--r-md)}
.sync-status:hover{background:var(--surface2)}
.sync-status .icon{width:16px;height:16px}
.main{padding:28px 30px 36px;max-width:1600px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.page-head .subtitle{font-size:.875rem;color:var(--text-muted);margin-top:7px}
.head-actions,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── кнопки, значки, панели ── */
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:.875rem;font-weight:600;text-decoration:none}
.button:hover{background:var(--surface2)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.button.primary:hover{filter:brightness(.96)}
.button.small-btn{min-height:36px;padding:7px 10px;font-size:.8125rem}
.button .icon{width:17px;height:17px}
.icon-button{display:inline-grid;place-items:center;min-width:42px;min-height:42px;border-radius:var(--r-md);color:var(--text-muted)}
.icon-button:hover{background:var(--surface2);color:var(--text)}
.text-button{min-height:38px;padding:5px 0;color:var(--accent);font-size:.875rem;text-align:left;display:inline-flex;align-items:center;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel.pad{padding:22px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title h2{display:flex;align-items:center;gap:8px}
.panel.collapsed .panel-title{border-bottom:0}
.panel-tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.panel-tools .text-button{min-height:36px;font-size:.8125rem;padding:5px 8px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-sm);padding:3px 7px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--text-muted);white-space:normal;max-width:100%}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.good{background:var(--good-bg);color:var(--good)}
.empty{padding:40px 22px;text-align:center;color:var(--text-muted)}
.empty>.icon{width:35px;height:35px;margin-bottom:14px;color:var(--accent);opacity:.65}
.empty h3{color:var(--text);margin-bottom:8px}
.empty p{max-width:460px;margin:0 auto 12px;font-size:.875rem}
.intro-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;margin-bottom:24px;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius)}
.intro-strip h2{color:var(--accent);margin-bottom:5px}
.intro-strip p{color:var(--text-muted);font-size:.875rem;max-width:720px}
.info-box{padding:14px 16px;background:var(--surface2);border-radius:var(--r-md);font-size:.8125rem;line-height:1.6;color:var(--text-muted);margin:14px 0}
.info-box.warning{background:var(--warn-bg);color:var(--warn)}

/* ── «Сегодня»: показатели, строки, расписание, ближайшее заседание ── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}
.stat{padding:17px 19px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);min-width:0}
.stat-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8125rem;color:var(--text-muted)}
.stat-label .icon{width:18px;height:18px}
.stat-value{font-size:1.9rem;line-height:1.2;letter-spacing:-.03em;margin-top:9px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-value.small-value{font-size:1.45rem}
.stat.alert .stat-value{color:var(--bad)}
.stat-meta{font-size:.75rem;color:var(--text-muted);margin-top:6px}
.day-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,1fr);gap:22px;align-items:start}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:0}
.task-check{display:grid;place-items:center;min-width:28px;min-height:28px;cursor:pointer;flex:none}
.task-check input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.task-title{display:block;font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.task-sub{font-size:.8125rem;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere}
.task-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.task-date{font-size:.8125rem;color:var(--text-muted);white-space:nowrap;padding-top:2px}
.task-date.overdue{color:var(--bad);font-weight:600}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"main done x";align-items:start;gap:4px 10px;padding:14px 10px 14px 20px;border-bottom:1px solid var(--line)}
.imp-row:last-of-type{border-bottom:0}
.imp-main{grid-area:main;min-width:0}.imp-done{grid-area:done}.imp-x{grid-area:x;margin-top:-4px}
.imp-done .button{min-height:36px}
.task-when{color:var(--text-muted);font-weight:600}.task-when.overdue{color:var(--bad)}
.panel-foot{font-size:.8125rem;color:var(--text-muted);padding:12px 20px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agenda-row{display:grid;grid-template-columns:55px minmax(0,1fr);gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.agenda-row:last-child{border-bottom:0}.agenda-row+.day-mark{border-top:0}
.agenda-time{font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.875rem;overflow-wrap:anywhere}
.agenda-title{font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.agenda-sub{font-size:.8125rem;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere}
.agenda-stripe{padding:0 0 0 13px;border-left:3px solid var(--accent);min-width:0}
.agenda-stripe.meeting{border-color:var(--good)}
.agenda-stripe.task{border-color:var(--warn)}
.agenda-stripe.deadline{border-color:var(--bad)}
.agenda-stripe.done{opacity:.7}
.agenda-row .badge{margin-top:8px}
.day-mark{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line)}
.upcoming-hero{background:var(--nav);color:#fff;padding:20px 22px 22px;border-radius:var(--radius)}
.upcoming-hero small{color:#bdcce0;font-size:.8125rem}
.upcoming-hero .hero-time{font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.04em;margin:10px 0}
.upcoming-hero h2{overflow-wrap:anywhere}
.upcoming-hero p{color:#d6e0ee;font-size:.875rem;margin-top:7px;overflow-wrap:anywhere}
.upcoming-hero .icon-button{color:#bdcce0;margin:-10px -12px 0 0}
.upcoming-hero .icon-button:hover{background:#ffffff17;color:#fff}
.collapsed-note{font-size:.8125rem;color:var(--text-muted);display:flex;justify-content:flex-end}

/* ── заглушки разделов, листы, сообщения ── */
.stub-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
dialog{position:fixed;padding:0;margin:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 22px 80px #0005;overflow:auto}
dialog::backdrop{background:#0c183a70}
.modal-head{padding:18px 16px 14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h2{font-size:1.2rem}
.modal-content{padding:20px 24px 24px}
.modal-content>p{font-size:.9375rem;margin:0 0 12px}
.list-rows>*{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.875rem}
.list-rows>*:last-child{border-bottom:0}
.list-rows .muted{text-align:right}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.choice .button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.section-label{color:var(--text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.section-label:first-child{margin-top:0}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-tile{padding:14px;text-align:left;display:flex;align-items:center;gap:10px;min-height:var(--touch);font-size:.875rem;font-weight:600;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.more-tile .icon{color:var(--accent)}
.search-result{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.search-result:last-child{border-bottom:0}
#toast{position:fixed;right:24px;bottom:25px;max-width:min(460px,calc(100vw - 32px));border-radius:var(--r-md);background:var(--nav);color:#fff;padding:13px 18px;font-size:.875rem;box-shadow:0 6px 22px #0003;z-index:1000;display:none}
#toast.visible{display:block}
#toast.error{background:#873a42}
.stop-screen{max-width:560px;margin:14vh auto;padding:28px}
.bottom-nav{display:none}

/* ── точки перелома «Практики»: 1180 / 900 / 640 ── */
@media(max-width:1180px){
  .layout{grid-template-columns:188px minmax(0,1fr)}.sidebar{padding:21px 10px}.brand{padding:0 8px 20px;gap:9px}.brand strong{font-size:.875rem}
  .main{padding:24px 20px}.topbar{padding:14px 20px}.day-grid{grid-template-columns:minmax(0,1.15fr) minmax(280px,1fr)}
  .stats{gap:10px}.stat{padding:15px}.stat-value{font-size:1.65rem}}
@media(max-width:900px){
  .layout{grid-template-columns:78px minmax(0,1fr)}.brand{justify-content:center;padding:0 0 20px}
  .brand>div:last-child,.nav-label,.nav-item span,.nav-item .count{display:none}
  .nav-item{justify-content:center;padding:12px}.nav-item .icon{width:22px;height:22px}.sidebar{padding:18px 10px}
  .day-grid{grid-template-columns:1fr}.sync-status span{display:none}.intro-strip{align-items:flex-start;flex-direction:column;gap:14px}}
@media(max-width:640px){
  .layout{display:block}.sidebar{display:none}
  .topbar{padding:10px 12px;gap:8px;min-height:64px}.top-brand{display:grid}.top-brand .brand-mark{border-color:var(--line);color:var(--accent);width:34px;height:34px;font-size:21px}
  .search-wrap{max-width:none}.search-wrap input{font-size:1rem;height:var(--touch)}.search-wrap>.icon{top:13px}.top-actions{gap:2px}
  .main{padding:20px 14px 110px}.page-head{margin-bottom:18px;gap:12px}.page-head h1{font-size:1.65rem}.page-head .subtitle{font-size:.8125rem}
  button,.button,.button.small-btn,.text-button,.panel-tools .text-button,.row-actions .button{min-height:var(--touch)}
  .icon-button{min-width:var(--touch);min-height:var(--touch)}
  .page-head .head-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}.head-actions .button{padding:9px 6px;font-size:.8125rem;gap:6px}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;padding:6px 6px calc(7px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:30;box-shadow:0 -5px 20px #16274708}
  .bottom-nav button{min-height:52px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;border-radius:var(--r-md)}
  .bottom-nav button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .bottom-nav .icon{width:21px;height:21px}
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{padding:14px}.stat-value{font-size:1.65rem}.stat-value.small-value{font-size:1.3rem}.stat-label{font-size:.75rem}
  .day-grid{gap:16px}.day-grid>.stack{display:contents}
  .t-hero{order:0}.t-important{order:1}.t-schedule{order:2}.t-next{order:3}
  .panel.pad{padding:18px}.panel-title{padding:10px 8px 10px 16px}
  .imp-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main x" "done done";padding:12px 4px 12px 16px;gap:8px}
  .imp-done .button{min-height:var(--touch)}
  .panel-foot{padding:10px 16px 12px}
  .agenda-row{padding:15px 16px;gap:10px;grid-template-columns:48px minmax(0,1fr)}
  .day-mark{padding:9px 16px}
  .intro-strip{padding:18px;margin-bottom:18px}
  dialog{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}.modal-head{padding:12px 8px 10px 18px}.modal-content{padding:16px 18px 20px}
  #toast{right:16px;bottom:85px}.more-grid{gap:8px}}

/* ── «Дела» (этап 1в): фильтры, список, таблица, доска, панель карточки справа ── */
.work-grid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.side{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.toolbar .search-wrap{width:280px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:.8125rem;font-weight:600;color:var(--text-muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip-n{font-weight:500;opacity:.8}
.view-switch{display:flex;gap:4px}
.view-switch .button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.case-row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line);color:inherit}
.case-row:last-child{border-bottom:0}
.case-row:hover{background:var(--surface2)}
.case-row>.icon{color:var(--text-muted)}
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:.875rem}

  if (!d) return null;
  const parts = String(d).slice(0,10).split('-');
  if (parts.length < 3) return null;
  const target = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
};

const ENC_ITER_V1 = 210000;
const ENC_ITER_V2 = 310000;

// ── Шифрование (Web Crypto: PBKDF2 → AES-GCM 256) ──
const _te = new TextEncoder(), _td = new TextDecoder();

function bufToB64(buf) {

function b64ToBuf(s) {

  const iv   = crypto.getRandomValues(new Uint8Array(12));

  const aad  = _te.encode(`${ENC_FMT}|2|${ENC_ITER_V2}`);
  const ct   = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData:aad }, key, _te.encode(JSON.stringify(obj)));

    _fmt: ENC_FMT, v: 2, alg: 'A256GCM', kdf: 'PBKDF2-SHA256', iter: ENC_ITER_V2,

  const ver = Number(p.v || 1);
  if (ver !== 1 && ver !== 2) throw new Error('unsupported_version');
  const rounds = ver === 1 ? ENC_ITER_V1 : Number(p.iter || ENC_ITER_V2);
  if (ver === 2 && (p.alg !== 'A256GCM' || p.kdf !== 'PBKDF2-SHA256')) throw new Error('badformat');

  if (ver === 2) params.additionalData = _te.encode(`${ENC_FMT}|2|${rounds}`);
  const pt  = await crypto.subtle.decrypt(params, key, b64ToBuf(p.data));

}

  const secretStamps = secretStampsGet();
  const unstamped = SYNC_SECRET_KEYS.filter(k => localStorage.getItem(k) !== null && !Number(secretStamps[k] || 0));
  if (unstamped.length) {
    secretsUpd = Math.max(secretsUpd, Number(localStorage.getItem('crm_settings_upd') || 0), Date.now());
    unstamped.forEach(k => { secretStamps[k] = secretsUpd; });
    localStorage.setItem('crm_secrets_upd', String(secretsUpd));
    secretStampsSave(secretStamps);
  }
  const s = {
    _upd: Number(localStorage.getItem('crm_settings_upd') || 0),
    _secretsIncluded: true,
    _secretsUpd: secretsUpd,
    _secrets: {},
    _secretStamps: {}
  };
  SYNC_SETTINGS_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) s[k] = v; });
  // null тоже сохраняем: так отключение интеграции переносится на другие устройства.
  SYNC_SECRET_KEYS.forEach(k => {
    s._secrets[k] = localStorage.getItem(k);
    s._secretStamps[k] = Number(secretStamps[k] || 0);
  });
  return s;
}

  // файлы без метки. На настроенном устройстве побеждает более новая версия.

        try { const mine = lsJSON('crm_purged', {}) || {}, theirs = JSON.parse(incoming[k]) || {}; let ch = false; for (const id of Object.keys(theirs)) { const t = Number(theirs[id] || 0); if (t > Number(mine[id] || 0)) { mine[id] = t; ch = true; } } if (ch) { localStorage.setItem('crm_purged', JSON.stringify(mine)); changed = true; } } catch (e) { logErr('purged:merge', e); }
        return;

      typeof secrets.crm_lock_salt === 'string' && !!secrets.crm_lock_salt &&

      /^\d+$/.test(String(secrets.crm_lock_iter || ''))

        localStorage.setItem(k, v); secretsChanged = true;
      }

      return true;
    };

    // хэш/соль/число итераций от разных устройств.
    const inPinStamp = Math.max(...pinKeyList.map(incomingStamp));
    const localPinStamp = Math.max(...pinKeyList.map(k => Number(localStamps[k] || 0)));
    if (completePin && (inPinStamp > localPinStamp || (!localHasPin && wantsPin && inPinStamp === localPinStamp))) {
      pinKeyList.forEach(k => applySecret(k, incomingStamp(k) || inPinStamp));
    }

    SYNC_SECRET_KEYS.filter(k => !pinKeys.has(k)).forEach(k => {
      if (!owns(secrets, k)) return;
      const stamp = incomingStamp(k);
      const localStamp = Number(localStamps[k] || 0);

    // биометрию можно включить заново в настройках этого устройства.
  }
  if (changed) { try { applyTheme(localStorage.getItem('crm_theme') || 'dark'); applyFontSettings(); } catch (e) { if (typeof logErr === "function") logErr("", e); } }
  return { changed, secretsChanged };
}

function validateBackup(parsed) {

  let total = 0;

    const rows = parsed.data[store] === undefined ? [] : parsed.data[store];
    if (!Array.isArray(rows)) return {ok:false,error:`Повреждён раздел «${store}»`};
    if (rows.length > 50000) return {ok:false,error:`Слишком много записей в разделе «${store}»`};

    const v = incomingSettings[k];
    if (typeof v === 'string' && v.length <= 200000) clean.settings[k] = v;
  });
  const rawSecrets = incomingSettings._secrets && typeof incomingSettings._secrets === 'object' && !Array.isArray(incomingSettings._secrets)

  const hasSecrets = incomingSettings._secretsIncluded === true || SYNC_SECRET_KEYS.some(k => Object.prototype.hasOwnProperty.call(rawSecrets, k));
  if (hasSecrets) {
    const secretsUpd = Number(incomingSettings._secretsUpd ?? incomingSettings._upd ?? 0);
    clean.settings._secretsIncluded = true;
    clean.settings._secretsUpd = Number.isFinite(secretsUpd) ? Math.max(0, Math.min(secretsUpd, Date.now()+86400000)) : 0;
    clean.settings._secrets = {};

      const v = rawSecrets[k];
      if (v === null) clean.settings._secrets[k] = null;
      else if (typeof v === 'string' && v.length <= 200000) clean.settings._secrets[k] = v;

}

// Однократная безопасная доводка старых записей до устойчивых связей.
// Ничего не удаляет: текстовые caseNum/client сохраняются для совместимости.
async function migrateStableRelations() {
  const clients = await getAll('clients');
  const clientNameCounts = {};
  clients.forEach(c=>{ const n=String(c.name||'').trim().toLowerCase(); if(n) clientNameCounts[n]=(clientNameCounts[n]||0)+1; });
  const clientByName = new Map(clients.filter(c=>{
    const n=String(c.name||'').trim().toLowerCase(); return n && clientNameCounts[n]===1;
  }).map(c=>[String(c.name).trim().toLowerCase(), c]));
  for (const cl of clients) {
    if (cl.type === 'Физлицо') { cl.type = 'Физическое лицо'; await put('clients', cl); }
  }
  const cases = await getAll('cases');
  const caseNumCounts = {};
  cases.forEach(c=>{ if(c.number) caseNumCounts[c.number]=(caseNumCounts[c.number]||0)+1; });
  const caseByNum = new Map();
  for (const c of cases) {
    if (c.number && caseNumCounts[c.number] === 1) caseByNum.set(c.number, c);
    let changed = false;
    if (!c.clientId && c.client) {
      const cl = clientByName.get(String(c.client).trim().toLowerCase());
      if (cl) { c.clientId = cl.id; changed = true; }
    }
    if (c.status === 'В производстве') { c.status = 'В работе'; changed = true; }
    if (!c.initialStatus) { c.initialStatus = c.status || 'Новое'; changed = true; }
    if (c.status === 'Завершено' && !c.closedAt) {
      c.closedAt = localISO(new Date(Number(c._upd || c.createdAt || Date.now())));
      changed = true;
    }
    if (changed) await put('cases', c);
  }
  const linkedStores = ['hearings','finance','mail','tasks','orders','expenses','time','deposits','poa','meetings','files'];
  for (const store of linkedStores) {
    const rows = await getAll(store);
    for (const row of rows) {
      let changed = false;
      const cs = row.caseNum ? caseByNum.get(row.caseNum) : null;
      if (cs && !row.caseId) { row.caseId = cs.id; changed = true; }
      if (store === 'files' && row.caseId && !row.caseNum) {
        const byId = cases.find(c=>c.id===row.caseId);
        if (byId?.number) { row.caseNum = byId.number; changed = true; }
      }
      if (store === 'finance' && !row.clientId && row.client) {
        const cl = clientByName.get(String(row.client).trim().toLowerCase());
        if (cl) { row.clientId = cl.id; changed = true; }
      }
      if (store === 'poa' && row.clientId) {
        const cl = clients.find(c=>c.id===row.clientId);
        if (cl && row.clientName !== cl.name) { row.clientName = cl.name; changed = true; }
      }
      if (changed) await put(store, row);
    }
  }
}

// v197: журнал дела — caseEvents (индексные выборки) + legacy c.history, дедуп по id
async function caseJournal(c) {
  const seen = new Set(); const out = [];
  const take = (e, at) => {
    const id = e.id || (at + '|' + (e.field || '') + '|' + (e.to || ''));
    if (seen.has(id)) return; seen.add(id);
    out.push({ id, at: at || 0, field: e.field || '', from: e.from || '', to: e.to || '', source: e.source || '' });
  };
  try { (await getCaseLinks('caseEvents', c)).forEach(e => take(e, e.ts)); } catch (e) { if (typeof logErr === "function") logErr("", e); }
  (Array.isArray(c && c.history) ? c.history : []).forEach(h => take(h, h.at));
  return out.sort((a, b) => a.at - b.at);
}

async function mailRefresh(only) {
  const all = await getAll('mail');
  const plan = mailTrackPlan(all, only);
  if (!plan.total) { toast(only ? 'У отправления нет трек-номера' : 'Сначала добавьте отправление с трек-номером', true); return null; }
  if (!SRV.url) { toast('Подключите личный сервер: Настройки → «Почта России — отслеживание»', true); return null; }
  if (!plan.toTrack.length) { toast(`Все отправления уже вручены (${plan.skipped}) — запросы к Почте не расходуем`); return { updated: 0, skipped: plan.skipped }; }
  toast('Запрашиваю Почту России…');
  const j = await srvCall('track', { barcodes: plan.toTrack.map(m => m.barcode) });
  if (!j || !j.ok) { const e = String((j && j.error) || ''); toast(!j ? 'Нет связи с личным сервером' : e === 'auth' ? 'Неверный секретный код сервера' : /POCHTA/.test(e) ? 'На сервере не заданы логин и пароль API Почты — Настройки → «Почта России — отслеживание»' : 'Сервер: ' + (e || 'ошибка'), true); if (j && /POCHTA/.test(e)) localStorage.setItem(POCHTA_READY_KEY, '0'); return null; }
  localStorage.setItem(POCHTA_READY_KEY, '1');
  let updated = 0;
  for (const m of plan.toTrack) { if (mailApplyTrack(m, (j.results || {})[m.barcode])) { try { await put('mail', m); updated++; } catch (e) { logErr('mail:track:put', e); } } }
  const s = mailTrackSummary(updated, j.errors, plan.skipped); toast(s.text, s.warn);
  return { updated, errors: j.errors || {}, skipped: plan.skipped };
}

function sheetPlace(entry) {

// ── «После заседания» (этап 2б, перенос v296/v312): состоялось / отложено / отменено, результат, следующее заседание,
// задача по итогам. Правила v312: «Проведено» ставит человек; авто-метка снимается; id следующего заседания и задачи
// постоянные (afterNextId, afterTaskId — повтор после сбоя не создаёт дублей); запись в журнал дела. Учёт времени — этап 3.
function afterHearingModel(h, v) {

  if (v.next && !/^\d{4}-\d{2}-\d{2}$/.test(v.next)) return { error: 'Дата следующего заседания — из поля даты' };
  if (v.next && v.next <= h.date) return { error: 'Следующее заседание должно быть позже этого' };
  if (v.nextTime && !/^\d{1,2}:\d{2}$/.test(v.nextTime)) return { error: 'Время — в формате ЧЧ:ММ' };
  if (v.taskDue && !/^\d{4}-\d{2}-\d{2}$/.test(v.taskDue)) return { error: 'Срок задачи — из поля даты' };
  const upd = { ...h, status: what === 'cancelled' ? 'Отменено' : 'Проведено', result: (what === 'postponed' ? 'Отложено. ' : '') + result, afterAt: Date.now() };
  delete upd.autoDone; upd.afterNextId = h.afterNextId || uid('С'); upd.afterTaskId = h.afterTaskId || uid('З');
  const next = v.next ? { id: upd.afterNextId, caseId: h.caseId, caseNum: h.caseNum, date: v.next, time: v.nextTime || h.time || '', court: h.court || '', judge: h.judge || '', room: h.room || '', status: 'Назначено', note: what === 'postponed' ? 'после отложения от ' + fmtDate(h.date) : '' } : null;
  const task = String(v.task || '').trim() ? { id: upd.afterTaskId, title: String(v.task).trim(), caseId: h.caseId, caseNum: h.caseNum, due: v.taskDue || '', src: 'после заседания' } : null;

  return { hearing: upd, next, task, log, what };
}

function ahPick(btn) { btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn))); }
async function afterHearingSave(id) {

// ═══ ui/combo.js — строка с поиском по справочнику и добавлением из формы (замечание пользователя 30.09.2026) ═══
// Замечание: категории дел по умолчанию в v310 повторяли стадии; при наполненных справочниках в выпадающем списке
// тяжело найти суд, судью, орган, роль. Решение: поле — обычная строка; при вводе показываются подходящие значения
// справочника (сначала начинающиеся с введённого, затем содержащие); если такого значения нет — строка «Добавить … в
// справочник»; при сохранении формы новое значение запоминается в справочнике (saveRef v310). Список категорий дел
// в новой версии пустой — пользователь наполняет его сам (nextRefsClean).
// Чистые функции для тестов: comboFilter, comboHasExact, refRememberModel, nextRefsCleanModel.
const COMBO_EXTRA = {};
const COMBO_LIMIT = 30;
const refName = x => (x && typeof x === 'object') ? String(x.name || '') : String(x == null ? '' : x);
function comboNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim(); }
// подсказки: сначала начинающиеся с введённого, затем содержащие; без повторов (регистр и «ё» не различаются)
function comboFilter(list, q, limit) {
  const n = comboNorm(q), seen = new Set(), out = [];
  const add = v => { const k = comboNorm(v); if (!k || seen.has(k)) return; seen.add(k); out.push(v); };
  if (!n) list.forEach(add); else { list.filter(v => comboNorm(v).startsWith(n)).forEach(add); list.filter(v => comboNorm(v).includes(n)).forEach(add); }
  return out.slice(0, limit || COMBO_LIMIT);
}
function comboHasExact(list, v) { const n = comboNorm(v); return !!n && list.some(x => comboNorm(refName(x)) === n); }
// новое значение для справочника: null — пусто или уже есть; иначе прежний список (как хранится) плюс строка
function refRememberModel(list, v) { const s = String(v || '').replace(/\s+/g, ' ').trim(); if (!s || comboHasExact(list || [], s)) return null; return [...(list || []), s]; }
// категории v310 по умолчанию = список стадий → в новой версии такой список считается пустым; свой список пользователя не трогается
const LEGACY_CATEGORIES = ['Досудебное урегулирование', 'Первая инстанция', 'Апелляция', 'Кассация', 'Надзор', 'Исполнительное производство', 'Консультация'];
function nextRefsCleanModel(list) { const l = Array.isArray(list) ? list : []; const legacy = new Set(LEGACY_CATEGORIES.map(comboNorm)); return l.length && l.every(x => legacy.has(comboNorm(refName(x)))) ? [] : l; }
function nextRefsClean() { if (typeof REF === 'object' && REF) REF.caseCategory = nextRefsCleanModel(REF.caseCategory); }
if (typeof DEFAULT_REF === 'object' && DEFAULT_REF) DEFAULT_REF.caseCategory = [];
if (typeof REF === 'object' && REF) nextRefsClean();

// поле формы: id, подпись, значение, ключ справочника (REF), дополнительные подсказки (например, роли по кодексу)
function fCombo(id, label, val, refKey, extra) {
  COMBO_EXTRA[id] = (extra || []).map(refName).filter(Boolean);
  return `<label class="field combo"><span>${esc(label)}</span><div class="combo-box"><input id="${id}" value="${esc(val == null ? '' : val)}" autocomplete="off" spellcheck="false" data-combo="1" data-ref="${esc(refKey)}"><button type="button" class="combo-toggle" tabindex="-1" aria-label="Показать список" data-for="${id}">${icon('chevron-down', 'icon-sm')}</button></div><div class="combo-list" id="${id}-menu" hidden></div></label>`;
}
function comboAll(input) { return [...new Set([...(COMBO_EXTRA[input.id] || []), ...refList(input.dataset.ref)])]; }
function comboMenu(input) { return document.getElementById(input.id + '-menu'); }
function comboRender(input) {
  const menu = comboMenu(input); if (!menu) return;
  const all = comboAll(input), q = String(input.value || '').replace(/\s+/g, ' ').trim(), items = comboFilter(all, q);
  const addRow = q && !comboHasExact(all, q) ? `<button type="button" class="combo-item combo-add" data-v="${esc(q)}">${icon('plus', 'icon-sm')}<span>Добавить «${esc(q)}» в справочник</span></button>` : '';
  const empty = !addRow && !items.length ? `<div class="combo-empty">Справочник пуст — введите значение, при сохранении оно запомнится</div>` : '';
  // строка «Добавить» — после найденных: Enter без выбора берёт первое совпадение, а не создаёт запись
  menu.innerHTML = items.map(v => `<button type="button" class="combo-item" data-v="${esc(v)}"><span>${esc(v)}</span></button>`).join('') + addRow + empty;
  menu.hidden = false;
}
function comboClose(input) { const menu = comboMenu(input); if (menu) { menu.hidden = true; menu.innerHTML = ''; } }
function comboCloseAll(except) { document.querySelectorAll('.combo-list:not([hidden])').forEach(m => { const inp = document.getElementById(m.id.replace(/-menu$/, '')); if (inp !== except) { m.hidden = true; m.innerHTML = ''; } }); }
function comboPick(input, v) { input.value = v; comboClose(input); input.dispatchEvent(new Event('change', { bubbles: true })); }
function comboMove(input, dir) {
  const menu = comboMenu(input); if (!menu || menu.hidden) { comboRender(input); return; }
  const items = [...menu.querySelectorAll('.combo-item')]; if (!items.length) return;
  const cur = items.findIndex(x => x.classList.contains('active')); let i = cur + dir; if (i < 0) i = items.length - 1; if (i >= items.length) i = 0;
  items.forEach(x => x.classList.remove('active')); items[i].classList.add('active'); items[i].scrollIntoView({ block: 'nearest' });
}
// запомнить введённое в справочниках: все строки-справочники внутри root (allow отсеивает поля скрытых вкладок другого вида дела)
async function comboRememberAll(root, allow) {
  let n = 0;
  for (const inp of (root || document).querySelectorAll('input[data-combo]')) {
    if (allow && !allow(inp)) continue;
    // без ключа — подсказки без справочника (доверитель, противная сторона)
    const key = inp.dataset.ref; if (!key || !REF || !Array.isArray(REF[key])) continue;
    const next = refRememberModel(REF[key], inp.value); if (!next) continue;
    try { await saveRef(key, next); n++; } catch (e) { logErr('refs:remember', e); }
  }
  return n;
}
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('input', e => { const t = e.target; if (t && t.matches && t.matches('input[data-combo]')) comboRender(t); });
  document.addEventListener('focusin', e => { const t = e.target; if (t && t.matches && t.matches('input[data-combo]')) { comboCloseAll(t); comboRender(t); } });
  document.addEventListener('click', e => {
    const t = e.target, item = t.closest && t.closest('.combo-item');
    if (item) { const input = item.closest('.combo').querySelector('input[data-combo],input[data-addr]'); if (item.dataset.zip && input.dataset.zipFor) { const z = document.getElementById(input.dataset.zipFor); if (z) z.value = item.dataset.zip; } comboPick(input, item.dataset.v || ''); return; }
    const tg = t.closest && t.closest('.combo-toggle');
    if (tg) { const input = document.getElementById(tg.dataset.for); if (!input) return; const m = comboMenu(input); if (m && !m.hidden) comboClose(input); else { comboCloseAll(input); comboRender(input); input.focus(); } return; }
    if (!(t.closest && t.closest('.combo'))) comboCloseAll(null);
  });
  document.addEventListener('keydown', e => {
    const t = e.target; if (!(t && t.matches && t.matches('input[data-combo]'))) return;
    const m = comboMenu(t);
    if (e.key === 'ArrowDown') { e.preventDefault(); comboMove(t, 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); comboMove(t, -1); }
    else if (e.key === 'Escape' && m && !m.hidden) { e.preventDefault(); comboClose(t); }
    else if (e.key === 'Enter' && m && !m.hidden) { e.preventDefault(); const a = m.querySelector('.combo-item.active') || m.querySelector('.combo-item'); if (a) comboPick(t, a.dataset.v || ''); else comboClose(t); }
  });
}

// ═══ ui/deadlines.js — сроки дела и паспорт срока (этап 2б, часть 4б) ═══
// Данные и правила — v310/v312 без изменений (rules/deadlines.js): срок хранится в деле (c.deadlines[]) с полями
// title, date, kind (procedural | control), baseEv, baseDate, norm, calc, calcDate, rulesVer, src, autoKey, confirmedAt,
// confirmedDate, done, note; удаление — надгробие c._delDl[id] (v294). Паспорт срока (v296/v301): основание, норма, алгоритм
// расчёта, версия правил, подтверждение; срок справочный — каждый подтверждает пользователь (раздел 10 правил).
// dlPassport, dlEditModel, dlConfirmModel — чистые функции, их проверяет next_2b.js.

function dlIsControl(dl) { return !!dl && (dl.kind === 'control' || (!dl.kind && dl.source === 'workflow')); }
function dlFind(c, key) { const list = Array.isArray(c && c.deadlines) ? c.deadlines : []; if (String(key).startsWith('i:')) return list[Number(key.slice(2))] || null; return list.find(d => d && d.id === key) || null; }
const dlKey = (dl, i) => (dl && dl.id) ? dl.id : 'i:' + i;

function dlPassport(dl, rulesVer, today) {
  const rows = [], k = today && dl.date ? todayDayDiff(dl.date, today) : null;
  rows.push(['Состояние', dl.done ? 'выполнен' + (dl.doneAt ? ' ' + fmtDate(dl.doneAt) : '') : k === null ? '' : k < 0 ? 'просрочен на ' + (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') : k === 0 ? 'сегодня' : 'через ' + k + ' ' + plural(k, 'день', 'дня', 'дней')]);
  rows.push(['Вид', dlIsControl(dl) ? 'внутренний контроль (рабочий план)' : 'процессуальный — требует основания и подтверждения']);
  if (dl.baseEv || dl.baseDate) rows.push(['Основание', [dl.baseEv, dl.baseDate ? fmtDate(dl.baseDate) : ''].filter(Boolean).join(' · ')]);
  if (dl.norm) rows.push(['Норма', dl.norm]);
  if (dl.calc) rows.push(['Расчёт', dl.calc]);
  if (dl.rulesVer) rows.push(['Версия правил', dl.rulesVer + (rulesVer && dl.rulesVer !== rulesVer && !dl.confirmedAt ? ' — есть новее (' + rulesVer + '), срок можно пересчитать' : '')]);
  if (dl.calcDate && dl.date && dl.calcDate !== dl.date) rows.push(['Рассчитано / установлено', fmtDate(dl.calcDate) + ' / ' + fmtDate(dl.date)]);
  if (dl.src) rows.push(['Источник', dl.src]);
  if (!dlIsControl(dl)) rows.push(['Подтверждение', dl.confirmedAt ? (dl.confirmedDate && dl.confirmedDate !== dl.date ? 'подтверждена иная дата — ' + fmtDate(dl.confirmedDate) + ', установлена ' + fmtDate(dl.date) : 'подтверждено ' + fmtDate(localISO(new Date(Number(dl.confirmedAt))))) : 'дата не подтверждена — проверьте исчисление и подтвердите']);

// подтверждение даты пользователем: отметка времени и подтверждённая дата = текущая дата срока
function dlConfirmModel(dl, now) { return { ...dl, confirmedAt: now, confirmedDate: dl.date }; }
// правка срока (как saveDeadline v312): технические поля не теряются; подтверждение сохраняется, только если дата не менялась
function dlEditModel(prev, v, now) {
  const title = String(v.title || '').trim(), date = v.date || '';

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return { error: 'Укажите дату срока' };
  if (v.baseDate && !/^\d{4}-\d{2}-\d{2}$/.test(v.baseDate)) return { error: 'Дата основания — из поля даты' };
  const p = prev || {}, confirmed = !!v.confirm;
  return { obj: { ...p, id: p.id || uid('СР'), title, date, note: String(v.note || '').trim(), done: !!p.done, kind: v.kind === 'control' ? 'control' : 'procedural',
    baseEv: String(v.baseEv || '').trim(), baseDate: v.baseDate || '', norm: String(v.norm || '').trim(), calcDate: p.calcDate || '', src: p.src || 'Вручную',
    confirmedAt: confirmed ? ((p.confirmedAt && p.date === date) ? p.confirmedAt : now) : '', confirmedDate: confirmed ? date : '', createdAt: p.createdAt || now } };
}

// ═══ ui/trash.js — удаление записей и корзина (этап 2б) ═══
// Правила — как в v310: удаление = «надгробие» (_deleted, _deletedAt), данные сохраняются и возвращаются из корзины
// (del / undelete, data/db.js); окончательное удаление запоминается в реестре crm_purged (purge) — старая копия
// с другого устройства или с сервера запись не вернёт. Подтверждение — лист внутри программы, а не окно браузера.
// Новое по сравнению с v310: вместе с делом можно убрать в корзину его заседания и задачи (отметка _deletedWith —

// Состав корзины — как в v310 (TRASH_STORES): в неё попадают и записи, удалённые в прежней программе
const TRASH_STORES = [
  { store: 'cases', label: 'Дело', name: r => [r.number, r.client].filter(Boolean).join(' · ') || 'без номера' },
  { store: 'hearings', label: 'Заседание', name: r => [r.caseNum, r.date ? fmtDate(r.date) : '', r.time].filter(Boolean).join(' · ') || 'без даты' },
  { store: 'clients', label: 'Участник', name: r => r.name || 'без имени' },
  { store: 'finance', label: 'Платёж', name: r => [r.service, r.amount ? fmtMoney(r.amount) : ''].filter(Boolean).join(' · ') || 'без суммы' },
  { store: 'tasks', label: 'Задача', name: r => r.title || 'без названия' },
  { store: 'expenses', label: 'Расход', name: r => [r.category, r.amount ? fmtMoney(r.amount) : ''].filter(Boolean).join(' · ') || 'без суммы' },
  { store: 'deposits', label: 'Депозит', name: r => (r.amount ? fmtMoney(r.amount) : 'без суммы') },

  { store: 'files', label: 'Файл', name: r => r.name || 'без названия' },
  { store: 'time', label: 'Время', name: r => [r.caseNum, (r.minutes || 0) + ' мин'].filter(Boolean).join(' · ') },

  { store: 'meetings', label: 'Встреча', name: r => [r.caseNum, r.date ? fmtDate(r.date) : '', r.with].filter(Boolean).join(' · ') || 'без даты' },
  { store: 'templates', label: 'Шаблон', name: r => r.name || r.title || 'без названия' },

const trashMeta = store => TRASH_STORES.find(t => t.store === store) || { store, label: 'Запись', name: r => String(r.id) };

// raw — { хранилище: все записи, включая надгробия }. Свежие — первыми; ушедшие вместе с делом — сразу под ним.
function trashItems(raw) {
  const items = [];

}
// Что будет удалено: сама запись и (для дела) связанные с ним заседания и задачи. d — { hearings, tasks } без надгробий.
function deletePlan(store, rec, d) {
  const meta = trashMeta(store), plan = { store, id: rec.id, label: meta.label, name: meta.name(rec), linked: {}, linkedCount: 0 };
  if (store !== 'cases') return plan;
  const mine = x => x && !x._deleted && (x.caseId ? x.caseId === rec.id : (!!rec.number && x.caseNum === rec.number));
  for (const st of DELETE_LINKED) { plan.linked[st] = ((d && d[st]) || []).filter(mine); plan.linkedCount += plan.linked[st].length; }

// Надгробие записи, ушедшей в корзину вместе с делом
function deleteMark(rec, at, withId) { const o = { ...rec, _deleted: true, _deletedAt: at }; if (withId) o._deletedWith = withId; return o; }
// Что восстановить: сама запись и то, что ушло в корзину вместе с ней. Возвращает [[хранилище, запись без отметок удаления], …]
function restoreSet(store, id, raw) {
  const clean = r => { const o = { ...r }; delete o._deleted; delete o._deletedAt; delete o._deletedWith; return o; };
  const rec = (raw[store] || []).find(r => r && r.id === id && r._deleted); if (!rec) return [];
  const out = [[store, clean(rec)]];
  if (store === 'cases') for (const st of DELETE_LINKED) for (const r of (raw[st] || [])) if (r && r._deleted && r._deletedWith === id) out.push([st, clean(r)]);
  return out;
}

// ▼▼▼ screens/today.js
// ═══ screens/today.js — экран «Сегодня» (этап 1б) ═══
// Образец — «Практика» 1.1: четыре показателя, «Сначала важное», ближайшее заседание тёмной карточкой, расписание дня,
// «Далее по плану». Данные и правила — наши (v310): статусы «Назначено»/«Проведено», сроки дела (deadlines) с признаком
// автоматического расчёта (autoKey) и подтверждения (confirmedAt), задачи (due), встречи, финансы.
// todayModel — чистая функция: данные и «сейчас» приходят параметрами, поэтому её проверяют тесты (урок 8).
// Всё, что экран показывает сам, пользователь может убрать (раздел 7): строку — «×» (на 7 дней), блок — «Свернуть» (до завтра),
// «Сначала важное» — «Скрыть все»; просроченное — действие «Выполнено».

const TODAY_HIDE_KEY = 'crm_today_hide';   // скрытые строки: ключ → дата скрытия; через 7 дней строка возвращается
const TODAY_FOLD_KEY = 'crm_today_fold';   // свёрнутые блоки: имя → дата; на следующий день блок снова развёрнут
const TODAY_IMPORTANT_MAX = 8, TODAY_NEXT_DAYS = 14, TODAY_NEXT_MAX = 6;

function todayDayDiff(iso, todayIso) { // разница календарных дней, без часовых поясов
  const p = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
  const a = p(iso), b = p(todayIso); return a === null || b === null ? null : Math.round((a - b) / 864e5);
}
function todayDayLabel(iso, todayIso) {
  const k = todayDayDiff(iso, todayIso);
  if (k === 0) return 'Сегодня'; if (k === 1) return 'Завтра'; if (k === -1) return 'Вчера';
  const d = parseLocalDate(iso); return d && !isNaN(d) ? d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }) : '—';
}
function todayMinutes(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function todayHiddenLoad(todayIso) {
  const h = lsJSON(TODAY_HIDE_KEY, {}); const out = {};
  if (h && typeof h === 'object') for (const k of Object.keys(h)) { const age = todayDayDiff(todayIso, h[k]); if (age !== null && age >= 0 && age < 7) out[k] = h[k]; }
  return out;
}

// d = { cases, hearings, tasks, meetings, finance }; now — Date; hidden — { ключ: дата } скрытых строк.
function todayModel(d, now, hidden) {
  hidden = hidden || {};
  const today = localISO(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const cases = d.cases || [], hearings = d.hearings || [], tasks = d.tasks || [], meetings = d.meetings || [], finance = d.finance || [];
  const activeCase = c => c && !c.archived && c.status !== 'Завершено';
  // v312: «Дата прошла» — дата заседания прошла, результат не записан; такое заседание не запланировано и ждёт результата
  const planned = h => h && h.status !== 'Проведено' && h.status !== 'Отменено' && h.status !== 'Дата прошла';
  const noResult = h => h && (h.status === 'Дата прошла' || (planned(h) && h.date && todayDayDiff(h.date, today) < 0));
  const byNum = {}, byId = {}; cases.forEach(c => { if (c.number) byNum[c.number] = c; byId[c.id] = c; });
  const caseOf = x => (x.caseId && byId[x.caseId]) || (x.caseNum && byNum[x.caseNum]) || null;
  const caseTitle = (c, num) => [c ? c.number : num, c ? c.client : ''].filter(Boolean).join(' · ');
  const ago = k => (-k) + ' ' + plural(-k, 'день', 'дня', 'дней');

  // «Сначала важное»: pr 0 — просрочено (с действием «Выполнено»), 1 — требует проверки, 2 — сегодня/завтра
  const imp = [];
  cases.filter(activeCase).forEach(c => (c.deadlines || []).forEach(dl => {
    if (!dl || dl.done || !dl.date) return; const k = todayDayDiff(dl.date, today); if (k === null) return;
    const key = 'd:' + c.id + ':' + (dl.id || dl.title), base = { key, kind: 'deadline', date: dl.date, title: dl.title || 'Срок', sub: caseTitle(c), caseId: c.id, dlId: dl.id || '', dlTitle: dl.title || '' };
    const unconfirmed = !dl.confirmedAt && !!dl.autoKey;
    if (k < 0) imp.push({ ...base, pr: 0, when: 'Просрочен ' + ago(k), overdue: true, done: true, badges: unconfirmed ? [['Срок не подтверждён', 'warn']] : [] });
    else if (k <= 2 && unconfirmed) imp.push({ ...base, pr: 1, when: todayDayLabel(dl.date, today), badges: [['Срок требует проверки', 'warn']] });
    else if (k <= 1) imp.push({ ...base, pr: 2, when: todayDayLabel(dl.date, today), badges: [['Процессуальный срок', 'accent']] });
  }));
  tasks.forEach(t => {
    if (!t || t.done || !t.due) return; const k = todayDayDiff(t.due, today); if (k === null || k > 0) return;
    const c = caseOf(t);
    imp.push({ key: 't:' + t.id, kind: 'task', pr: k < 0 ? 0 : 2, date: t.due, title: t.title || 'Задача', sub: caseTitle(c, t.caseNum) || 'Без дела',
      when: k < 0 ? 'Просрочена ' + ago(k) : 'Сегодня', overdue: k < 0, done: true, taskId: t.id, badges: [] });
  });
  const pastOpen = hearings.filter(h => noResult(h) && h.date).sort((a, b) => b.date.localeCompare(a.date));
  if (pastOpen.length) { const h = pastOpen[0], c = caseOf(h);
    imp.push({ key: 'h:' + h.id, kind: 'hearing', pr: 1, date: h.date, hearingId: h.id, after: true, title: 'Результат заседания не указан' + (pastOpen.length > 1 ? ' (ещё ' + (pastOpen.length - 1) + ')' : ''),
      sub: fmtDate(h.date) + (h.time ? ' ' + h.time : '') + ' · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), when: todayDayLabel(h.date, today), badges: [[h.status === 'Дата прошла' ? 'Дата прошла — результат не указан' : 'Статус «Назначено», дата прошла', 'warn']] }); }
  const pastCount = pastOpen.length;
  imp.sort((a, b) => a.pr - b.pr || String(a.date).localeCompare(String(b.date)) || String(a.title).localeCompare(String(b.title), 'ru'));
  const important = imp.filter(x => !hidden[x.key]);

  // Ближайшее заседание: идущее не прячем 30 минут после начала
  const upcoming = hearings.filter(h => planned(h) && h.date && todayDayDiff(h.date, today) >= 0)
    .sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  const nh = upcoming.find(h => h.date > today || todayMinutes(h.time) === null || todayMinutes(h.time) + 30 >= nowMin) || null;
  let hero = null;
  if (nh && !hidden['hero:' + nh.id]) { const c = caseOf(nh);
    hero = { key: 'hero:' + nh.id, id: nh.id, when: todayDayLabel(nh.date, today), date: nh.date, time: nh.time || '', title: caseTitle(c, nh.caseNum) || 'Дело не указано',
      place: [nh.court || (c && c.court), nh.room ? 'зал ' + nh.room : '', nh.judge ? 'судья ' + nh.judge : ''].filter(Boolean).join(' · '), subject: (c && (c.subject || c.category)) || '' }; }

  // Расписание дня: заседания (кроме отменённых) и встречи сегодня — по времени
  const schedule = [
    ...hearings.filter(h => h && h.date && todayDayDiff(h.date, today) === 0 && h.status !== 'Отменено').map(h => { const c = caseOf(h);
      return { key: 'sh:' + h.id, id: h.id, type: 'hearing', time: h.time || '', title: 'Заседание · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), sub: [h.court || (c && c.court), h.room ? 'зал ' + h.room : ''].filter(Boolean).join(' · '), status: h.status || 'Назначено' }; }),
    ...meetings.filter(m => m && m.date && todayDayDiff(m.date, today) === 0).map(m => ({ key: 'sm:' + m.id, id: m.id, type: 'meeting', time: m.time || '', title: 'Встреча · ' + (m.with || 'без участника'), sub: [m.place, m.caseNum].filter(Boolean).join(' · '), status: '' })),
  ].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

  // Далее по плану: следующие 14 дней
  const later = [];
  const inWin = iso => { const k = todayDayDiff(iso, today); return k !== null && k >= 1 && k <= TODAY_NEXT_DAYS; };
  hearings.forEach(h => { if (planned(h) && inWin(h.date)) { const c = caseOf(h); later.push({ id: h.id, type: 'hearing', date: h.date, time: h.time || '', title: 'Заседание · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), sub: h.court || (c && c.court) || '' }); } });
  meetings.forEach(m => { if (m && inWin(m.date)) later.push({ id: m.id, type: 'meeting', date: m.date, time: m.time || '', title: 'Встреча · ' + (m.with || 'без участника'), sub: m.place || '' }); });
  tasks.forEach(t => { if (t && !t.done && inWin(t.due)) later.push({ id: t.id, type: 'task', date: t.due, time: '', title: t.title || 'Задача', sub: caseTitle(caseOf(t), t.caseNum) }); });
  cases.filter(activeCase).forEach(c => (c.deadlines || []).forEach(dl => { if (dl && !dl.done && inWin(dl.date)) later.push({ id: c.id, type: 'deadline', date: dl.date, time: '', title: 'Срок · ' + (dl.title || 'срок'), sub: caseTitle(c) }); }));
  later.sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  const nextItems = later.slice(0, TODAY_NEXT_MAX).map(x => ({ ...x, when: todayDayLabel(x.date, today) }));

  // Показатели
  const paidOf = f => Array.isArray(f.payments) && f.payments.length ? f.payments.reduce((a, p) => a + Number(p.sum || 0), 0) : Number(f.paid || 0);
  const debt = Math.round(finance.reduce((a, f) => a + (!f || f.pending ? 0 : Math.max(0, Number(f.amount || 0) - paidOf(f))), 0) * 100) / 100;
  const stats = {
    casesActive: cases.filter(activeCase).length,
    todayEvents: schedule.length,
    attention: important.length,
    overdue: important.filter(x => x.overdue).length,
    debt,
  };
  return { today, stats, important, hiddenCount: imp.length - important.length, hero, schedule, next: nextItems, nextTotal: later.length, pastCount, empty: !cases.length && !hearings.length && !tasks.length };
}

  const impRows = m.important.slice(0, TODAY_IMPORTANT_MAX).map(x => `<div class="imp-row">

  const hero = m.hero ? `<section class="upcoming-hero t-hero" aria-label="Ближайшее заседание"><div class="split"><small>${esc(m.hero.when)} · ближайшее заседание</small>${iconBtn('Скрыть карточку заседания на 7 дней', `todayHide('${jsq(m.hero.key)}')`, 'x')}</div>
      <div class="hero-time">${esc(m.hero.time || 'Время не указано')}</div><h2>${esc(m.hero.title)}</h2>${m.hero.subject ? `<p>${esc(m.hero.subject)}</p>` : ''}${m.hero.place ? `<p>${esc(m.hero.place)}</p>` : ''}${m.hero.when !== 'Сегодня' && m.hero.when !== 'Завтра' ? `<p>${esc(fmtDate(m.hero.date))}</p>` : ''}</section>` : '';
  out += `<div class="day-grid"><div class="stack">${reviewBox}${important}${next}</div><div class="stack">${hero}${schedule}</div></div>`;

// ── действия ──
function todayOpen(type, id) {
  if (!id) return;
  if (type === 'hearing') openHearingForm(id); else if (type === 'meeting') openMeetingForm(id); else if (type === 'task') openTaskForm(id); else if (type === 'deadline') openCaseSheet(id);
}
async function todayDone(key) {
  const x = TODAY_LAST && TODAY_LAST.important.find(i => i.key === key); if (!x || !x.done) return;
  try {
    if (x.kind === 'deadline') { // как «Выполнено» на обзоре v307: отметка в самом сроке дела
      const c = await getOne('cases', x.caseId); if (!c) { toast('Дело не найдено', true); return; }
      const dl = (c.deadlines || []).find(v => (x.dlId && v.id === x.dlId) || (!x.dlId && v.title === x.dlTitle)); if (!dl) { toast('Срок не найден', true); return; }
      dl.done = true; dl.doneAt = todayISO(); await put('cases', c); toast('Срок отмечен выполненным');
    } else if (x.kind === 'task') {
      const t = await getOne('tasks', x.taskId); if (!t) { toast('Задача не найдена', true); return; }
      t.done = true; t.doneAt = todayISO(); await put('tasks', t); toast('Задача выполнена');
    }
  } catch (e) { logErr('today:done', e); toast('Не удалось сохранить отметку — подробности в журнале ошибок', true); return; }
  nav('today');
}
// v312 (pastNoResultDismissAll): всем прошедшим заседаниям со статусом «Дата прошла» или «Назначено» — «Проведено» без результата
async function todayHearingsAllDone() {
  const today = todayISO(); let n = 0;
  try { for (const h of await getAll('hearings')) if (h.date && h.date < today && (h.status === 'Дата прошла' || h.status === 'Назначено' || !h.status)) { h.status = 'Проведено'; delete h.autoDone; h.afterAt = Date.now(); await put('hearings', h); n++; } }
  catch (e) { logErr('today:allDone', e); toast('Не удалось сохранить — подробности в журнале ошибок', true); return; }
  localStorage.setItem('crm_pastnoresult_seen', today);
  toast(n ? 'Заседаний отмечено проведёнными: ' + n : 'Прошедших заседаний без результата нет'); nav('today');
}
function todayScrollTo(sel) { const el = document.querySelector('#main ' + sel); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
function todayHide(key) { const h = todayHiddenLoad(todayISO()); h[key] = todayISO(); localStorage.setItem(TODAY_HIDE_KEY, JSON.stringify(h)); toast('Скрыто на 7 дней'); nav('today'); }
function todayHideAll() { if (!TODAY_LAST) return; const h = todayHiddenLoad(todayISO()); TODAY_LAST.important.forEach(x => { h[x.key] = todayISO(); }); localStorage.setItem(TODAY_HIDE_KEY, JSON.stringify(h)); toast('Отмечено разобранным на 7 дней'); nav('today'); }
function todayUnhideAll() { localStorage.removeItem(TODAY_HIDE_KEY); nav('today'); }
function todayFold(block, on) { const f = lsJSON(TODAY_FOLD_KEY, {}) || {}; if (on) f[block] = todayISO(); else delete f[block]; localStorage.setItem(TODAY_FOLD_KEY, JSON.stringify(f)); nav('today'); }

// ▼▼▼ screens/cases.js
// ═══ screens/cases.js — раздел «Дела» (этап 1в, только чтение) ═══
// Список (все экраны), таблица и доска по стадиям (от 1024 px), карточка дела для чтения — лист на телефоне,
// панель справа от 1200 px. Данные и стадии — наши (v310: CASE_STAGES, статусы «Новое / В работе / Ожидание / Завершено»).
// Правка, перевод стадии, новое дело — этап 2; здесь об этом сказано прямо, кнопок «в никуда» нет.
// casesModel и caseCardModel — чистые функции: данные и «сейчас» приходят параметрами, их проверяет next_1v.js.

const CASES_VIEW_KEY = 'crm_cases_view';   // { view: list|table|board, status: all|active|waiting|new|done|archive }
const CASE_STAGES_NEXT = ['Досудебная', 'Первая инстанция', 'Апелляция', 'Кассация', 'Надзор', 'Исполнение', 'Завершено']; // = CASE_STAGES v310
const CASE_FILTERS = [['active', 'В работе'], ['new', 'Новые'], ['waiting', 'Ожидание'], ['done', 'Завершённые'], ['all', 'Все'], ['archive', 'Архив']];

function casesNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').trim(); }
// Фильтр, поиск и порядок. Порядок: сначала просроченное действие, потом по дате действия, потом без даты — по номеру.
function casesModel(cases, opts, now) {
  const today = localISO(now), q = casesNorm(opts.q), f = opts.status || 'active';
  const pass = c => {
    if (!c || c._deleted) return false;
    if (f === 'archive') return !!c.archived;
    if (c.archived) return false;
    if (f === 'all') return true;
    if (f === 'done') return c.status === 'Завершено';
    if (f === 'new') return c.status === 'Новое';
    if (f === 'waiting') return c.status === 'Ожидание';
    return c.status !== 'Завершено'; // active: всё, что не завершено (включая новые и ожидание)
  };
  const hit = c => !q || [c.number, c.client, c.subject, c.court, c.courtNo, c.opponent, c.judge, c.category].some(v => casesNorm(v).includes(q));
  const due = c => c.nextActionDue || '';
  const rows = cases.filter(c => pass(c) && hit(c)).map(c => {
    const k = due(c) ? todayDayDiff(due(c), today) : null;
    const dl = (c.deadlines || []).filter(d => d && !d.done && d.date).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
    return { c, overdue: k !== null && k < 0 && c.status !== 'Завершено', dueLabel: k === null ? '' : (k < 0 ? 'Просрочено ' + (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') : todayDayLabel(due(c), today)),
      nextDeadline: dl ? { title: dl.title || 'Срок', date: dl.date, overdue: todayDayDiff(dl.date, today) < 0, unconfirmed: !!dl.autoKey && !dl.confirmedAt } : null };
  });
  rows.sort((a, b) => (b.overdue - a.overdue) || ((due(a.c) || '9999') .localeCompare(due(b.c) || '9999')) || String(a.c.number || '').localeCompare(String(b.c.number || ''), 'ru', { numeric: true }));
  const colOf = c => c.status === 'Завершено' ? 'Завершено' : (CASE_STAGES_NEXT.includes(c.stage) ? c.stage : '__none');
  const board = [['__none', 'Без стадии'], ...CASE_STAGES_NEXT.map(s => [s, s])].map(([key, title]) => ({ key, title, rows: rows.filter(r => colOf(r.c) === key) })).filter(col => col.rows.length || (col.key !== '__none' && col.key !== 'Завершено')); // пустые «Без стадии» и «Завершено» не занимают место
  const counts = {}; CASE_FILTERS.forEach(([k]) => { counts[k] = cases.filter(c => c && !c._deleted && (k === 'archive' ? c.archived : !c.archived) && (k === 'archive' || k === 'all' || k === 'done' && c.status === 'Завершено' || k === 'new' && c.status === 'Новое' || k === 'waiting' && c.status === 'Ожидание' || k === 'active' && c.status !== 'Завершено')).length; });
  return { rows, board, counts, total: cases.filter(c => c && !c._deleted).length };
}

// Карточка: дело + связанные записи (заседания, задачи, финансы, документы) по номеру или id дела.
function caseCardModel(c, d, now) {
  const today = localISO(now);
  const mine = x => x && (x.caseId ? x.caseId === c.id : x.caseNum === c.number);
  const hearings = (d.hearings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || ''));
  const tasks = (d.tasks || []).filter(mine).sort((a, b) => (!!a.done - !!b.done) || (a.due || '9999').localeCompare(b.due || '9999'));
  // отправления по делу (этап 3): свежие сверху
  const mail = (d.mail || []).filter(x => mine(x) && !x._deleted).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const meetings = (d.meetings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || '')); // этап 2б
  const finance = (d.finance || []).filter(mine);
  const paidOf = f => Array.isArray(f.payments) && f.payments.length ? f.payments.reduce((a, p) => a + Number(p.sum || 0), 0) : Number(f.paid || 0);
  const fin = finance.reduce((a, f) => { if (f.pending) a.pending += Number(f.amount || 0); else { a.amount += Number(f.amount || 0); a.paid += paidOf(f); } return a; }, { amount: 0, paid: 0, pending: 0 });
  fin.debt = Math.max(0, Math.round((fin.amount - fin.paid) * 100) / 100);
  const deadlines = (c.deadlines || []).map((x, i) => [x, i]).filter(([x]) => x && x.date).map(([x, i]) => { const k = todayDayDiff(x.date, today); return { ...x, key: x.id || 'i:' + i, state: x.done ? 'done' : (k < 0 ? 'overdue' : 'open'), unconfirmed: !x.done && !!x.autoKey && !x.confirmedAt, when: k === null ? '' : (k < 0 ? (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') + ' назад' : todayDayLabel(x.date, today)) }; })
    .sort((a, b) => (a.state === 'done') - (b.state === 'done') || a.date.localeCompare(b.date));
  const docs = (d.documents || []).filter(mine).length;
  const nextK = c.nextActionDue ? todayDayDiff(c.nextActionDue, today) : null;
  return { c, hearings, tasks, meetings, fin, deadlines, docs, mail, participants: Array.isArray(c.participants) ? c.participants : [],
    nextOverdue: nextK !== null && nextK < 0 && c.status !== 'Завершено', nextWhen: nextK === null ? '' : todayDayLabel(c.nextActionDue, today),
    stageIdx: CASE_STAGES_NEXT.indexOf(c.status === 'Завершено' ? 'Завершено' : c.stage) };
}

// ▼▼▼ screens/calendar.js
// ═══ screens/calendar.js — экран «Календарь» (этап 2б) ═══
// Образец — «Практика» 1.1: сетка месяца с повесткой выбранного дня; наши виды — как в v310: месяц, неделя, список
// (ключ настройки тот же, crm_calview). События: заседания (все статусы, отменённые приглушены), встречи, задачи со сроком,
// процессуальные сроки дел. Строка открывает свою запись (todayOpen). calendarModel — чистая функция, её проверяет next_2b.js.

const CAL_VIEW_KEY = 'crm_calview';
const CAL_VIEWS = [['month', 'Месяц', 'calendar-days'], ['week', 'Неделя', 'calendar-range'], ['list', 'Список', 'list']];
function calAddDays(iso, n) { const d = parseLocalDate(iso); d.setDate(d.getDate() + n); return localISO(d); }
function calMonday(iso) { const d = parseLocalDate(iso); return calAddDays(iso, -((d.getDay() + 6) % 7)); }
// Все события за период [from, to] (даты ISO включительно), по дням; внутри дня — по времени, без времени — в конец
function calEvents(d, from, to) {
  const cases = d.cases || [], byNum = {}, byId = {}; cases.forEach(c => { if (c.number) byNum[c.number] = c; byId[c.id] = c; });
  const caseOf = x => (x.caseId && byId[x.caseId]) || (x.caseNum && byNum[x.caseNum]) || null;
  const title = (c, num) => [c ? c.number : num, c ? c.client : ''].filter(Boolean).join(' · ');
  const inR = iso => iso && iso >= from && iso <= to, out = [];
  (d.hearings || []).forEach(h => { if (!h || !inR(h.date)) return; const c = caseOf(h);
    out.push({ date: h.date, time: h.time || '', type: 'hearing', id: h.id, title: 'Заседание · ' + (title(c, h.caseNum) || 'дело не указано'), sub: [h.court || (c && c.court), h.room ? 'зал ' + h.room : ''].filter(Boolean).join(' · '), status: h.status || 'Назначено', muted: h.status === 'Отменено' || h.status === 'Проведено' }); });
  (d.meetings || []).forEach(m => { if (m && inR(m.date)) out.push({ date: m.date, time: m.time || '', type: 'meeting', id: m.id, title: 'Встреча · ' + (m.with || 'без участника'), sub: [m.place, m.caseNum].filter(Boolean).join(' · '), status: '' }); });
  (d.tasks || []).forEach(t => { if (t && !t.done && inR(t.due)) out.push({ date: t.due, time: t.time || '', type: 'task', id: t.id, title: t.title || 'Задача', sub: title(caseOf(t), t.caseNum), status: '' }); });
  cases.filter(c => c && !c.archived && c.status !== 'Завершено').forEach(c => (c.deadlines || []).forEach(dl => { if (dl && !dl.done && inR(dl.date)) out.push({ date: dl.date, time: '', type: 'deadline', id: c.id, title: 'Срок · ' + (dl.title || 'срок'), sub: title(c), status: '' }); }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99') || a.title.localeCompare(b.title, 'ru'));
}
// opts: { view, month: 'YYYY-MM', week: смещение недель от текущей, day: выбранный день (месяц), past: показывать прошедшие (список) }
function calendarModel(d, opts, now) {
  const today = localISO(now), view = ['month', 'week', 'list'].includes(opts.view) ? opts.view : 'month';
  const m = { today, view };
  if (view === 'month') {
    const ym = /^\d{4}-\d{2}$/.test(opts.month || '') ? opts.month : today.slice(0, 7), first = ym + '-01', start = calMonday(first);
    const evs = calEvents(d, start, calAddDays(start, 41)), by = {}; evs.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    const day = opts.day && opts.day.slice(0, 7) === ym ? opts.day : (today.slice(0, 7) === ym ? today : first);

// ═══ next/boot.js — запуск новой версии ═══
// 1) изоляция от прежней версии проверена — иначе останавливаемся, ничего не трогая;
// 2) каркас рисуется сразу (тема применена ещё при загрузке ui/shell.js); 3) слой данных на СВОЕЙ базе; 4) экран «Сегодня».
// window.NEXT_READY — отчёт для живой проверки (next_check.py): база, число записей, версия правил сроков.
const NEXT_BOOT = {
  say(msg, warn) { // остановка до запуска интерфейса — отдельный экран с причиной; обычные сообщения — через toast
    if (!warn) { toast(msg); return; }
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="stop-screen panel pad"><h2>Новая версия остановлена</h2><p class="muted" style="margin-top:10px">${esc(msg)}</p></div>`;
  },
  async report() {
    const counts = {}; for (const st of STORES) counts[st] = (await getAllRaw(st)).length;
    return { версия: APP_VER, сборка: BUILD_ID, изоляция: NEXT_NS.ok, база: db && db.name, версияБазы: db && db.version, правилаСроков: RULES_VER, секреты: _sec.ok, записей: counts };
  },
  async start() {
    if (!NEXT_NS.ok) { this.say('Изоляция от прежней версии не сработала (' + NEXT_NS.why + ') — программа остановлена, данные не тронуты.', true); return; }
    shellRender(); nav('today');
    try { await dataInit(); } catch (e) { logErr('next:init', e); this.say('Сбой запуска слоя данных: ' + ((e && e.message) || e), true); return; }
    try { await refreshCasesCache(); } catch (e) { logErr('next:cases-cache', e); }
    // v312: прошедшим заседаниям без результата — статус «Дата прошла» (data/hearings.js, как при запуске прежней программы)
    try { await hearingsAutoDone(); } catch (e) { logErr('next:hearings-auto', e); }
    syncStatusRender(); // этап 1г: состояние синхронизации в шапке — после запуска слоя данных (секреты уже прочитаны)
    UI.ready = true; await nav('today');
    window.NEXT_READY = await this.report();
  },
};
document.addEventListener('DOMContentLoaded', () => { NEXT_BOOT.start(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) { // https или локальная проверка
  // своя область /next/ (sw.js лежит рядом с index.html в папке next) — прежний sw.js в корне сюда не относится
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => logErr('next:sw', e)); });
}

</script>
</body>
</html>
