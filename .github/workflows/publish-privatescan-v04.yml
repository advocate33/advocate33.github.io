name: Publish PrivateScan v0.4 APK
on:
  push:
    branches: [privatescan-v04-scan-a4-oauth-20261030]
    paths:
      - '.github/workflows/publish-privatescan-v04.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PrivateScan-debug-apk
          run-id: 41123027685
          github-token: ${{ github.token }}
          path: ./release
      - name: Verify binary package
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          unzip -tq release/app-debug.apk
          mv release/app-debug.apk release/PrivateScan-v0.4-test.apk
          sha256sum release/PrivateScan-v0.4-test.apk > release/SHA256SUMS.txt
      - name: Publish test APK via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "privatescan-v0.4-test" \
            release/PrivateScan-v0.4-test.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrivateScan 0.4 — auto scan, A4, ChatGPT diagnostics (TEST)" \
            --prerelease \
            --notes "Тестовая версия для Android 10+. Создание отдельного PDF A4 после сканирования; многостраничный автозахват Google ML Kit зависит от реализации камеры на устройстве; мягкая цветокоррекция, исходник не меняется. Диагностика этапов авторизации ChatGPT/OAuth. Привязка ChatGPT на реальном Samsung пока НЕ ПРОВЕРЕНА. Сначала используйте безличные тестовые документы. Файл подписан непостоянным debug-ключом."
