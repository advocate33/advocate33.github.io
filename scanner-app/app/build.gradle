plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.family.privatescan'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.family.privatescan.v05'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '0.5.0'
    }
    signingConfigs {
        stable {
            if (System.getenv('PRIVATESCAN_SIGNING_STORE') != null) {
                storeFile file(System.getenv('PRIVATESCAN_SIGNING_STORE'))
                storePassword System.getenv('PRIVATESCAN_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('PRIVATESCAN_SIGNING_ALIAS')
                keyPassword System.getenv('PRIVATESCAN_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Never put private keys in the public repository.
            if (System.getenv('PRIVATESCAN_SIGNING_STORE') != null) {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
