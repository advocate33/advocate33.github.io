  if (pastOpen.length) { const h = pastOpen[0], c = caseOf(h);
    imp.push({ key: 'h:' + h.id, kind: 'hearing', pr: 1, date: h.date, hearingId: h.id, after: true, title: 'Результат заседания не указан' + (pastOpen.length > 1 ? ' (ещё ' + (pastOpen.length - 1) + ')' : ''),
      sub: fmtDate(h.date) + (h.time ? ' ' + h.time : '') + ' · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), when: todayDayLabel(h.date, today), badges: [[h.status === 'Дата прошла' ? 'Дата прошла — результат не указан' : 'Статус «Назначено», дата прошла', 'warn']] }); }
  const pastCount = pastOpen.length;
  imp.sort((a, b) => a.pr - b.pr || String(a.date).localeCompare(String(b.date)) || String(a.title).localeCompare(String(b.title), 'ru'));
  const important = imp.filter(x => !hidden[x.key]);

  const upcoming = hearings.filter(h => planned(h) && h.date && todayDayDiff(h.date, today) >= 0)

      place: [nh.court || (c && c.court), nh.room ? 'зал ' + nh.room : '', nh.judge ? 'судья ' + nh.judge : ''].filter(Boolean).join(' · '), subject: (c && (c.subject || c.category)) || '', prep: nh.prep || '', prepDone: !!nh.prepDone, participation: nh.participation || '' }; }

  ].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

  const inWin = iso => { const k = todayDayDiff(iso, today); return k !== null && k >= 1 && k <= TODAY_NEXT_DAYS; };
  // замечание пользователя 03.10.2026 (снимок планшета): судья нужен и в «Далее по плану», не только в плане дня
  hearings.forEach(h => { if (planned(h) && inWin(h.date)) { const c = caseOf(h); later.push({ id: h.id, type: 'hearing', date: h.date, time: h.time || '', title: 'Заседание · ' + (caseTitle(c, h.caseNum) || 'дело не указано'), client: (c && c.client) || '', number: (c && c.number) || h.caseNum || '', judge: todayJudgeOf(h, c), subject: (c && (c.subject || c.category)) || '', sub: [h.court || (c && c.court), h.room ? 'зал ' + h.room : ''].filter(Boolean).join(' · ') }); } });

}

  // на телефоне порядок блоков задаёт tokens.css: важное → ближайшее заседание → план дня → события судов → далее → в работе
  out += `<div class="day-grid"><div class="stack">${important}${reviewBox}${monBox}${next}${workBox}</div><div class="stack">${hero}${schedule}${tomorrow}</div></div>`;
  return out;
};

// ▼▼▼ screens/cases.js
// ═══ screens/cases.js — раздел «Дела» (этап 1в, только чтение) ═══
// Список (все экраны), таблица и доска по стадиям (от 1024 px), карточка дела для чтения — лист на телефоне,
// панель справа от 1200 px. Данные и стадии — наши (v310: CASE_STAGES, статусы «Новое / В работе / Ожидание / Завершено»).
// Правка, перевод стадии, новое дело — этап 2; здесь об этом сказано прямо, кнопок «в никуда» нет.
// casesModel и caseCardModel — чистые функции: данные и «сейчас» приходят параметрами, их проверяет next_1v.js.

const CASES_VIEW_KEY = 'crm_cases_view';   // { view: list|table|board, status: all|active|waiting|new|done|archive }
const CASE_STAGES_NEXT = ['Досудебная', 'Первая инстанция', 'Апелляция', 'Кассация', 'Надзор', 'Исполнение', 'Завершено']; // = CASE_STAGES v310
const CASE_FILTERS = [['active', 'В работе'], ['new', 'Новые'], ['waiting', 'Ожидание'], ['done', 'Завершённые'], ['all', 'Все'], ['archive', 'Архив']];

function casesNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').trim(); }
// Фильтр, поиск и порядок. Порядок: сначала просроченное действие, потом по дате действия, потом без даты — по номеру.
function casesModel(cases, opts, now) {
  const today = localISO(now), q = casesNorm(opts.q), f = opts.status || 'active';
  const pass = c => {
    if (!c || c._deleted) return false;
    if (f === 'archive') return !!c.archived;
    if (c.archived) return false;
    if (f === 'all') return true;
    if (f === 'done') return c.status === 'Завершено';
    if (f === 'new') return c.status === 'Новое';
    if (f === 'waiting') return c.status === 'Ожидание';
    return c.status !== 'Завершено'; // active: всё, что не завершено (включая новые и ожидание)
  };
  const hit = c => !q || [c.number, c.client, c.subject, c.court, c.courtNo, c.opponent, c.judge, c.category].some(v => casesNorm(v).includes(q));
  const due = c => c.nextActionDue || '';
  const rows = cases.filter(c => pass(c) && hit(c)).map(c => {
    const k = due(c) ? todayDayDiff(due(c), today) : null;
    const dl = (c.deadlines || []).filter(d => d && !d.done && d.date).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
    return { c, overdue: k !== null && k < 0 && c.status !== 'Завершено', dueLabel: k === null ? '' : (k < 0 ? 'Просрочено ' + (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') : todayDayLabel(due(c), today)),
      nextDeadline: dl ? { title: dl.title || 'Срок', date: dl.date, overdue: todayDayDiff(dl.date, today) < 0, unconfirmed: !!dl.autoKey && !dl.confirmedAt } : null };
  });
  rows.sort((a, b) => (b.overdue - a.overdue) || ((due(a.c) || '9999') .localeCompare(due(b.c) || '9999')) || String(a.c.number || '').localeCompare(String(b.c.number || ''), 'ru', { numeric: true }));
  const colOf = c => c.status === 'Завершено' ? 'Завершено' : (CASE_STAGES_NEXT.includes(c.stage) ? c.stage : '__none');
  const board = [['__none', 'Без стадии'], ...CASE_STAGES_NEXT.map(s => [s, s])].map(([key, title]) => ({ key, title, rows: rows.filter(r => colOf(r.c) === key) })).filter(col => col.rows.length || (col.key !== '__none' && col.key !== 'Завершено')); // пустые «Без стадии» и «Завершено» не занимают место
  const counts = {}; CASE_FILTERS.forEach(([k]) => { counts[k] = cases.filter(c => c && !c._deleted && (k === 'archive' ? c.archived : !c.archived) && (k === 'archive' || k === 'all' || k === 'done' && c.status === 'Завершено' || k === 'new' && c.status === 'Новое' || k === 'waiting' && c.status === 'Ожидание' || k === 'active' && c.status !== 'Завершено')).length; });
  return { rows, board, counts, total: cases.filter(c => c && !c._deleted).length };
}

// Карточка: дело + связанные записи (заседания, задачи, финансы, документы) по номеру или id дела.
function caseCardModel(c, d, now) {
  const today = localISO(now);
  const mine = x => x && (x.caseId ? x.caseId === c.id : x.caseNum === c.number);
  const hearings = (d.hearings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || ''));
  const tasks = (d.tasks || []).filter(mine).sort((a, b) => (!!a.done - !!b.done) || (a.due || '9999').localeCompare(b.due || '9999'));
  // отправления по делу (этап 3): свежие сверху
  const mail = (d.mail || []).filter(x => mine(x) && !x._deleted).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const meetings = (d.meetings || []).filter(mine).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || '')); // этап 2б
  const finance = (d.finance || []).filter(mine);
  const paidOf = f => Array.isArray(f.payments) && f.payments.length ? f.payments.reduce((a, p) => a + Number(p.sum || 0), 0) : Number(f.paid || 0);
  const fin = finance.reduce((a, f) => { if (f.pending) a.pending += Number(f.amount || 0); else { a.amount += Number(f.amount || 0); a.paid += paidOf(f); } return a; }, { amount: 0, paid: 0, pending: 0 });
  fin.debt = Math.max(0, Math.round((fin.amount - fin.paid) * 100) / 100);
  const deadlines = (c.deadlines || []).map((x, i) => [x, i]).filter(([x]) => x && x.date).map(([x, i]) => { const k = todayDayDiff(x.date, today); return { ...x, key: x.id || 'i:' + i, state: x.done ? 'done' : (k < 0 ? 'overdue' : 'open'), unconfirmed: !x.done && !!x.autoKey && !x.confirmedAt, when: k === null ? '' : (k < 0 ? (-k) + ' ' + plural(-k, 'день', 'дня', 'дней') + ' назад' : todayDayLabel(x.date, today)) }; })
    .sort((a, b) => (a.state === 'done') - (b.state === 'done') || a.date.localeCompare(b.date));
  const docs = (d.documents || []).filter(mine).length;
  const nextK = c.nextActionDue ? todayDayDiff(c.nextActionDue, today) : null;
  const expenses = (d.expenses || []).filter(mine).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  return { c, hearings, tasks, meetings, fin, deadlines, docs, mail, bills: finance.filter(f => !f._deleted).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))), expenses, participants: Array.isArray(c.participants) ? c.participants : [],
    nextOverdue: nextK !== null && nextK < 0 && c.status !== 'Завершено', nextWhen: nextK === null ? '' : todayDayLabel(c.nextActionDue, today),
    stageIdx: CASE_STAGES_NEXT.indexOf(c.status === 'Завершено' ? 'Завершено' : c.stage) };
}

  let body;
  if (!m.rows.length) body = `<section class="panel">${empty}</section>`;
  else if (p.view === 'table') body = `<section class="panel table-wrap"><table class="grid"><thead><tr><th>№</th><th>Доверитель</th><th>Предмет</th><th>Вид · стадия</th><th>Суд · № в суде</th><th>Следующее действие</th><th>Статус</th></tr></thead><tbody>${m.rows.map(r => `<tr onclick="openCaseSheet('${jsq(r.c.id)}')" tabindex="0" onkeydown="if(event.key==='Enter')openCaseSheet('${jsq(r.c.id)}')"><td class="num">${esc(r.c.number || '')}</td><td>${esc(r.c.client || '')}</td><td>${esc(r.c.subject || '')}</td><td>${esc([r.c.kind, r.c.stage].filter(Boolean).join(' · '))}</td><td>${esc([r.c.court, r.c.courtNo].filter(Boolean).join(' · '))}</td><td>${r.c.nextAction ? `<span class="task-when${r.overdue ? ' overdue' : ''}">${esc(r.dueLabel || '')}</span> ${esc(r.c.nextAction)}` : ''}</td><td>${badge(r.c.status || '', statusCls(r.c.status))}</td></tr>`).join('')}</tbody></table></section>`;

    `<div class="toolbar"><div class="chips">${chips}</div><div class="toolbar-right"><label class="search-wrap"><span class="sr">Поиск по делам</span>${icon('search')}<input type="search" value="${esc(p.q)}" placeholder="Номер, доверитель, суд" onkeydown="if(event.key==='Enter'){event.preventDefault();casesSet('q',this.value)}" onsearch="casesSet('q',this.value)"></label><div class="view-switch">${views}</div></div></div>${body}`;

// ── карточка дела (только чтение): лист на телефоне, панель справа от 1200 px ──
// Судья для карточки дела: из дела; если в деле не указан — из последнего заседания, где он записан (замечание пользователя
// 02.10.2026: «не подтянулись ФИО судьи» — в базе судья мог быть записан только в заседаниях).
function caseJudgeModel(c, hearings) {
  if (c && c.judge) return { judge: c.judge, from: '', text: c.judge };
  const hs = (hearings || []).filter(h => h && !h._deleted && h.judge && c && (h.caseId === c.id || (c.number && h.caseNum === c.number)) && (!h.stage || h.stage === 'Первая инстанция'))
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  if (!hs.length) return { judge: '', from: '', text: '' };
  const from = 'по заседанию ' + fmtDate(hs[0].date);
  return { judge: hs[0].judge, from, text: hs[0].judge + ' (' + from + ')' };
}
// Из формы заседания, задачи, встречи — сразу в карточку дела (замечание пользователя 02.10.2026). «←» возвращает в форму
// с введёнными значениями; если запись открыта из карточки этого же дела — просто возврат в неё.
// Участие в заседании: у проведённого — фактическое (attended, как в v312), у назначенного — план (participation)
function hearingPartText(h) {
  if (!h || h.status === 'Отменено') return '';
  if (h.status === 'Проведено') return h.attended === true ? (h.participation === 'По видеосвязи' ? 'участвовал по видеосвязи' : 'участвовал лично') : h.attended === false ? (h.participation === 'Ходатайство об отложении' ? 'без личного участия · ходатайство об отложении' : 'без личного участия') : (h.participation || '');
  return h.participation || '';
}

async function openCaseSheet(id, keep) {
  const c = await getOne('cases', id); if (!c) { toast('Дело не найдено', true); return; }

  const m = caseCardModel(c, d, new Date());

  const cl = (await getAll('clients')).find(x => x && (c.clientId ? x.id === c.clientId : clientKey(x.name) === clientKey(c.client))) || null;
  const row = (k, v) => v ? `<div><span class="muted">${esc(k)}</span><span>${esc(v)}</span></div>` : '';
  const jm = caseJudgeModel(c, d.hearings), hasLink = !!(c.link || c.linkApp || c.linkCass);
  const oppP = m.participants.find(p => p && (p.role === 'Ответчик' || p.role === 'Истец' || p.role === 'Противная сторона'));
  const sec = (title, html, count) => html ? `<div class="section-label">${esc(title)}${count !== undefined ? ' · ' + count : ''}</div>${html}` : '';

// ▼▼▼ screens/calendar.js
// ═══ screens/calendar.js — экран «Календарь» (этап 2б) ═══
// Образец — «Практика» 1.1: сетка месяца с повесткой выбранного дня; наши виды — как в v310: месяц, неделя, список
// (ключ настройки тот же, crm_calview). События: заседания (все статусы, отменённые приглушены), встречи, задачи со сроком,
// процессуальные сроки дел. Строка открывает свою запись (todayOpen). calendarModel — чистая функция, её проверяет next_2b.js.

const CAL_VIEW_KEY = 'crm_calview';
const CAL_VIEWS = [['month', 'Месяц', 'calendar-days'], ['week', 'Неделя', 'calendar-range'], ['list', 'Список', 'list']];
function calAddDays(iso, n) { const d = parseLocalDate(iso); d.setDate(d.getDate() + n); return localISO(d); }
function calMonday(iso) { const d = parseLocalDate(iso); return calAddDays(iso, -((d.getDay() + 6) % 7)); }
// Все события за период [from, to] (даты ISO включительно), по дням; внутри дня — по времени, без времени — в конец
function calEvents(d, from, to) {
  const cases = d.cases || [], byNum = {}, byId = {}; cases.forEach(c => { if (c.number) byNum[c.number] = c; byId[c.id] = c; });
  const caseOf = x => (x.caseId && byId[x.caseId]) || (x.caseNum && byNum[x.caseNum]) || null;
  const title = (c, num) => [c ? c.number : num, c ? c.client : ''].filter(Boolean).join(' · ');
  const inR = iso => iso && iso >= from && iso <= to, out = [];
  (d.hearings || []).forEach(h => { if (!h || !inR(h.date)) return; const c = caseOf(h);
    out.push({ date: h.date, time: h.time || '', type: 'hearing', id: h.id, title: 'Заседание · ' + (title(c, h.caseNum) || 'дело не указано'), sub: [h.court || (c && c.court), h.room ? 'зал ' + h.room : ''].filter(Boolean).join(' · '), status: h.status || 'Назначено', muted: h.status === 'Отменено' || h.status === 'Проведено' }); });
  (d.meetings || []).forEach(m => { if (m && inR(m.date)) out.push({ date: m.date, time: m.time || '', type: 'meeting', id: m.id, title: 'Встреча · ' + (m.with || 'без участника'), sub: [m.place, m.caseNum].filter(Boolean).join(' · '), status: '' }); });
  (d.tasks || []).forEach(t => { if (t && !t.done && inR(t.due)) out.push({ date: t.due, time: t.time || '', type: 'task', id: t.id, title: t.title || 'Задача', sub: title(caseOf(t), t.caseNum), status: '' }); });
  cases.filter(c => c && !c.archived && c.status !== 'Завершено').forEach(c => (c.deadlines || []).forEach(dl => { if (dl && !dl.done && inR(dl.date)) out.push({ date: dl.date, time: '', type: 'deadline', id: c.id, title: 'Срок · ' + (dl.title || 'срок'), sub: title(c), status: '' }); }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99') || a.title.localeCompare(b.title, 'ru'));
}
// opts: { view, month: 'YYYY-MM', week: смещение недель от текущей, day: выбранный день (месяц), past: показывать прошедшие (список) }
function calendarModel(d, opts, now) {
  const today = localISO(now), view = ['month', 'week', 'list'].includes(opts.view) ? opts.view : 'month';
  const m = { today, view };
  if (view === 'month') {
    const ym = /^\d{4}-\d{2}$/.test(opts.month || '') ? opts.month : today.slice(0, 7), first = ym + '-01', start = calMonday(first);
    const evs = calEvents(d, start, calAddDays(start, 41)), by = {}; evs.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    const day = opts.day && opts.day.slice(0, 7) === ym ? opts.day : (today.slice(0, 7) === ym ? today : first);
    m.month = { ym, title: parseLocalDate(first).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }), day,
      cells: Array.from({ length: 42 }, (_, i) => { const date = calAddDays(start, i); return { date, n: Number(date.slice(8)), dim: date.slice(0, 7) !== ym, today: date === today, selected: date === day, items: by[date] || [] }; }),
      dayItems: by[day] || [], total: evs.filter(e => e.date.slice(0, 7) === ym).length };
  } else if (view === 'week') {
    const monday = calAddDays(calMonday(today), 7 * (Number(opts.week) || 0)), names = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const evs = calEvents(d, monday, calAddDays(monday, 6)), by = {}; evs.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    m.week = { monday, sunday: calAddDays(monday, 6), offset: Number(opts.week) || 0, total: evs.length,
      days: Array.from({ length: 7 }, (_, i) => { const date = calAddDays(monday, i); return { date, name: names[i], today: date === today, items: by[date] || [] }; }) };
  } else {
    const evs = calEvents(d, '0000-01-01', '9999-12-31'), group = list => { const out = []; list.forEach(e => { const g = out[out.length - 1]; if (g && g.date === e.date) g.items.push(e); else out.push({ date: e.date, items: [e] }); }); return out; };
    const upcoming = evs.filter(e => e.date >= today), past = evs.filter(e => e.date < today).sort((a, b) => b.date.localeCompare(a.date) || (a.time || '99:99').localeCompare(b.time || '99:99'));
    m.list = { upcoming: group(upcoming), past: opts.past ? group(past) : [], pastTotal: past.length, upcomingTotal: upcoming.length };
  }
  return m;
}

// ── экран ──
function calPrefs() { const v = localStorage.getItem(CAL_VIEW_KEY); return { view: ['month', 'week', 'list'].includes(v) ? v : 'month', month: UI.calMonth || '', week: UI.calWeek || 0, day: UI.calDay || '', past: !!UI.calPast }; }
function calSet(k, v) {
  if (k === 'view') { localStorage.setItem(CAL_VIEW_KEY, v); bumpSettings(); }
  else if (k === 'month') { const p = calPrefs(), [y, mo] = (p.month || localISO(new Date()).slice(0, 7)).split('-').map(Number); const d = new Date(y, mo - 1 + Number(v), 1); UI.calMonth = v === 0 ? '' : localISO(d).slice(0, 7); if (v === 0) UI.calDay = ''; }
  else if (k === 'week') UI.calWeek = v === 0 ? 0 : (UI.calWeek || 0) + Number(v);
  else if (k === 'day') UI.calDay = v;
  else if (k === 'past') UI.calPast = !!v;
  nav('calendar');
}
SCREENS.calendar = async function () {
  const d = {}; for (const st of ['cases', 'hearings', 'tasks', 'meetings']) d[st] = await getAll(st);
  const p = calPrefs(), m = calendarModel(d, p, new Date());
  const views = CAL_VIEWS.map(([k, t, i]) => `<button type="button" class="button small-btn" aria-pressed="${m.view === k}" onclick="calSet('view','${k}')">${icon(i, 'icon-sm')}${esc(t)}</button>`).join('');
  const dayLabel = iso => todayDayLabel(iso, m.today) + (todayDayDiff(iso, m.today) === 0 || Math.abs(todayDayDiff(iso, m.today)) === 1 ? ' · ' + parseLocalDate(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '');
  const row = x => `<button type="button" class="agenda-row" onclick="todayOpen('${x.type}', '${jsq(x.id)}')"><span class="agenda-time">${esc(x.time || ({ task: 'задача', deadline: 'срок' }[x.type] || '—'))}</span>
    <span class="agenda-stripe ${x.type}${x.muted ? ' done' : ''}"><span class="agenda-title">${esc(x.title)}</span>${x.sub ? `<span class="agenda-sub">${esc(x.sub)}</span>` : ''}${x.status ? badge(x.status, x.status === 'Проведено' ? 'good' : x.status === 'Дата прошла' ? 'warn' : x.status === 'Отменено' ? '' : 'accent') : ''}</span></button>`;
  const rows = items => items.map(row).join('');
  const nav3 = (prev, next, label, reset) => `<div class="cal-nav">${iconBtn('Назад', prev, 'chevron-left')}<span class="cal-title">${esc(label)}</span>${iconBtn('Вперёд', next, 'chevron-right')}${reset ? btn('Сегодня', reset, 'small-btn') : ''}</div>`;
  let body = '';
  if (m.view === 'month') {

async function monEventBind(id) { const e = await getOne('monitorEvents', id); if (!e) return; const c = await monCaseFromSheet(e); if (!c) return; e.caseId = c.id; e.caseNum = c.number; e.uidConflict = false; e.ambiguous = false; if (e.status === 'new' && e.eventType === 'caseflow') e.status = 'flow'; e.reviewedAt = Date.now(); await put('monitorEvents', e); toast('Событие привязано к делу ' + c.number); monEventReopen(id); }

async function monEventDeadline(id) { const e = await getOne('monitorEvents', id); if (!e) return; const c = await monCaseFromSheet(e); if (!c) return; openDeadlineForm(c.id, '', { baseEv: e.title || '', baseDate: e.date || '', src: 'Мониторинг: ' + (e.source || ''), title: crmDlAppealMatch(e.title) ? 'Апелляционная жалоба' : '', kind: 'procedural', monitorEventId: e.eventType !== 'caseflow' ? e.id : '' }); }
async function monEventIgnore(id) { const e = await getOne('monitorEvents', id); if (!e) return; if (e.status === 'applied') { toast('Применённое событие нельзя пометить пропущенным', true); return; } e.status = 'ignored'; e.reviewedAt = Date.now(); await put('monitorEvents', e); toast('Событие оставлено без применения'); monEventReopen(id); }
async function monEventRestore(id) { const e = await getOne('monitorEvents', id); if (!e) return; e.status = e.caseId && e.eventType === 'caseflow' ? 'flow' : 'new'; delete e.autoSkip; await put('monitorEvents', e); toast('Событие снова в разборе'); monEventReopen(id); }

// ── карточка дела: лента «данные суда» и невнесённые заседания ──
function monitorCaseFlowHtml(c, events, hearings) {
  const miss = crmCaseFlowMissing(c, events, hearings);
  const flow = (events || []).filter(e => !e._deleted && e.eventType !== 'hearing' && e.eventType !== 'casecard' && crmFlowMatches(c, e)).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 12);
  if (!miss.length && !flow.length) return '';
  const missHtml = miss.length ? `<div class="info-box warning">Заседание с сайта суда не внесено в список (${miss.length})${miss.map(x => `<div class="contact-row" style="margin-top:8px"><span><b>${esc(fmtDate(x.e.date))}${x.time ? ' ' + esc(x.time) : ''}</b>${x.room ? ' · зал ' + esc(x.room) : ''}<br><span class="small muted">${esc(x.e.title || '')}</span></span><span class="contact-actions">${btn('Внести', `crmCaseFlowAdd('${jsq(x.e.id)}', '${jsq(c.id)}')`, 'small-btn primary', 'calendar-plus')}</span></div>`).join('')}</div>` : '';
  const flowHtml = flow.length ? `<div class="list-rows">${flow.map(e => { const pt = crmFlowParts(e); return `<button type="button" class="list-btn" onclick="openMonitorEventSheet('${jsq(e.id)}')"><span class="muted">${esc(e.date ? fmtDate(e.date) : '—')}</span><span>${esc(e.title || '')}${pt.res ? `<br><span class="muted small">${esc(pt.res)}</span>` : ''}${e.actApplied ? ' ' + badge('дата записана', 'good') : ''}</span></button>`; }).join('')}</div>` : '';
  return `<div class="section-label">Данные суда · ${miss.length + flow.length}</div>${missHtml}${flowHtml}`;
}
// ── настройка: лист «Мониторинг судов» с инструкцией ──
function openMonitorSettingsSheet(mode) {
  const col = crmCollectorSrvCfg(), auto = crmMonAutoOn(), st = monitorSettingsState(SRV.url, col, auto);
  openSheet('Мониторинг судов', `
    <div class="status-line ${st.ready ? 'good' : ''}" id="mon-state">${esc(st.lines.join(' '))}</div>
    <p>Программа следит за делами на сайтах судов: функция-коллектор в вашем Яндекс Облаке по таймеру (утром и днём) обходит ссылки на дела, собирает назначенные заседания, результаты и движение дела, и кладёт их на ваш личный сервер. Кнопка «Получить события» на экране «Суды и мониторинг» забирает их в программу. Заседания и даты актов применяются к делам сами, когда нет сомнений; спорное остаётся на разбор. Данные судов — не истина: сроки всегда подтверждаете вы.</p>
    <div class="section-label">Как подключить, один раз</div>
    <div class="info-box"><b>Шаг 1. Личный сервер.</b> Он уже нужен для синхронизации: Синхронизация → «Подключить сервер» (адрес функции crm-bridge и секретный код). События коллектора хранятся на нём.</div>
    <div class="info-box"><b>Шаг 2. Функция-коллектор в Яндекс Облаке.</b> Если вы разворачивали сервер мастером «Свой сервер одной кнопкой» в прежней программе, коллектор уже создан — адрес и секрет те же, что были в прежней программе (Настройки → Мониторинг → «Сбор в облаке»). Иначе: Яндекс Облако → Functions → создать функцию <b>collector-sud</b> (Node.js) из файла <b>collector-sud.mjs</b> — он лежит на сайте программы в разделе dist; переменные окружения: <b>BRIDGE_URL</b> — адрес вашего сервера crm-bridge, точно как в листе «Синхронизация»; <b>BRIDGE_SECRET</b> — секретный код этого сервера; <b>SECRET</b> — секрет самого коллектора (придумайте — его вводите ниже); таймер-триггер два раза в день. Мастер, который делает это за вас, появится в новой версии позже.</div>
    <div class="form-grid">${wide(fInput('col-url', 'Адрес функции коллектора', col.url, 'type="url" autocomplete="off" placeholder="https://functions.yandexcloud.net/…"'))}${wide(fInput('col-secret', 'Секрет коллектора (переменная SECRET функции collector-sud)', col.secret, 'type="password" autocomplete="off"'))}</div>
    <div class="form-actions" style="margin-top:8px">${btn('Сохранить', 'monitorCollectorSave()', 'primary', 'check')}${btn('Проверить', 'monitorCollectorStatus(true)', '', 'refresh-cw')}</div>
    <div class="info-box"><b>Шаг 3. Ссылки на дела.</b> В карточке дела (полная форма, «Основное» и вкладки инстанций) укажите ссылку на дело на сайте суда — коллектор ходит только по ним. Затем «Отправить список дел» ниже; при добавлении новых дел повторяйте.</div>
    <div class="form-actions">${btn('Отправить список дел', 'crmCollectorSendLinks()', '', 'arrow-right')}${btn('Собрать сейчас', 'monitorCollectorRun()', '', 'cloud-download')}</div>
    <div class="status-line" id="col-srv-status">${col.url && col.secret ? 'Серверный сбор: нажмите «Проверить»' : 'Серверный сбор: укажите адрес и секрет функции.'}</div>
    <div class="info-box warning" id="col-srv-hint" hidden></div>
    <div class="form-actions" style="margin-top:8px">${btn('Проверить доставку на сервер', 'monBridgeCheck()', '', 'shield-check')}</div>
    <div class="info-box" id="col-bridge" hidden></div>
    <div class="section-label">Как применяются данные</div>
    <label class="check"><input type="checkbox" id="mon-auto"${auto ? ' checked' : ''} onchange="localStorage.setItem('crm_mon_auto', this.checked ? '1' : '0'); toast(this.checked ? 'Данные суда применяются автоматически' : 'Автоприменение выключено — события разбираются вручную')"><span>Применять данные суда автоматически: заседания создаются, переносятся и дополняются; дата акта записывается, если поле в деле пустое. Спорное — на разбор.</span></label>
    <div class="info-box">Если события не приходят: проверьте, что «Собрать сейчас» отвечает без ошибки (403 — неверный секрет, 404 — неверный адрес), что у дел указаны ссылки, и что список дел отправлен. Запрос к сайтам судов идёт из Облака, не с вашего устройства.</div>`, mode || true);
}
function monitorCollectorSave() { localStorage.setItem('crm_collector_url', fv('col-url').trim().replace(/\/+$/, '')); localStorage.setItem('crm_collector_secret', fv('col-secret').trim()); if (typeof bumpSecrets === 'function') bumpSecrets('crm_collector_secret'); toast('Настройки сбора сохранены'); openMonitorSettingsSheet('replace'); }
async function monitorCollectorStatus(manual) {
  const el = document.getElementById('col-srv-status'), cfg = crmCollectorSrvCfg();
  if (!cfg.url || !cfg.secret) { if (el) el.textContent = 'Серверный сбор: укажите адрес и секрет функции.'; return null; }
  if (monColIsBridge(cfg.url, SRV.url)) { if (el) el.textContent = 'Серверный сбор: ' + MON_COL_BRIDGE_MSG; monCollectorHintRender(null); if (manual) toast('В поле адреса коллектора вписан адрес личного сервера', true); return null; }
  if (manual) toast('Запрашиваю состояние сбора…');
  const r = await crmCollectorCall({ action: 'status' }); if (!r) return null;
  // 403 (forbidden) — неверный секрет, 404 — неверный адрес: подсказка словами (crmCollectorHttpHint v270), а не код
  const bad = r.err || (r.j && r.j.error === 'unknown_action' ? MON_COL_BRIDGE_MSG : r.j && r.j.error === 'forbidden' ? 'секрет коллектора не подошёл (forbidden) — сверьте переменную SECRET функции collector-sud и поле «Секрет коллектора»' : r.http >= 400 ? crmCollectorHttpHint(r.http) : '');
  if (el) el.textContent = bad ? 'Серверный сбор: ' + bad : crmCollectorStatusLine(r.j);
  monCollectorHintRender(bad ? null : r.j);
  if (manual) toast(bad ? 'Коллектор: ' + bad : 'Коллектор ответил', !!bad);
  return r;
}
async function monitorCollectorRun() {
  const el = document.getElementById('col-srv-status'); if (el) el.textContent = 'Серверный сбор: выполняется — до 8 минут, не закрывайте страницу…';
  toast('Сбор запущен — это может занять несколько минут');
  const r = await crmCollectorCall({ action: 'collect' }, 590000); if (!r) return;
  if (r.err) { toast('Сбой запуска сбора: ' + r.err, true); monitorCollectorStatus(false); return; }
  const j = r.j; if (j && ('ok' in j)) { if (el) el.textContent = crmCollectorStatusLine(j); monCollectorHintRender(j); toast(j.ok ? `Сбор завершён: событий ${j.events ?? 0}, новых ${j.added ?? 0}` : 'Сбор завершился с ошибкой: ' + (j.error || ''), !j.ok); if (j.ok && (j.added || j.updated)) await monitorPull(); } else toast('Ответ функции не распознан (HTTP ' + r.http + ')', true);
}

// ═══ next/boot.js — запуск новой версии ═══
// 1) изоляция от прежней версии проверена — иначе останавливаемся, ничего не трогая;
// 2) каркас рисуется сразу (тема применена ещё при загрузке ui/shell.js); 3) слой данных на СВОЕЙ базе; 4) экран «Сегодня».
// window.NEXT_READY — отчёт для живой проверки (next_check.py): база, число записей, версия правил сроков.
const NEXT_BOOT = {
  say(msg, warn) { // остановка до запуска интерфейса — отдельный экран с причиной; обычные сообщения — через toast
    if (!warn) { toast(msg); return; }
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div class="stop-screen panel pad"><h2>Новая версия остановлена</h2><p class="muted" style="margin-top:10px">${esc(msg)}</p></div>`;
  },
  async report() {
    const counts = {}; for (const st of STORES) counts[st] = (await getAllRaw(st)).length;
    return { версия: APP_VER, сборка: BUILD_ID, изоляция: NEXT_NS.ok, база: db && db.name, версияБазы: db && db.version, правилаСроков: RULES_VER, секреты: _sec.ok, записей: counts };
  },
  async start() {
    if (!NEXT_NS.ok) { this.say('Изоляция от прежней версии не сработала (' + NEXT_NS.why + ') — программа остановлена, данные не тронуты.', true); return; }
    shellRender(); nav('today');
    try { await dataInit(); } catch (e) { logErr('next:init', e); this.say('Сбой запуска слоя данных: ' + ((e && e.message) || e), true); return; }
    try { await refreshCasesCache(); } catch (e) { logErr('next:cases-cache', e); }
    // v312: прошедшим заседаниям без результата — статус «Дата прошла» (data/hearings.js, как при запуске прежней программы)
    try { await hearingsAutoDone(); } catch (e) { logErr('next:hearings-auto', e); }
    syncStatusRender(); // этап 1г: состояние синхронизации в шапке — после запуска слоя данных (секреты уже прочитаны)
    UI.ready = true; await nav('today');
    window.NEXT_READY = await this.report();
  },
};
document.addEventListener('DOMContentLoaded', () => { NEXT_BOOT.start().then(() => { if (typeof nextAutoStart === 'function') setTimeout(() => { try { nextAutoStart(); } catch (e) { logErr('auto:start', e); } }, 2500); }); });
// Обновление программы (аудит 02.10.2026): новая версия service worker ждёт согласия пользователя — полоса «Доступна новая
// версия» с кнопками «Обновить» и «Позже». Раньше программа согласия не спрашивала, и новая версия включалась только после
// закрытия всех вкладок. «Позже» убирает полосу до следующего запуска.
const NEXT_UPDATE = { reg: null, asked: false, done: false };
function nextUpdateOffer(reg) {
  NEXT_UPDATE.reg = reg || NEXT_UPDATE.reg; if (document.getElementById('upd-bar')) return;
  const bar = document.createElement('div'); bar.id = 'upd-bar'; bar.className = 'upd-bar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span>Доступна новая версия программы. Обновление перезагрузит страницу — сначала сохраните открытую форму.</span><span class="upd-actions"><button type="button" class="button primary" id="upd-go" onclick="nextUpdateApply()">Обновить</button><button type="button" class="button" id="upd-later" onclick="nextUpdateLater()">Позже</button></span>';
  document.body.appendChild(bar);
}
function nextUpdateLater() { const b = document.getElementById('upd-bar'); if (b) b.remove(); }
function nextUpdateReload() { if (NEXT_UPDATE.done) return; NEXT_UPDATE.done = true; location.reload(); }
function nextUpdateApply() {
  const w = NEXT_UPDATE.reg && NEXT_UPDATE.reg.waiting; NEXT_UPDATE.asked = true; nextUpdateLater();
  if (!w) { nextUpdateReload(); return; }
  w.postMessage({ type: 'SKIP_WAITING' }); setTimeout(nextUpdateReload, 3000);
}
function nextUpdateWatch(reg) {
  if (!reg || typeof reg.addEventListener !== 'function') return;
  const offer = () => { if (reg.waiting && navigator.serviceWorker.controller) nextUpdateOffer(reg); };
  offer();
  reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(); }); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (NEXT_UPDATE.asked) nextUpdateReload(); });
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) { // https или локальная проверка
  // своя область /next/ (sw.js лежит рядом с index.html в папке next) — прежний sw.js в корне сюда не относится
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope: './' }).then(nextUpdateWatch).catch(e => logErr('next:sw', e)); });
}
