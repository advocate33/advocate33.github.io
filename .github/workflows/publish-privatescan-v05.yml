name: Publish PrivateScan v0.5 APK
on:
  push:
    branches: [privatescan-v05-cascade-20261030]
    paths: ['.github/workflows/publish-privatescan-v05.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled and verified APK
        uses: actions/download-artifact@v4
        with:
          name: PrivateScan-debug-apk
          run-id: 41127410660
          github-token: ${{ github.token }}
          path: ./release
      - name: Integrity check and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          unzip -tq release/app-debug.apk
          mv release/app-debug.apk release/PrivateScan-v0.5-cascade-test.apk
          sha256sum release/PrivateScan-v0.5-cascade-test.apk > release/SHA256SUMS.txt
      - name: Upload APK to public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "privatescan-v0.5" \
            release/PrivateScan-v0.5-cascade-test.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrivateScan v0.5 — каскадная съемка и A4 (тест)" \
            --prerelease \
            --notes "ВНИМАНИЕ: тестовая версия. Каскадная съёмка CameraX + OpenCV: обнаружение листа, проверка устойчивости и резкости, автофокус, автоматический снимок, ожидание смены листа; кнопка Готово формирует многостраничный улучшенный PDF A4 и отдельный исходный PDF. Векторная иконка, кнопка проверки обновлений GitHub (для реальных обновлений нужен фиксированный signing key из GitHub Actions Secrets). ChatGPT OAuth: добавлен выбор Chrome, но полная авторизация ещё не проверена на смартфоне. Нельзя считать безопасным хранением адвокатской тайны; сначала тестируйте на обезличенных документах. Установится отдельно от 0.4."
